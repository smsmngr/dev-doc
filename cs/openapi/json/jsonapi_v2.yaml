openapi: 3.1.0
info:
  title: JSON API
  description: |
    API pro odesílání zpráv přes SMS, Viber, WhatsApp, RCS a další komunikační kanály.

    ## JSON API v2

    API klíč je vyžadován pro všechny požadavky. Svůj API klíč najdete v [nastavení účtu](https://app.smsmanager.com/api-cloud).

    Starší verze API (http-api a xml-api) jsou zastaralé a místo nich byste měli používat toto JSON API v2.
  version: v2
  contact:
    url: https://smsmanager.cz
    email: cc@smsmanager.cz

servers:
  - url: 'https://api.smsmngr.com/v2'
    description: Odpoví s daty vašeho požadavku

components:
  schemas:
    Message:
      type: object
      required:
        - to
      properties:
        body:
          type: string
          maxLength: 1000
          description: Tělo zprávy (pokud není definováno ve flow). Tělo je povinné buď zde v kořenovém objektu, nebo v kroku flow. Delší texty jsou zkráceny na 1000 znaků.
        to:
          type: array
          minItems: 1
          maxItems: 10
          description: Seznam příjemců.
          items:
            type: object
            properties:
              phone_number:
                type: string
                description: Telefonní číslo příjemce. Doporučujeme mezinárodní formát (E.164, bez úvodního `+` nebo `00`), ale akceptujeme i jiné formáty (před přijetím požadavku číslo převedeme do mezinárodního formátu).
                example: "420777123456"
            required:
              - phone_number
        sender:
          type: string
          description: Výchozí odesílatel pro všechny kroky flow. Pokud krok flow definuje vlastní `sender`, má hodnota z kroku flow vyšší prioritu. Alfanumerický název odesílatele (max. 11 znaků, může být vyžadována předchozí registrace) nebo dedikované virtuální číslo (bez `+`).
          examples:
            - Mojefirma
            - "420777123456"
        callback:
          oneOf:
            - type: string
              format: uri
            - type: object
          description: Callback URL pro příjem notifikací o doručení (Webhook, viz [Webhooks](#tag/Webhooks)). Můžete předat prostý řetězec s URL, nebo objekt s rozšířenou konfigurací callbacku.
        tag:
          type: string
          default: 'promotional'
          description: 'Tag zprávy. Můžete jej použít pro seskupování zpráv (např. podle id kampaně). Více tagů lze předat oddělených čárkou. Tagy jsou normalizovány na malá písmena a jsou zachovány pouze znaky `a-z`, `0-9`, `-`, `.` a `_`. Existují také speciální tagy: `priority` (pro prioritní zprávy), `transactional` (pro transakční zprávy). Zprávy s výchozím tagem `promotional` jsou kontrolovány proti opt-out seznamu příjemců.'
        messageTag:
          type: string
          deprecated: true
          description: Zastaralý alias pole `tag`. Použijte `tag`.
        params:
          type: object
          description: 'Tímto objektem můžete zprávě předat speciální parametry, např. automatické zkracování odkazů přes objekt `_url`. Zeptejte se nás, jak tento parametr použít pro další funkce.'
          properties:
            _url:
              type: object
              description: Automatické zkracování odkazů. Odkazy nalezené v těle zprávy jsou nahrazeny krátkými přesměrovacími odkazy.
              properties:
                type:
                  type: string
                  enum:
                    - full
                    - all
                  default: full
                  description: '`full` zkracuje pouze úplné URL včetně protokolu (např. `https://example.com/page`). `all` zkracuje všechny nalezené domény a adresy.'
                domain:
                  type: string
                  description: Vlastní doména použitá pro zkrácené odkazy (musí být předem nakonfigurována pro váš účet).
                get_enhance:
                  type: string
                  enum:
                    - id
                  description: Pokud je nastaveno na `id`, ke zkrácenému odkazu se jako query parametr připojí unikátní `message_id`, takže po prokliku můžete identifikovat příjemce.
                get_name:
                  type: string
                  default: '_'
                  description: Název query parametru použitého pro `get_enhance`.
                expires_at:
                  type: integer
                  description: Unix timestamp expirace zkráceného odkazu. Výchozí hodnota je 7 dní od odeslání. (Zastaralý alias `expires` je stále akceptován.)
                  example: 1736589600
        datetime:
          type: string
          format: date-time
          description: Naplánovaný čas odeslání zprávy. Vždy v UTC. Pokud je čas více než 1 minutu v budoucnosti, zpráva je naplánována a zpracována v daný čas. Časy v minulosti jsou odeslány okamžitě.
          example: "2025-01-11T10:00:00Z"
        delivery_time:
          type: object
          description: Povolené doručovací okno. Pokud je aktuální (nebo naplánovaný) čas mimo okno, odeslání se posune na nejbližší platný čas.
          properties:
            days:
              type: array
              items:
                type: string
                enum:
                  - monday
                  - tuesday
                  - wednesday
                  - thursday
                  - friday
                  - saturday
                  - sunday
              description: Dny v týdnu, kdy je doručení povoleno.
            start:
              type: string
              description: Začátek doručovacího okna.
              example: 08:00
            end:
              type: string
              description: Konec doručovacího okna.
              example: 21:00
            tz:
              type: string
              description: Časová zóna doručovacího okna.
              example: Europe/Prague, Europe/London, Europe/Berlin, America/New_York
              default: UTC
        flow:
          type: array
          description: |
            Seznam komunikačních kanálů pro flow zprávy. Pokud je definován, nesmí být prázdný. Můžete použít více kanálů, na pořadí záleží (první kanál se použije jako první; pokud krok definuje `ttl` a jeho `ttl_condition` není v rámci TTL splněna, použije se další kanál, atd.). Pokud `flow` není definováno, použije se výchozí `[{"sms": {"gateway": "high"}}]`.
          items:
            type: object
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
            properties:
              sms:
                type: object
                properties:
                  body:
                    type: string
                    maxLength: 1000
                    description: Tato definice těla zprávy má vyšší prioritu než definice v kořenovém objektu.
                  sender:
                    type: string
                    description: Alfanumerický název odesílatele (max. 11 znaků, může být vyžadována předchozí registrace) nebo dedikované virtuální číslo (bez `+`). Pokud není nastaven, použije se `sender` z kořenového objektu.
                    examples:
                      - Mojefirma
                      - 420777123456
                  gateway:
                    type: string
                    enum:
                      - high
                      - lowcost
                      - direct
                      - custom
                      - simhost
                      - gsm
                    default: high
                    description: Použijte `high` pro výchozí vysoce kvalitní směrování, `lowcost` pro nízkonákladové směrování. Použijte `direct`, pokud používáte dedikované virtuální číslo. Použijte `custom` nebo `simhost`, pokud používáte SIM hosting, `gsm` pro vlastní GSM bránu.
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Doba platnosti v minutách. Pokud je definován další krok flow a `ttl_condition` není v rámci TTL splněna, zpráva pokračuje dalším krokem flow.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: sent
                    description: Podmínka vyhodnocená po vypršení TTL. Pokud zpráva již dosáhla tohoto stavu, další krok flow se nepoužije.
                  type:
                    type: string
                    enum:
                      - sms
                      - utf
                    default: utf
                    description: Nastavte `utf`, pokud chcete ve zprávě zachovat unicode znaky. Nastavte `sms`, pokud chcete unicode znaky převést nebo odstranit a zachovat tak maximální kapacitu SMS.
                required:
                  - body
              viber:
                type: object
                properties:
                  body:
                    type: string
                    maxLength: 1000
                    description: Tato definice těla zprávy má vyšší prioritu než definice v kořenovém objektu.
                  sender:
                    type: string
                    description: Použijte název odesílatele, který máte předem zaregistrovaný pro Viber Business Message.
                  buttons:
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      required:
                        - title
                        - url
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                          format: uri
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Doba platnosti v minutách. Pokud je definován další krok flow a `ttl_condition` není v rámci TTL splněna, zpráva pokračuje dalším krokem flow.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: delivered
                    description: Podmínka vyhodnocená po vypršení TTL. Pokud zpráva již dosáhla tohoto stavu, další krok flow se nepoužije.
                required:
                  - body
                  - sender
              whatsapp_text:
                type: object
                properties:
                  body:
                    type: string
                    description: Tato definice těla zprávy má vyšší prioritu než definice v kořenovém objektu. Vlastní tělo zprávy můžete použít pouze v případě, že příjemce již odpověděl na vaši šablonovou zprávu nebo vám první napsal.
                    maxLength: 1000
                  sender:
                    type: string
                    description: Phone Number ID registrovaného WhatsApp čísla. Najdete jej ve svém [nastavení WhatsApp](https://app.smsmanager.com/whatsapp).
                    examples:
                      - "514578330250514"
                required:
                  - body
                  - sender
              whatsapp_template:
                type: object
                properties:
                  template_name:
                    type: string
                    description: Název šablony, kterou máte předem zaregistrovanou a schválenou.
                    maxLength: 100
                  sender:
                    type: string
                    description: Phone Number ID registrovaného WhatsApp čísla. Najdete jej ve svém [nastavení WhatsApp](https://app.smsmanager.com/whatsapp).
                    examples:
                      - "514578330250514"
                  params:
                    type: array
                    items:
                      type: string
                    description: Pokud má vaše šablona parametry, zde předejte jejich hodnoty.
                  params_header:
                    type: array
                    items:
                      type: string
                    description: Pokud má vaše šablona hlavičku s parametrem, zde předejte jeho hodnotu.
                  params_buttons:
                    type: array
                    items:
                      type: string
                    description: Pokud mají tlačítka vaší šablony parametry, zde předejte jejich hodnoty.
                  language:
                    type: string
                    examples:
                      - en
                      - cs
                    description: Jazyk šablony (stejnou šablonu můžete mít ve více jazycích).
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Doba platnosti v minutách. Pokud je definován další krok flow a `ttl_condition` není v rámci TTL splněna, zpráva pokračuje dalším krokem flow.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: delivered
                    description: Podmínka vyhodnocená po vypršení TTL. Pokud zpráva již dosáhla tohoto stavu, další krok flow se nepoužije.
                required:
                  - template_name
                  - language
                  - sender
              rcs:
                type: object
                properties:
                  body:
                    type: string
                    maxLength: 1000
                    description: Tato definice těla zprávy má vyšší prioritu než definice v kořenovém objektu.
                  sender:
                    type: string
                    description: Použijte RCS agenta, kterého máte předem zaregistrovaného pro váš účet.
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Doba platnosti v minutách. Pokud je definován další krok flow a `ttl_condition` není v rámci TTL splněna, zpráva pokračuje dalším krokem flow.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: delivered
                    description: Podmínka vyhodnocená po vypršení TTL. Pokud zpráva již dosáhla tohoto stavu, další krok flow se nepoužije.
                required:
                  - body
        payload:
          type: object
          description: |
            Můžete odeslat payload zprávy, kde si můžete definovat libovolné parametry zprávy. Tento objekt je vrácen v notifikaci o doručení a v odpovědích.
          example:
            user_id: "123456"

    MessagesResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unikátní identifikátor požadavku.
        accepted:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index původního požadavku z pole v těle.'
              message_id:
                type: string
                description: Unikátní identifikátor zprávy pro každý požadavek z pole v těle.
        rejected:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index původního požadavku z pole v těle.'

    MessageResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unikátní identifikátor požadavku.
        accepted:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index původního příjemce z pole `to`.'
              message_id:
                type: string
                description: Unikátní identifikátor přijaté zprávy.
        rejected:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index původního příjemce z pole `to`.'
    MessageSimpleResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unikátní identifikátor požadavku.
          example: "bc36f3d1-d284-463a-921b-a3560c154649"
        message_id:
          type: string
          description: Unikátní identifikátor zprávy.
          example: "bc36f3d1-d284-463a-921b-a3560c154649"
        accepted:
          type: boolean
          description: True, pokud byla zpráva přijata, false, pokud byla odmítnuta.
          example: true
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
    apikey:
      type: apiKey
      in: query
      name: apikey


paths:
  /message:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Odeslat zprávu"
      security:
        - x-api-key: [] # API klíč je vyžadován pro všechny požadavky. Svůj API klíč najdete v [nastavení účtu](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Odeslání zprávy
      description: |
        Tento endpoint použijte pro odeslání zprávy jednomu nebo více příjemcům (až 10 příjemců). Pokud chcete použít jiné kanály než SMS (Viber, WhatsApp, RCS atd.), použijte vlastnost `flow`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
            examples:
              Simple message:
                value:
                  body: "Test message"
                  to:
                    - phone_number: "420777123456"
              Message with flow:
                value:
                  body: "Test message"
                  to:
                    - phone_number: "420777123456"
                  flow:
                    - sms:
                        sender: "SmsManager"
                        gateway: "high"
                        ttl: 10
              Flow fallback Viber to SMS:
                description: Zpráva je nejprve odeslána přes Viber. Pokud není do 10 minut doručena, je odeslána znovu jako SMS.
                value:
                  to:
                    - phone_number: "420777123456"
                  flow:
                    - viber:
                        body: "Your order is ready for pickup"
                        sender: "Mojefirma"
                        ttl: 10
                        ttl_condition: "delivered"
                    - sms:
                        body: "Your order is ready for pickup"
                        sender: "Mojefirma"
              Scheduled message:
                value:
                  body: "Meeting reminder"
                  to:
                    - phone_number: "420777123456"
                  datetime: "2025-01-11T10:00:00Z"
              Message with delivery window:
                description: Zpráva je doručována pouze v pracovní dny mezi 8:00 a 21:00 pražského času. Mimo toto okno se odeslání posune na nejbližší platný čas.
                value:
                  body: "New products in our store!"
                  to:
                    - phone_number: "420777123456"
                  delivery_time:
                    days:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                    start: "08:00"
                    end: "21:00"
                    tz: "Europe/Prague"
              Message with callback and payload:
                value:
                  body: "Order shipped"
                  to:
                    - phone_number: "420777123456"
                  callback: "https://example.com/delivery"
                  payload:
                    order_id: "ORD-1001"
              Message with link shortening:
                description: Odkaz v těle zprávy je nahrazen krátkým přesměrovacím odkazem s `message_id` připojeným jako query parametr `c`.
                value:
                  body: "Rate your purchase at https://example.com/review"
                  to:
                    - phone_number: "420777123456"
                  params:
                    _url:
                      type: "full"
                      get_enhance: "id"
                      get_name: "c"
                      expires_at: 1736589600
              Unicode SMS with custom TTL:
                value:
                  body: "Привет, Ваш код: 1234"
                  to:
                    - phone_number: "420777123456"
                  tag: "transactional"
                  flow:
                    - sms:
                        sender: "SmsManager"
                        type: "utf"
                        ttl: 5
      responses:
        '200':
          description: Zprávy byly úspěšně odeslány
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    rejected: []
                Partially rejected:
                  value:
                    request_id: "77777777-7777-7777-7777-777777777777"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    rejected:
                      - key: "1"
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    description: Chybová zpráva.
                    example: User is not authorized to access this resource with an explicit deny

  /message/priority:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Prioritní zpráva"
      security:
        - x-api-key: [] # API klíč je vyžadován pro všechny požadavky. Svůj API klíč najdete v [nastavení účtu](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Odeslání prioritní zprávy
      description: |
        Stejné jako `/message`, ale zpráva je zpracována prioritní frontou. Použijte pro časově kritické zprávy (jednorázová hesla, transakční notifikace). Formát požadavku i odpovědi je shodný s `/message`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
            examples:
              One-time password:
                value:
                  body: "Your verification code is 123456"
                  to:
                    - phone_number: "420777123456"
                  tag: "transactional"
              Transactional notification with flow:
                value:
                  to:
                    - phone_number: "420777123456"
                  tag: "transactional"
                  flow:
                    - sms:
                        body: "Your payment was received."
                        sender: "Mojefirma"
      responses:
        '200':
          description: Zprávy byly úspěšně odeslány
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    rejected: []
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    description: Chybová zpráva.
                    example: User is not authorized to access this resource with an explicit deny

  /messages:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Odeslat více"
      security:
        - x-api-key: [] # API klíč je vyžadován pro všechny požadavky. Svůj API klíč najdete v [nastavení účtu](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Odeslání více zpráv
      description: |
        Tento endpoint použijte pro odeslání dávky zpráv více příjemcům (můžete nastavit až 10 příjemců na požadavek a až 10 požadavků v jednom API volání). To znamená, že jedním HTTP API voláním můžete oslovit až 100 příjemců. Pokud chcete použít jiné kanály než SMS (Viber, WhatsApp atd.), použijte vlastnost `flow`. Při použití tohoto endpointu obdržíte `message_id` pro každý požadavek (ne pro každého příjemce). Pro získání message_id každého příjemce připojte k `message_id` příponu `-<index_příjemce>`. Více informací o message_id najdete v [dokumentaci](#sending/paths/~1messages/post/response&c=200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/Message'
            examples:
              Two requests with multiple recipients:
                value:
                  - body: "Hello John"
                    to:
                      - phone_number: "420777123456"
                      - phone_number: "420777654321"
                  - body: "Hello Jane"
                    to:
                      - phone_number: "420777115577"
                      - phone_number: "420777223344"
              Mixed channels:
                value:
                  - body: "Promo SMS"
                    to:
                      - phone_number: "420777111111"
                    flow:
                      - sms:
                          sender: "PromoSMS"
                          gateway: "high"
                  - body: "Promo Viber"
                    to:
                      - phone_number: "420777222222"
                    flow:
                      - viber:
                          sender: "PromoViber"
                          ttl: 2
              Scheduled batch:
                value:
                  - body: "Scheduled greetings"
                    to:
