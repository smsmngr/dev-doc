tags:
  - name: sending
    x-displayName: Odesílání
    description: |
      Pro odesílání zpráv použijte jeden z následujících endpointů.
      - `/message` pro odeslání zprávy až 10 příjemcům
      - `/message/priority` pro odeslání prioritní zprávy (zpracována prioritní frontou)
      - `/messages` pro odeslání více zpráv (až 10 zpráv najednou)
      - `/simple/message` pro odeslání jednoduché zprávy (GET a POST)
