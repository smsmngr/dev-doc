  sentMessage:
    post:
      tags:
        - Webhooks
      summary: Webhook odeslané zprávy
      description: |
        Tento webhook vám posílá informace o odeslaných zprávách. Můžete jej použít pro uložení informací o odeslaných zprávách, jako je message_id, gateway, timestamp, payload atd.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  request_id:
                    type: string
                    example: "bc36f3d1-d284-463a-921b-a3560c154649"
                  message_id:
                    type: string
                    description: Unikátní identifikátor zprávy. (Pokud používáte endpoint `/messages`, obdržíte `message_id` s připojenou příponou `-<index_příjemce>`.)
                    example: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
                  gateway:
                    description: Použité `flow` zprávy.
                    type: string
                    enum:
                      - sms
                      - viber
                      - whatsapp_text
                      - whatsapp_template
                      - rcs
                    example: sms
                  timestamp:
                    type: integer
                    example: 1700000000
                  payload:
                    type: object
                    example:
                      campaign_id: "winter-sale"
                  type:
                    type: string
                    default: outgoing
                  to:
                    type: object
                    properties:
                      phone_number:
                        type: string
                        example: "420777123456"
                  result:
                    description: Výsledek odeslání zprávy. Nejprve obdržíte stav `sent`, poté následují další stavy. Pokud je zpráva `rejected`, znamená to, že zpráva nebyla vůbec odeslána (typickým důvodem je nedostatečný kredit nebo neplatné telefonní číslo).
                    type: string
                    enum:
                      - delivered
                      - undelivered
                      - rejected
                      - failed
                      - sending
                      - sent
                      - seen
                  result_info:
                    type: string
                    description: |
                      Doplňkový kód výsledku zprávy ve formátu "[kód] Popis". Kód je volitelný, popis také. Result info může obsahovat jen kód v hranatých závorkách nebo jen popis bez kódu.

                      Časté kódy odmítnutí:
                      - `[302]` Neplatný formát telefonního čísla
                      - `[303]` Telefonní číslo není v povoleném seznamu
                      - `[304]` Telefonní číslo je na blacklistu nebo opt-out seznamu
                      - `[306]` Příliš mnoho stejných zpráv pro stejného příjemce
                      - `[307]` Nedostatečný kredit
                    examples:
                      - "[307] Insufficient credit"
                      - "[131042] There was an error related to your payment method"
                      - "Unauthorized error"
                      - "[368]"
                  sms:
                    type: object
                    properties:
                      gateway:
                        description: Použité specifické nastavení brány pro zprávu.
                        type: string
                      sender:
                        description: Použitý odesílatel zprávy.
                        type: string
                      country:
                        description: Použitá země zprávy (oficiální kód `MCC`).
                        type: integer
                      operator:
                        description: Použitý operátor zprávy (oficiální kód `MNC` nebo `0` pro neznámého/obecného operátora).
                        type: integer
                      price_czk:
                        description: Cena zprávy v CZK.
                        type: number
                      price_eur:
                        description: Cena zprávy v EUR.
                        type: number
                      count:
                        description: Počet částí (kolik zpráv bylo účtováno).
                        type: integer
                  whatsapp_template:
                    type: object
                    properties:
                      sender:
                        description: Použitý odesílatel zprávy.
                        type: string
                      country:
                        description: Použitá země zprávy (oficiální kód `MCC`).
                        type: integer
                      operator:
                        description: Použitý operátor zprávy (oficiální kód `MNC` nebo `0` pro neznámého/obecného operátora).
                        type: integer
                      price_czk:
                        description: Cena zprávy v CZK.
                        type: number
                      price_eur:
                        description: Cena zprávy v EUR.
                        type: number
                      count:
                        description: Počet částí (kolik zpráv bylo účtováno).
                        type: integer
                  viber:
                    type: object
                    properties:
                      sender:
                        description: Použitý odesílatel zprávy.
                        type: string
                      country:
                        description: Použitá země zprávy (oficiální kód `MCC`).
                        type: integer
                      operator:
                        description: Použitý operátor zprávy (oficiální kód `MNC` nebo `0` pro neznámého/obecného operátora).
                        type: integer
                      price_czk:
                        description: Cena zprávy v CZK.
                        type: number
                      price_eur:
                        description: Cena zprávy v EUR.
                        type: number
                      count:
                        description: Počet částí (kolik zpráv bylo účtováno).
                        type: integer
                  whatsapp_body:
                    type: object
                    properties:
                      sender:
                        description: Použitý odesílatel zprávy.
                        type: string
                      country:
                        description: Použitá země zprávy (oficiální kód `MCC`).
                        type: integer
                      operator:
                        description: Použitý operátor zprávy (oficiální kód `MNC` nebo `0` pro neznámého/obecného operátora).
                        type: integer
