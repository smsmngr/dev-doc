                    type: string
                    description: Chybová zpráva.
                    example: User is not authorized to access this resource with an explicit deny

  /simple/message:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Jednoduchá (GET)"
      security:
        - apikey: [] # API klíč je vyžadován pro všechny požadavky. Svůj API klíč najdete v [nastavení účtu](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Odeslání jednoduché zprávy (GET request)
      description: |
        Zjednodušené odeslání jedné SMS pomocí query string parametrů. Pro plnou funkčnost (flow, více příjemců, doručovací okno, ...) použijte `/message`.
      parameters:
        - name: apikey
          in: query
          required: true
          schema:
            type: string
          description: Váš API klíč.
        - name: phone_number
          in: query
          required: true
          schema:
            type: string
          description: Telefonní číslo příjemce (akceptován je i alias `number`).
          example: "420777123456"
        - name: message
          in: query
          required: true
          schema:
            type: string
          description: Tělo zprávy (akceptován je i alias `body`).
        - name: sender
          in: query
          required: true
          schema:
            type: string
          description: Název odesílatele nebo virtuální číslo (může být vyžadována předchozí registrace).
        - name: gateway
          in: query
          required: false
          schema:
            type: string
            enum:
              - high
              - lowcost
              - direct
              - custom
              - simhost
              - gsm
            default: high
          description: SMS brána použitá pro odeslání.
        - name: datetime
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Naplánovaný čas odeslání zprávy, v UTC (akceptován je i alias `time`).
          example: "2025-01-11T10:00:00Z"
        - name: customID
          in: query
          required: false
          schema:
            type: string
          description: Váš vlastní identifikátor zprávy. Je uložen v `payload` zprávy (jako `customID`) a vrácen v notifikacích o doručení.
      responses:
        '200':
          description: Jednoduchá zpráva byla úspěšně odeslána
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSimpleResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    accepted: true
                Rejected invalid sender:
                  value:
                    request_id: "77777777-7777-7777-7777-777777777777"
                    accepted: false
                Rejected missing parameter:
                  value:
                    request_id: "88888888-8888-8888-8888-888888888888"
                    accepted: false
                Accepted message with accents:
                  value:
                    request_id: "99999999-9999-9999-9999-999999999999"
                    message_id: "uuuuuuuu-vvvv-wwww-xxxx-yyyyyyyyyyyy"
                    accepted: true
                Accepted high priority:
                  value:
                    request_id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                    message_id: "zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz"
                    accepted: true
        '400':
          description: Neplatný požadavek

    post:
      x-mint:
        metadata:
          sidebarTitle: "Jednoduchá (POST)"
      security:
        - x-api-key: [] # API klíč je vyžadován pro všechny požadavky. Svůj API klíč najdete v [nastavení účtu](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Odeslání jednoduché zprávy (POST request)
      description: |
        Zjednodušené odeslání jedné SMS pomocí formulářových parametrů. Pro plnou funkčnost (flow, více příjemců, doručovací okno, ...) použijte `/message`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - phone_number
                - message
                - sender
              properties:
                phone_number:
                  type: string
                  description: Telefonní číslo příjemce (akceptován je i alias `number`).
                  example: "420777123456"
                message:
                  type: string
                  description: Tělo zprávy (akceptován je i alias `body`).
                sender:
                  type: string
                  description: Název odesílatele nebo virtuální číslo (může být vyžadována předchozí registrace).
                gateway:
                  type: string
                  enum:
                    - high
                    - lowcost
                    - direct
                    - custom
                    - simhost
                    - gsm
                  default: high
                  description: SMS brána použitá pro odeslání.
                datetime:
                  type: string
                  format: date-time
                  description: Naplánovaný čas odeslání zprávy, v UTC (akceptován je i alias `time`).
                  example: "2025-01-11T10:00:00Z"
                customID:
                  type: string
                  description: Váš vlastní identifikátor zprávy. Je uložen v `payload` zprávy (jako `customID`) a vrácen v notifikacích o doručení.
            examples:
              Basic message:
                value:
                  phone_number: "420777123456"
                  message: "Test message"
                  sender: "Mojefirma"
              Message with customID:
                value:
                  phone_number: "420777123456"
                  message: "Order confirmed"
                  sender: "Mojefirma"
                  customID: "ORD-1001"
              Scheduled message:
                value:
                  phone_number: "420777123456"
                  message: "Meeting reminder"
                  sender: "Mojefirma"
                  datetime: "2025-01-11T10:00:00Z"
      responses:
        '200':
          description: Jednoduchá zpráva byla úspěšně odeslána
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSimpleResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "11111111-1111-1111-1111-111111111111"
                    message_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                    accepted: true
                Rejected invalid number:
                  value:
                    request_id: "22222222-2222-2222-2222-222222222222"
                    accepted: false
                Rejected insufficient credit:
                  value:
                    request_id: "33333333-3333-3333-3333-333333333333"
                    accepted: false
                Accepted promo message:
                  value:
                    request_id: "44444444-4444-4444-4444-444444444444"
                    message_id: "ffffffff-gggg-hhhh-iiii-jjjjjjjjjjjj"
                    accepted: true
                Accepted transactional message:
                  value:
                    request_id: "55555555-5555-5555-5555-555555555555"
                    message_id: "kkkkkkkk-llll-mmmm-nnnn-oooooooooooo"
                    accepted: true
        '400':
          description: Neplatný požadavek
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unikátní identifikátor požadavku.
                    example: "bc36f3d1-d284-463a-921b-a3560c154649"
                  accepted:
                    type: boolean
                    description: True, pokud byla zpráva přijata, false, pokud byla odmítnuta.
                    example: false
        '415':
          description: 'Špatný Content-Type'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Podporován je pouze Content-Type:application/x-www-form-urlencoded
                    example: 'Unsupported Media Type '

