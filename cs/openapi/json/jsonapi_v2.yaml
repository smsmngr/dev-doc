              examples:
                Accepted two requests with multiple recipients:
                  description: Dva požadavky s více příjemci. Pozor, při použití endpointu `/messages` obdržíte `message_id` pro každý požadavek (ne pro každého příjemce). Pro získání message_id každého příjemce připojte k `message_id` příponu `-<index_příjemce>`. Například pokud máte dva příjemce v prvním požadavku, první příjemce bude mít `message_id` `pppppppp-qqqq-rrrr-ssss-tttttttttttt-0` a druhý příjemce `pppppppp-qqqq-rrrr-ssss-tttttttttttt-1`.
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                      - key: "1"
                        message_id: "uuuuuuuu-vvvv-wwww-xxxx-yyyyyyyyyyyy"
                    rejected: []
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                type: object
                properties:
