                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                          description: Tagy nalezené pro dané datum.
                        stats:
                          type: object
                          properties:
                            count_delivered:
                              type: integer
                            count_seen:
                              type: integer
                            count_clicked:
                              type: integer
                            count_nondelivered:
                              type: integer
                            count_sent:
                              type: integer
                            count_notsent:
                              type: integer
                            count_replied:
                              type: integer
                            count_optout:
                              type: integer
                            msg_sent:
                              type: integer
