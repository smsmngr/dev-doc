                                  description: Čítače podle kroků flow, klíčované indexem kroku a dále kanálem (např. `sms`, `whatsapp_template`). Doručovací metriky (`delivered`, `nondelivered`, `seen`, `clicked`, `replied`, `optout`) počítají každou zprávu v rámci kroku nejvýše jednou; `sent` a `notsent` počítají pokusy o odeslání.
