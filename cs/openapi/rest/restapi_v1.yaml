openapi: 3.1.0
info:
  title: REST API SmsManager
  description: |
    REST API pro správu vašeho účtu SmsManager: API klíče, kredit, fakturace, kontaktní seznamy (blacklist / opt-out), zjišťování stavu zpráv, přijaté zprávy a podpora hromadného odesílání.

    ## Autentizace

    Pro všechny požadavky je vyžadován API klíč — zasílejte jej v HTTP hlavičce `x-api-key`. Svůj API klíč najdete v [nastavení účtu](https://app.smsmanager.com/api-cloud).

    Pro odesílání zpráv použijte [JSON API v2](https://api.smsmngr.com/v2).
  version: v1
  contact:
    url: https://smsmanager.com
    email: cc@smsmanager.com

servers:
  - url: 'https://rest-api.smsmngr.com/v1'
    description: Produkční server

security:
  - x-api-key: []

components:
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Chybová zpráva.

paths:
  /apikey/me:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Info o klíči"
      tags:
        - api
      summary: Získat informace o aktuálním API klíči
      description: |
        Vrací profil volajícího API klíče. Tento endpoint vždy odráží aktuální stav klíče (povolen/zablokován, odesílatelé, rozsah oprávnění).
      responses:
        '200':
          description: Informace o API klíči
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  me:
                    type: object
                    properties:
                      note:
                        type: string
                        description: Vaše poznámka připojená k API klíči.
                      default_callback_url:
                        type: string
                        description: Výchozí webhook URL pro notifikace o doručení.
                      account:
                        type: string
                        enum:
                          - prepaid
                          - postpaid
                        description: Typ účtu.
                      scope:
                        type: string
                        enum:
                          - full
                          - rest-api
                          - api
                        description: Rozsah oprávnění API klíče. `full` a `rest-api` mohou měnit nastavení, `api` může pouze odesílat zprávy.
                      share_senders:
                        type: string
                        description: '`"1"`, pokud klíč sdílí odesílatele se svými podřízenými klíči.'
                      is_blocked:
                        type: integer
                        description: '`1`, pokud je klíč zablokován.'
                      senders:
                        type: array
                        description: Registrovaní odesílatelé klíče.
                        items:
                          type: object
                          properties:
                            flow:
                              type: string
                              description: Kanál odesílatele (`sms`, `viber`, `whatsapp`, ...).
                            value:
                              type: string
                              description: Hodnota odesílatele (název nebo číslo).
                            name:
                              type: string
                              description: Zobrazovaný název odesílatele.
                      vat:
                        type: string
                        description: '`"1"`, pokud je účet plátcem DPH.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Měna účtu.
                      tz:
                        type: string
                        description: Časová zóna účtu.
                        example: Europe/Prague
              examples:
                Current key:
                  value:
                    success: true
                    me:
                      note: "eshop"
                      default_callback_url: "https://example.com/hook"
                      account: "prepaid"
                      scope: "full"
                      share_senders: "1"
                      is_blocked: 0
                      senders:
                        - flow: "sms"
                          value: "Mojefirma"
                          name: "Mojefirma"
                      vat: "1"
                      currency: "czk"
                      tz: "Europe/Prague"
        '401':
          description: Neautorizováno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to load API key

  /apikey/add:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Vytvořit sub-klíč"
      tags:
        - api
      summary: Vytvořit podřízený API klíč
      description: |
        Vytváří nový podřízený (sub) API klíč pod volajícím nadřazeným klíčem. Podřízené klíče může vytvářet pouze nadřazený klíč s rozsahem oprávnění `full` nebo `rest-api` (max. 19 podřízených klíčů).

        Sdílený (`shared`) podřízený klíč přebírá fakturaci a měnu nadřazeného klíče a čerpá kredit z jeho peněženky. Nesdílený podřízený klíč má vlastní fakturaci — pole `billing_name`, `billing_email` a `currency` jsou pak povinná.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shared:
                  type: boolean
                  description: Pokud je `true`, nový klíč sdílí fakturaci a kredit s nadřazeným klíčem (měnu dědí od nadřazeného klíče).
                billing_name:
                  type: string
                  description: Fakturační jméno. Povinné, pokud `shared` není `true`.
                billing_email:
                  type: string
                  description: Fakturační e-mail. Povinný, pokud `shared` není `true`.
                currency:
                  type: string
                  enum:
                    - czk
                    - eur
                  description: Měna nového klíče. Povinná, pokud `shared` není `true` (sdílený klíč dědí měnu nadřazeného klíče).
                app_userid:
                  type: string
                  description: Volitelná vazba na uživatele aplikace. Pokud klíč pro tohoto uživatele již existuje, je vrácen existující klíč místo vytvoření nového.
                billing_id:
                  type: string
                  description: Volitelné existující fakturační id.
                note:
                  type: string
                  description: Vaše poznámka k novému klíči.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: Rozsah oprávnění nového klíče.
                share_senders:
                  type: boolean
                  description: Pokud je `true`, registrovaní odesílatelé nadřazeného klíče (a WhatsApp čísla) jsou sdíleni s novým klíčem.
            examples:
              Child key with own billing:
                value:
                  billing_name: "ACME s.r.o."
                  billing_email: "invoicing@acme.example"
                  currency: "czk"
                  note: "eshop"
                  scope: "rest-api"
              Shared child key:
                value:
                  shared: true
                  note: "warehouse app"
                  scope: "api"
                  share_senders: true
      responses:
        '200':
          description: API klíč vytvořen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  apikey:
                    type: string
                    description: Nový API klíč.
                  billing_id:
                    type:
                      - string
                      - 'null'
                    description: Fakturační id nového klíče (`null` u sdíleného klíče).
              examples:
                Created:
                  value:
                    success: true
                    apikey: "aB3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: "1234"
                Created shared:
                  value:
                    success: true
                    apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: null
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing fields:
                  value:
                    message: Missing required fields in request data
                Invalid scope:
                  value:
                    message: Invalid scope value
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not top-level:
                  value:
                    message: Only a top-level apikey can create new apikeys
                Limit reached:
                  value:
                    message: Child apikey limit reached (19)
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/update:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Upravit klíč"
      tags:
        - api
      summary: Upravit aktuální API klíč
      description: |
        Upravuje nastavení volajícího API klíče. Obě pole musí být přítomna (prázdný řetězec hodnotu smaže). Změna `default_callback_url` zároveň aktualizuje webhook URL u všech odesílatelů klíče.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - default_callback_url
                - note
              properties:
                default_callback_url:
                  type: string
                  description: Výchozí webhook URL pro notifikace o doručení. Prázdný řetězec hodnotu smaže.
                note:
                  type: string
                  description: Vaše poznámka ke klíči. Prázdný řetězec hodnotu smaže.
            examples:
              Set callback:
                value:
                  default_callback_url: "https://example.com/hook"
                  note: "eshop"
              Clear callback:
                value:
                  default_callback_url: ""
                  note: "eshop"
      responses:
        '200':
          description: API klíč upraven
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'default_callback_url' or 'note' in request data
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Apikey scope 'api' is not allowed to change settings
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/list:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Vypsat sub-klíče"
      tags:
        - api
      summary: Vypsat podřízené API klíče
      description: Vypíše podřízené API klíče vytvořené volajícím klíčem.
      responses:
        '200':
          description: Seznam podřízených API klíčů
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  list:
                    type: array
                    items:
                      type: string
                    description: Podřízené API klíče.
              example:
                success: true
                list:
                  - "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  - "eF5xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/change:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Změnit sub-klíč"
      tags:
        - api
      summary: Změnit podřízený API klíč
      description: |
        Mění rozsah oprávnění a/nebo blokaci podřízeného API klíče. Podřízené klíče může měnit pouze nadřazený klíč; nadřazený klíč nemůže měnit sám sebe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apikey
              properties:
                apikey:
                  type: string
                  description: Podřízený API klíč, který se má změnit.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: Nový rozsah oprávnění podřízeného klíče. Vyžadováno je alespoň jedno z polí `scope` / `disable`.
                disable:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: '`1` podřízený klíč zablokuje, `0` odblokuje. Vyžadováno je alespoň jedno z polí `scope` / `disable`.'
            examples:
              Change scope:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  scope: "api"
              Disable key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  disable: 1
      responses:
        '200':
          description: API klíč změněn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing apikey:
                  value:
                    message: Missing 'apikey' in request data
                Missing change:
                  value:
                    message: Missing 'scope' or 'disable' in request data
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not owner:
                  value:
                    message: Target apikey does not belong to this parent
                Self change:
                  value:
                    message: Parent apikey cannot change itself
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credit:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Stav kreditu"
      tags:
        - credit
      summary: Získat stav kreditu
      description: Vrací aktuální stav kreditu a dosažené cenové hladiny volajícího klíče.
      responses:
        '200':
          description: Stav kreditu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  credit:
                    type: object
                    properties:
                      priceLevels:
                        type: object
                        description: Mapa `<platform>_<mcc>` na index dosaženého slevového pásma (přítomny jsou pouze položky s indexem větším než 0).
                        additionalProperties:
                          type: integer
                      credit_czk:
                        type: string
                        description: Stav kreditu v CZK (číselný řetězec).
                      credit_eur:
                        type: string
                        description: Stav kreditu v EUR (číselný řetězec).
                      billing_id:
                        type: string
                        description: Fakturační id klíče (číselný řetězec).
                      vat:
                        type: string
                        description: '`"1"`, pokud je účet plátcem DPH.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Měna účtu.
                      tz:
                        type: string
                        description: Časová zóna účtu.
                        example: Europe/Prague
              example:
                success: true
                credit:
                  priceLevels:
                    sms_230: 2
                  credit_czk: "150.5"
                  credit_eur: "0"
                  billing_id: "1234"
                  vat: "1"
                  currency: "czk"
                  tz: "Europe/Prague"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to check credit

  /credit/services:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Katalog služeb"
      tags:
        - credit
      summary: Získat katalog služeb
      description: |
        Vrací katalog objednatelných placených služeb (odesílatelé, virtuální čísla, SIM hosting, ...). Katalog má strukturu `services.sender.<platform>.<country_calling_code>.<variant>`. Ploché id služby používané v `/credit/order` se skládá jako `sender_<platform>_<calling_code>_<variant>` (např. `sender_sms_420_alnum`).

        Každá varianta služby obsahuje: lokalizovaný `name` (a volitelné `requirements` a `delay`), `subject` (`defined` = předmět dodáváte vy, např. text odesílatele nebo telefonní číslo, `assigned` = číslo z poolu je přiděleno automaticky), volitelný výchozí `status` a `prices` pro jednotlivé měny s poli `setup`, `monthly` a volitelně `min_interval` (`month` / `year`) nebo `min_monthly_spend`.
      responses:
        '200':
          description: Katalog služeb
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  services:
                    type: object
                    description: Vnořený katalog služeb.
              example:
                success: true
                services:
                  sender:
                    sms:
                      "420":
                        alnum:
                          name:
                            cs: "Textový odesílatel"
                            en: "Text ID sender"
                          subject: "defined"
                          status: "new"
                          prices:
                            czk:
                              setup: 500
                              monthly: 500
                            eur:
                              setup: 20
                              monthly: 20
                        simhost:
                          name:
                            cs: "SIM hosting"
                            en: "SIM hosting"
                          subject: "defined"
                          prices:
                            czk:
                              setup: 200
                              monthly: 100
                              min_interval: "year"
                            eur:
                              setup: 8
                              monthly: 4
                              min_interval: "year"

  /credit/prices:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Ceník"
      tags:
        - credit
      summary: Získat ceník
      description: |
        Vrací ceník podle destinací, klíčovaný kanálem (`sms`, `smsdirect`, `smscustom`, `viber`) a telefonní předvolbou země. Každá položka obsahuje `mcc` země, `price_czk`, `price_eur` a volitelně ceny pro jednotlivé operátory v `operators`.
      responses:
        '200':
          description: Ceník
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prices:
                    type: object
                    description: Ceník klíčovaný kanálem a telefonní předvolbou země.
              example:
                success: true
                prices:
                  sms:
                    "420":
                      mcc: 230
                      price_czk: 0.89
                      price_eur: 0.04
                      operators:
                        "1":
                          price_czk: 0.89
                          price_eur: 0.04
                    "49":
                      mcc: 262
                      price_czk: 1.85
                      price_eur: 0.08
                  viber:
                    "420":
                      mcc: 230
                      price_czk: 0.39
                      price_eur: 0.016

  /credit/notify:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Nastavení upozornění"
      tags:
        - credit
      summary: Získat nastavení upozornění na nízký kredit
      description: Vrací nastavení e-mailového upozornění na nízký kredit volajícího klíče.
      responses:
        '200':
          description: Nastavení upozornění
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notify:
                    type:
                      - object
                      - 'null'
                    description: '`null`, pokud upozornění nebylo nikdy nastaveno.'
                    properties:
                      email:
                        type: string
                        description: E-mailová adresa příjemce upozornění.
                      value:
                        type: number
                        description: Hranice kreditu, při které se upozornění odešle.
                      enabled:
                        type: boolean
              examples:
                Configured:
                  value:
                    success: true
                    notify:
                      email: "ops@acme.example"
                      value: 100
                      enabled: true
                Not configured:
                  value:
                    success: true
                    notify: null
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      x-mint:
        metadata:
          sidebarTitle: "Nastavit upozornění"
      tags:
        - credit
      summary: Nastavit upozornění na nízký kredit
      description: Nastavuje e-mailové upozornění na nízký kredit volajícího klíče. Všechna pole jsou povinná.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - value
                - enable
              properties:
                email:
                  type: string
                  description: E-mailová adresa příjemce upozornění.
                value:
                  type: number
                  description: Hranice kreditu, při které se upozornění odešle (musí být větší než 0).
                enable:
                  type: boolean
                  description: Zapnutí nebo vypnutí upozornění.
            examples:
              Enable alert:
                value:
                  email: "ops@acme.example"
                  value: 100
                  enable: true
      responses:
        '200':
          description: Upozornění uloženo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'email', 'value' or 'enable' in request data
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Apikey scope 'api' is not allowed to change settings
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credit/order:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Objednat službu"
      tags:
        - credit
      summary: Objednat placenou službu
      description: |
        Objedná placenou službu z katalogu (viz `/credit/services`) a odečte poplatek z vašeho kreditu. Celkový poplatek je `setup + monthly × months`, kde počet měsíců vyplývá z minimálního intervalu služby (`year` = 12, `quarter` = 3, jinak 1). U služeb se `subject: defined` musíte předmět dodat (např. text odesílatele nebo telefonní číslo); u `subject: assigned` je číslo z poolu přiděleno automaticky. Pomocí `dryrun` objednávku pouze ověříte (kredit, dostupnost) bez jakýchkoliv změn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - period
              properties:
                service_id:
                  type: string
                  description: Ploché id služby z katalogu.
                  example: sender_sms_420_alnum
                period:
                  type: string
                  description: Požadované fakturační období. Skutečné fakturační období je určeno minimálním intervalem služby.
                  example: month
                subject:
                  type: string
                  description: 'Předmět služby (text odesílatele, telefonní číslo, ...). Povinné u služeb se `subject: defined`.'
                payload:
                  type: object
                  description: Volitelná doplňková data uložená k objednávce služby.
                dryrun:
                  type: boolean
                  description: Pokud je `true`, objednávka se pouze ověří a vrátí se celkový poplatek bez jakýchkoliv změn.
            examples:
              Order text sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
              Dry run:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
                  dryrun: true
      responses:
        '200':
          description: Služba objednána
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    type: object
                    properties:
                      subject:
                        type: string
                        description: Předmět objednané služby (u služeb typu `assigned` přidělené číslo).
                      subject_id:
                        type: string
                      status:
                        type: string
                        description: Počáteční stav služby (`new` nebo `active`).
                      dryrun:
                        type: boolean
                        description: Přítomno pouze u dry runů.
                      total_fee:
                        type: number
                        description: Celkový poplatek (pouze dry run).
                      currency:
                        type: string
                        description: Měna poplatku (pouze dry run).
                      service_id:
                        type: string
                        description: Id služby (pouze dry run).
              examples:
                Ordered:
                  value:
                    success: true
                    order:
                      subject: "Mojefirma"
                      subject_id: "Mojefirma"
                      status: "new"
                Dry run:
                  value:
                    success: true
                    order:
                      dryrun: true
                      total_fee: 1000
                      currency: "czk"
                      subject: null
                      service_id: "sender_sms_420_alnum"
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '500':
          description: Objednávka selhala
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid service:
                  value:
                    message: Invalid service id
                Insufficient credit:
                  value:
                    message: Insufficient credit
                No available sender:
                  value:
                    message: No available sender for this service

  /credit/cancel:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Zrušit službu"
      tags:
        - credit
      summary: Zrušit placenou službu
      description: |
        Označí objednanou službu ke zrušení na konci zaplaceného období. Nedochází k žádnému okamžitému účtování ani vracení peněz; služba zůstává aktivní do konce zaplaceného období. Volání je idempotentní.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - subject
              properties:
                service_id:
                  type: string
                  description: Ploché id služby z katalogu.
                  example: sender_sms_420_alnum
                subject:
                  type: string
                  description: Přesný předmět objednané služby.
                  example: Mojefirma
            examples:
              Cancel sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  subject: "Mojefirma"
      responses:
        '200':
          description: Služba označena ke zrušení
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cancel:
                    type: object
                    properties:
                      cancel_at_period_end:
                        type: boolean
                      active_until:
                        type:
                          - string
                          - 'null'
                        description: Datum, do kterého služba zůstává aktivní (`YYYY-MM-DD`).
              example:
                success: true
                cancel:
                  cancel_at_period_end: true
                  active_until: "2026-08-15"
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '500':
          description: Zrušení selhalo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not found:
                  value:
                    message: Service not found
                Already cancelled:
                  value:
                    message: Service already cancelled

  /billing/get:
