  /messages:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Seznam zpráv"
      tags:
        - status
      summary: Vypsat odeslané zprávy podle data
      description: |
        Vypíše přehledové řádky zpráv po příjemcích pro zadané datum, se stránkováním pomocí kurzoru. Volitelně lze filtrovat podle tagu a/nebo telefonního čísla.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Datum (`YYYY-MM-DD`).
          example: "2026-07-30"
        - name: subid
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Id podúčtu.
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filtr podle tagu (tagy oddělené čárkou jsou před porovnáním normalizovány a seřazeny).
        - name: phone_number
          in: query
          required: false
          schema:
            type: string
          description: Filtr podle telefonního čísla příjemce.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Kurzor stránkování z předchozí odpovědi (`next_cursor`).
      responses:
        '200':
          description: Seznam zpráv
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                        message_parts:
                          type: integer
                        ts_sent:
                          type:
                            - string
                            - 'null'
                        ts_delivered:
                          type:
                            - string
                            - 'null'
                        ts_updated:
                          type:
                            - string
                            - 'null'
                        ts_clicked:
                          type:
                            - string
                            - 'null'
                        ts_seen:
                          type:
                            - string
                            - 'null'
                        ts_replied:
                          type:
                            - string
                            - 'null'
                        ts_optout:
                          type:
                            - string
                            - 'null'
                        sent:
                          type: integer
                        delivered:
                          type: integer
                        seen:
                          type: integer
                        clicked:
                          type: integer
                        replied:
                          type: integer
                        optout:
                          type: integer
                        nondelivered:
                          type: integer
                        body:
                          type: string
                        flow:
                          type: string
                          description: Použitý kanál.
                        sender:
                          type: string
                        phone_number:
                          type: string
                        price_czk:
                          type: string
                          description: Cena v CZK (číselný řetězec).
                        price_eur:
                          type: string
                          description: Cena v EUR (číselný řetězec).
                  next_cursor:
                    type:
                      - string
                      - 'null'
                    description: Předejte zpět jako `cursor` pro načtení další stránky; `null`, pokud už žádné další stránky nejsou.
              example:
                success: true
                messages:
                  - message_id: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
                    message_parts: 1
                    ts_sent: "2026-07-30T10:00:01Z"
                    ts_delivered: "2026-07-30T10:00:04Z"
                    ts_updated: "2026-07-30T10:00:05Z"
                    ts_clicked: null
                    ts_seen: null
                    ts_replied: null
                    ts_optout: null
                    sent: 1
                    delivered: 1
                    seen: 0
                    clicked: 0
                    replied: 0
                    optout: 0
                    nondelivered: 0
                    body: "Hello world"
                    flow: "sms"
                    sender: "Mojefirma"
                    phone_number: "420777123456"
                    price_czk: "1.2"
                    price_eur: "0.05"
                next_cursor: null
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'date' or 'xapikey' in request data
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to read messages

