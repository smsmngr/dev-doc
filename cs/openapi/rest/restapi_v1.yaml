        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filtr podle tagu.
      responses:
        '200':
          description: Agregované statistiky
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  requests:
                    type: array
