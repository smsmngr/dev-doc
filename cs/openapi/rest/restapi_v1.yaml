      summary: Nastavit fakturační kontakt
      description: |
        Aktualizuje fakturační kontakt pro fakturační id vlastněné volajícím klíčem. Povinné je `billing_id` plus alespoň jedno kontaktní pole. Sdílené podřízené klíče nevlastní fakturační záznam a tento endpoint použít nemohou.
      requestBody:
        required: true
