  /message:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Stav zprávy"
      tags:
        - status
      summary: Získat stav zprávy
      description: Vrací úplný stav jedné odeslané zprávy podle jejího `message_id`. Vraceny jsou pouze zprávy odeslané volajícím klíčem.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Id zprávy.
      responses:
        '200':
          description: Stav zprávy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type:
                      - object
                      - 'null'
                    description: '`null`, pokud zpráva nebyla nalezena (nebo nepatří volajícímu klíči).'
                    properties:
                      status_code:
                        type:
                          - string
                          - 'null'
                        description: Stavový kód odeslání (`200` = odesláno).
                      delivery_code:
                        type:
                          - string
                          - 'null'
                        description: Stavový kód doručení (`201` = doručeno, `202` = zobrazeno).
                      status_info:
                        type:
                          - string
                          - 'null'
                      tag:
                        type:
                          - string
                          - 'null'
                      body:
                        type: string
                      to:
                        type: object
                        description: Objekt příjemce tak, jak byl odeslán.
                      request_id:
                        type:
                          - string
                          - 'null'
                      ts_created:
                        type:
                          - string
                          - 'null'
                      ts_sent:
                        type:
                          - string
                          - 'null'
                      ts_delivered:
                        type:
                          - string
                          - 'null'
                      ts_seen:
                        type:
                          - string
                          - 'null'
                      ts_clicked:
                        type:
                          - string
                          - 'null'
                      ts_updated:
                        type:
                          - string
                          - 'null'
                      flow:
                        type: array
                        description: Původní flow zprávy.
                      flow_index:
                        type:
                          - string
                          - 'null'
                        description: Index kroku flow, který byl použit.
                      flow_status:
                        type: object
                        description: Stavové kódy jednotlivých kroků flow, klíčované indexem kroku.
                      price:
                        type:
                          - number
                          - 'null'
              example:
                success: true
                message:
                  status_code: "200"
                  delivery_code: "201"
                  status_info: "Delivered"
                  tag: "newsletter"
                  body: "Hello world"
                  to:
                    phone_number: "420777123456"
                  request_id: "bc36f3d1-d284-463a-921b-a3560c154649"
                  ts_created: "2026-07-30T10:00:00Z"
                  ts_sent: "2026-07-30T10:00:01Z"
                  ts_delivered: "2026-07-30T10:00:04Z"
                  ts_seen: null
                  ts_clicked: null
                  ts_updated: "2026-07-30T10:00:05Z"
                  flow:
                    - sms: {}
                  flow_index: "0"
                  flow_status:
                    "0":
                      status_code: "200"
                      delivery_code: "201"
                  price: 1.2
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'id' in request data
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to read message

  /messages:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Seznam zpráv"
      tags:
        - status
      summary: Vypsat odeslané zprávy podle data
      description: |
        Vypíše přehledové řádky zpráv po příjemcích pro zadané datum, se stránkováním pomocí kurzoru. Volitelně lze filtrovat podle tagu a/nebo telefonního čísla.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Datum (`YYYY-MM-DD`).
          example: "2026-07-30"
        - name: subid
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Id podúčtu.
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filtr podle tagu (tagy oddělené čárkou jsou před porovnáním normalizovány a seřazeny).
        - name: phone_number
          in: query
          required: false
          schema:
            type: string
          description: Filtr podle telefonního čísla příjemce.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Kurzor stránkování z předchozí odpovědi (`next_cursor`).
      responses:
        '200':
          description: Seznam zpráv
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                        message_parts:
                          type: integer
                        ts_sent:
                          type:
                            - string
                            - 'null'
                        ts_delivered:
                          type:
                            - string
                            - 'null'
                        ts_updated:
                          type:
                            - string
                            - 'null'
                        ts_clicked:
                          type:
                            - string
                            - 'null'
                        ts_seen:
                          type:
                            - string
                            - 'null'
                        ts_replied:
                          type:
                            - string
                            - 'null'
                        ts_optout:
                          type:
                            - string
                            - 'null'
                        sent:
                          type: integer
                        delivered:
                          type: integer
                        seen:
                          type: integer
                        clicked:
                          type: integer
                        replied:
                          type: integer
                        optout:
                          type: integer
                        nondelivered:
                          type: integer
                        body:
                          type: string
                        flow:
                          type: string
                          description: Použitý kanál.
                        sender:
                          type: string
                        phone_number:
                          type: string
                        price_czk:
                          type: string
                          description: Cena v CZK (číselný řetězec).
                        price_eur:
                          type: string
                          description: Cena v EUR (číselný řetězec).
                  next_cursor:
                    type:
                      - string
                      - 'null'
                    description: Předejte zpět jako `cursor` pro načtení další stránky; `null`, pokud už žádné další stránky nejsou.
              example:
                success: true
                messages:
                  - message_id: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
                    message_parts: 1
                    ts_sent: "2026-07-30T10:00:01Z"
                    ts_delivered: "2026-07-30T10:00:04Z"
                    ts_updated: "2026-07-30T10:00:05Z"
                    ts_clicked: null
                    ts_seen: null
                    ts_replied: null
                    ts_optout: null
                    sent: 1
                    delivered: 1
                    seen: 0
                    clicked: 0
                    replied: 0
                    optout: 0
                    nondelivered: 0
                    body: "Hello world"
                    flow: "sms"
                    sender: "Mojefirma"
                    phone_number: "420777123456"
                    price_czk: "1.2"
                    price_eur: "0.05"
                next_cursor: null
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'date' or 'xapikey' in request data
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to read messages

  /request:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Statistiky požadavku"
      tags:
        - status
      summary: Získat statistiky požadavku
