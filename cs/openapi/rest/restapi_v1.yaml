  /inbox:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Přijaté zprávy"
      tags:
        - inbox
      summary: Získat přijaté zprávy podle data
      description: Vrací příchozí (přijaté) zprávy pro zadané datum.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Datum (`YYYY-MM-DD`).
          example: "2026-07-30"
      responses:
        '200':
          description: Přijaté zprávy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  inbox:
                    type: array
                    items:
                      type: object
                      properties:
                        ts_received:
                          type: string
                        body:
                          type: string
                        from:
                          type: string
                          description: Telefonní číslo odesílatele.
                        to:
                          type: string
                          description: Vaše číslo příjemce/odesílatel.
                        gateway:
                          type: string
                        payload:
                          type:
                            - object
                            - 'null'
                          description: Původní payload související odchozí zprávy, pokud existuje.
                        original:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Odchozí zpráva, na kterou je tato zpráva odpovědí, pokud se příchozí
                            zprávu podařilo spárovat. U nevyžádaných příchozích zpráv `null`.
                          properties:
                            message_id:
                              type: string
                              description: ID původní odchozí zprávy — použijte ho v `GET /message`.
                            body:
                              type: string
                              description: Text původní odchozí zprávy.
                            sender:
                              type: string
                              description: Odesílatel, ze kterého byla původní zpráva odeslána. U short kódu prázdné.
                            created:
                              type:
                                - integer
                                - 'null'
                              description: Kdy byla původní zpráva vytvořena (unix timestamp v sekundách).
                        media:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Médium přiložené k příchozí zprávě (WhatsApp/RCS obrázek, video, audio,
                            dokument, nálepka, sdílená poloha nebo kontaktní karty). U čistě textových
                            zpráv `null`. U binárních typů je soubor uložen na trvalé veřejné URL
                            v poli `url`; pokud se soubor nepodařilo uložit, `url` chybí a místo něj
                            je nastaveno pole `error` — ostatní metadata jsou vrácena i tak.
                          properties:
                            type:
                              type: string
                              enum: [image, video, audio, document, sticker, location, contacts]
                              description: Typ obsahu přílohy.
                            url:
                              type: string
                              description: Trvalá veřejná URL uloženého souboru. Chybí, pokud se soubor nepodařilo uložit.
                            mime_type:
                              type: string
                              description: MIME typ, jak jej nahlásil kanál.
                            filename:
                              type: string
                              description: Původní název souboru (dokumenty).
                            caption:
                              type: string
                              description: Popisek odeslaný spolu s médiem. Pokud zpráva nemá text, vrací se také jako `body`.
                            size:
                              type: integer
                              description: Velikost souboru v bajtech, pokud je známa.
                            animated:
                              type: boolean
                              description: Zda je nálepka animovaná (pouze nálepky).
                            thumbnail:
                              type: string
                              description: Trvalá veřejná URL uloženého náhledu (pouze RCS).
                            location:
                              type: object
                              description: Sdílená poloha (pouze když `type` je `location`).
                              properties:
                                latitude:
                                  type: number
                                longitude:
                                  type: number
                                name:
                                  type: string
                                address:
                                  type: string
                            contacts:
                              type: array
                              description: Sdílené kontaktní karty (pouze když `type` je `contacts`), tak jak je poskytl kanál.
                              items:
                                type: object
                            provider_id:
                              type: string
                              description: ID média/zprávy přidělené poskytovatelem kanálu.
                            error:
                              type: string
                              enum: [download_failed, too_large, no_token]
                              description: Nastaveno místo `url`, pokud se soubor nepodařilo uložit.
              example:
                success: true
                inbox:
                  - ts_received: "2026-07-30T11:22:33Z"
                    body: "STOP"
                    from: "420777123456"
                    to: "Mojefirma"
                    gateway: "sms"
                    payload: null
                    original: null
                    media: null
                  - ts_received: "2026-07-30T11:25:02Z"
                    body: "YES"
                    from: "420777654321"
                    to: "Mojefirma"
                    gateway: "sms"
                    payload:
                      order_id: 42
                    original:
                      message_id: "01J8ZQ2V9K"
                      body: "Confirm your order by replying YES."
                      sender: "Mojefirma"
                      created: 1785410553
                    media: null
                  - ts_received: "2026-07-30T12:34:56Z"
                    body: "photo of the damaged package"
                    from: "420777123456"
                    to: "420736352552"
                    gateway: "whatsapp"
                    payload: null
                    original: null
                    media:
                      type: "image"
                      url: "https://smsmngr-inbound-media.s3.eu-central-1.amazonaws.com/3f7a1c9b2e4d5f60718293a4b5c6d7e8.jpg"
                      mime_type: "image/jpeg"
                      caption: "photo of the damaged package"
                      size: 245731
                      provider_id: "1234567890123456"
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'date' or 'xapikey' in request data
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /blacklist:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Stáhnout blacklist"
      tags:
        - blacklist
      summary: Stáhnout blacklist
      description: Vrací předpodepsanou URL (platnou 60 sekund) pro stažení blacklistu ve formátu CSV.
      parameters:
        - name: subid
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Id podúčtu.
      responses:
        '200':
          description: URL ke stažení
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  url:
                    type: string
                    description: Předpodepsaná URL ke stažení, platná 60 sekund.
              example:
                success: true
                url: "https://smsmngr-managed-contactlist.s3.amazonaws.com/...&X-Amz-Expires=60..."
        '404':
          description: Blacklist nenalezen (zatím nejsou uložena žádná čísla)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: Blacklist not found
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: false
                message: Failed to generate download URL
    post:
      x-mint:
        metadata:
          sidebarTitle: "Přidat na blacklist"
      tags:
        - blacklist
      summary: Přidat čísla na blacklist
      description: |
        Přidá telefonní čísla na blacklist účtu. Čísla jsou normalizována (českým 9místným mobilním číslům je předřazeno `420`) a zpracovávána asynchronně — volání vrací počet přijatých čísel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  description: Seznam telefonních čísel oddělených novým řádkem.
                  example: "420777123456\n420777654321"
                subid:
                  type: string
                  default: default
                  description: Id podúčtu.
            examples:
              Add numbers:
                value:
                  to: "420777123456\n776654321"
                  subid: "default"
      responses:
        '200':
          description: Čísla přijata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  accepted:
                    type: integer
                    description: Počet přijatých unikátních platných čísel.
                  invalid:
                    type: array
                    items:
                      type: string
                    description: Vstupní řádky, které se nepodařilo rozpoznat jako telefonní čísla.
              example:
                success: true
                accepted: 2
                invalid: []
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  invalid:
                    type: array
                    items:
                      type: string
              examples:
                Missing to:
                  value:
                    success: false
                    message: "Missing 'to'"
                No valid numbers:
                  value:
                    success: false
                    message: "No valid phone numbers"
                    invalid:
                      - "not-a-number"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: false
                message: Enqueue failed
    delete:
      x-mint:
        metadata:
          sidebarTitle: "Odebrat z blacklistu"
      tags:
        - blacklist
      summary: Odebrat čísla z blacklistu
      description: 'Odebere konkrétní čísla z blacklistu, nebo pomocí `all: true` smaže celý seznam.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  description: Seznam čísel k odebrání oddělených novým řádkem. Povinné, pokud `all` není `true`.
                all:
                  type: boolean
                  description: Pokud je `true`, smaže celý blacklist.
                subid:
                  type: string
                  default: default
                  description: Id podúčtu.
            examples:
              Remove numbers:
                value:
                  to: "420777123456"
              Wipe list:
                value:
                  all: true
      responses:
        '200':
          description: Čísla odebrána
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  blacklist:
                    type: object
                    properties:
                      removed:
                        type: integer
                      remaining:
                        type: integer
                      invalid:
                        type: array
                        items:
                          type: string
                      wiped:
                        type: boolean
              examples:
                Removed:
                  value:
                    success: true
                    blacklist:
                      removed: 1
                      remaining: 5
                      invalid: []
                Wiped:
                  value:
                    success: true
                    blacklist:
                      wiped: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                type: object
              example:
                success: false
                blacklist:
                  message: "Provide 'to' or 'all: true'"
        '404':
          description: Blacklist nenalezen
          content:
            application/json:
              schema:
                type: object
              example:
                success: false
                blacklist:
                  message: Blacklist not found
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                type: object
              example:
                success: false
                blacklist:
                  message: Delete failed

