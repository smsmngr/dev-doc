    post:
      x-mint:
        metadata:
          sidebarTitle: "URL pro nahrání"
      tags:
        - messaging
      summary: Získat URL pro hromadné nahrání
      description: |
        Vrací předpodepsanou URL pro nahrání (platnou 60 sekund) souboru s hromadnými zprávami. Soubor je JSONL (jedna JSON zpráva na řádek, stejný formát jako `Message` v JSON API v2) nebo gzipovaný JSONL. Soubor nahrajte metodou `PUT` s `Content-Type: application/jsonl` (pro `jsonl`) nebo `application/gzip` (pro `gz`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bulk_id
                - filetype
              properties:
                bulk_id:
                  type: string
                  description: Váš identifikátor hromadného nahrání.
                filetype:
                  type: string
                  enum:
                    - jsonl
                    - gz
                  description: Typ nahrávaného souboru.
                datetime:
                  type: string
                  format: date-time
                  description: Volitelný naplánovaný čas zpracování (UTC).
            examples:
              JSONL upload:
                value:
                  bulk_id: "batch-2026-07-30"
                  filetype: "jsonl"
              Scheduled gzip upload:
                value:
                  bulk_id: "batch-2026-07-31"
                  filetype: "gz"
                  datetime: "2026-07-31T08:00:00Z"
      responses:
        '200':
          description: URL pro nahrání
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  url:
                    type: string
                    description: Předpodepsaná PUT URL, platná 60 sekund.
              example:
                success: true
                url: "https://smsmngr-bulk-uploads.s3.amazonaws.com/...&X-Amz-Expires=60..."
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing fields:
                  value:
                    message: Missing 'bulk_id' or 'filetype' or 'datetime' in request data
                Unsupported filetype:
                  value:
                    message: Unsupported filetype
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to generate upload URL

  /messaging/validate:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Ověřit zprávy"
      tags:
        - messaging
      summary: Ověřit zprávy bez odeslání
      description: |
        Ověří požadavek na odeslání, aniž by cokoli odeslal nebo účtoval. Přijímá stejné tělo jako odesílací endpointy JSON API v2 — jeden objekt `Message` (jako `POST /message`) nebo pole 1 až 10 objektů `Message` (jako `POST /messages`). Kontroluje se pouze struktura: pole a jejich typy, kroky flow a formát čísel příjemců. Doručitelnost, schválení odesílatele, opt-out seznamy ani kredit se nekontrolují.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Jedna zpráva ve formátu `Message` JSON API v2.
                - type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                  description: Pole zpráv ve formátu `Message` JSON API v2.
            examples:
              Single message:
                value:
                  to:
                    - phone_number: "420777123456"
                  body: "Hello!"
              Multiple messages:
                value:
                  - to:
                      - phone_number: "420777123456"
                      - phone_number: "123"
                    body: "Hello!"
                  - to:
                      - phone_number: "420777123457"
                    flow:
                      - sms:
                          body: "Hello via lowcost!"
                          gateway: "lowcost"
      responses:
        '200':
          description: Výsledek validace (vrací se i v případě neplatného obsahu požadavku — viz `success`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` jen tehdy, když validací prošly všechny zprávy a všichni příjemci (`rejected` i `errors` jsou prázdné).'
                  validate:
                    type: object
                    properties:
                      accepted:
                        type: array
                        description: Položky, které prošly validací. Pro jednu zprávu `key` indexuje příjemce v `to` (jako `POST /message`); pro pole zpráv `key` indexuje odeslané pole (jako `POST /messages`).
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Index příjemce (jedna zpráva) nebo zprávy v poli požadavku.
                            phone_number:
                              type: string
                              description: Číslo příjemce tak, jak bylo odesláno (přítomno jen pro požadavek s jednou zprávou).
                      rejected:
                        type: array
                        description: Položky, které validací neprošly, stejná sémantika `key` jako u `accepted`. Podrobnosti jsou v `errors`, propojitelné přes `key`.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            phone_number:
                              type: string
                              description: Číslo příjemce tak, jak bylo odesláno (přítomno jen pro požadavek s jednou zprávou).
                      errors:
                        type: array
                        description: Všechny chyby validace. Přítomno vždy (prázdné pole, když vše prošlo).
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Klíč související položky v `rejected`. Vynechán u chyb na úrovni zprávy u požadavku s jednou zprávou.
                            field:
                              type: string
                              description: Cesta k neplatnému poli (např. `flow[0].sms.gateway`, `to[1].phone_number`).
                            message:
                              type: string
                            code:
                              type: string
                              description: Interní stavový kód, pokud existuje (`302` pro číslo ve špatném formátu).
              example:
                success: false
                validate:
                  accepted:
                    - key: "0"
                      phone_number: "420777123456"
                  rejected:
                    - key: "1"
                      phone_number: "123"
                  errors:
                    - key: "1"
                      field: "to[1].phone_number"
                      message: "Phone number is not in a valid format"
                      code: "302"
        '400':
          description: Chybný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing body:
                  value:
                    message: Missing request body
                Too many messages:
                  value:
                    message: Request must contain 1 to 10 messages
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to validate message

  /messaging/cancel:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Zrušit plán"
      tags:
        - messaging
      summary: Zrušit naplánovanou zprávu nebo hromadné nahrání
      description: |
        Zruší dříve naplánovanou jednotlivou zprávu (`message_id`) nebo naplánované hromadné nahrání (`bulk_id`). Uveďte právě jedno z obou polí.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                  description: Id naplánované zprávy. Nekombinujte s `bulk_id`.
                bulk_id:
                  type: string
                  description: Id naplánovaného hromadného nahrání. Nekombinujte s `message_id`.
            examples:
              Cancel message:
                value:
                  message_id: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
              Cancel bulk:
                value:
                  bulk_id: "batch-2026-07-31"
      responses:
        '200':
          description: Plán zrušen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: Schedule cancelled
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'message_id' or 'bulk_id' in request data
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to cancel schedule

  /push/device:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Registrovat zařízení"
      tags:
        - partner
      summary: Registrovat push zařízení
      description: Registruje (nebo aktualizuje) zařízení pro push notifikace. Id zařízení již registrované jiným API klíčem nelze registrovat znovu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - token
              properties:
                id:
                  type: string
                  description: Id zařízení.
                token:
                  type: string
                  description: Push token zařízení.
            example:
              id: "device-uuid-123"
              token: "fcm-token-xyz"
      responses:
        '200':
          description: Zařízení registrováno
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'id' or 'token' in request data
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Device is owned by another apikey
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /recipient/register:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Registrovat příjemce"
      tags:
        - partner
      summary: Registrovat příjemce
      description: |
        Vytvoří nového příjemce (pokud je `id` vynecháno, vygeneruje se nové id) nebo aktualizuje telefonní číslo a push tokeny existujícího příjemce. Aktualizována jsou pouze zaslaná pole.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Id příjemce. Vynechejte pro vytvoření nového příjemce.
                phone_number:
                  type: string
                  description: Telefonní číslo příjemce.
                fcm_token:
                  type: string
                  description: Push token pro Android (FCM).
                apns_token:
                  type: string
                  description: Push token pro iOS (APNs).
            examples:
              New recipient:
                value:
                  phone_number: "420777123456"
                  fcm_token: "fcm-abc"
              Update recipient:
                value:
                  id: "b1f2c3d4-5678-90ab-cdef-1234567890ab"
                  apns_token: "apns-xyz"
      responses:
        '200':
          description: Příjemce registrován
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  recipient:
                    type: string
                    description: Id příjemce.
              example:
                success: true
                recipient: "b1f2c3d4-5678-90ab-cdef-1234567890ab"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to register recipient


