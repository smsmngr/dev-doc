                  billing:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                      currency:
                        type: string
                      contact:
                        type: object
                        properties:
                          name:
                            type: string
                          company_id:
                            type: string
                          company_vat:
                            type: string
                          address:
                            type: string
                          city:
                            type: string
                          zip:
                            type: string
                          country:
                            type: string
              example:
                success: true
                billing:
