  /credit/price:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Cena pro destinaci"
      tags:
        - credit
      summary: Získat cenu pro destinaci
      description: |
        Vrací vaše aktuální ceny pro jedno cílové číslo, podle kanálů. Ceny už zahrnují dosaženou objemovou slevu, takže mohou být nižší než obecný ceník z `GET /credit/prices`. Kanály, které do dané destinace nedoručují, jsou z `prices` vynechány.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  description: Cílové telefonní číslo. Doporučujeme mezinárodní formát (E.164, bez úvodního `+` nebo `00`), ale přijímáme i jiné formáty (převedeme je na mezinárodní formát).
                  example: "420777123456"
                platform:
                  type: string
                  enum:
                    - sms
                    - viber
                    - whatsapp_text
                    - whatsapp_template
                    - rcs
                  description: Volitelný filtr flow kanálu. Pokud je nastaven, vrací se ceny jen pro tento kanál.
            examples:
              All channels:
                value:
                  to: "420777123456"
              Single channel:
                value:
                  to: "420777123456"
                  platform: "sms"
      responses:
        '200':
          description: Ceny pro destinaci
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  price:
                    type: object
                    properties:
                      to:
                        type: string
                        description: Cílové číslo tak, jak bylo odesláno.
                      normalized:
                        type: string
                        description: Cílové číslo převedené na mezinárodní formát.
                      calling_code:
                        type: string
                        description: Rozpoznaná telefonní předvolba země.
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Měna účtu.
                      prices:
                        type: object
                        description: Ceny klíčované flow kanálem (`sms`, `viber`, `whatsapp_text`, `whatsapp_template`, `rcs`). `sms` obsahuje jednu položku pro každou gateway plus `default` (kopie `high`); ostatní kanály obsahují jen `default`. Kanály, které do dané destinace nedoručují, jsou vynechány.
                        additionalProperties:
                          type: object
                          description: Ceny klíčované gateway; `default` je přítomen vždy.
                          additionalProperties:
                            type: object
                            properties:
                              mcc:
                                type: integer
                                description: Mobile country code destinace.
                              price_czk:
                                type: number
                                description: Cena za část zprávy v CZK.
                              price_eur:
                                type: number
                                description: Cena za část zprávy v EUR.
              example:
                success: true
                price:
                  to: "420777123456"
                  normalized: "420777123456"
                  calling_code: "420"
                  currency: "czk"
                  prices:
                    sms:
                      default:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                      high:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                      lowcost:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                      direct:
                        mcc: 230
                        price_czk: 1.25
                        price_eur: 0.05
                      custom:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                      simhost:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                      gsm:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                    viber:
                      default:
                        mcc: 230
                        price_czk: 0.39
                        price_eur: 0.016
                    whatsapp_text:
                      default:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                    whatsapp_template:
                      default:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                    rcs:
                      default:
                        mcc: 230
                        price_czk: 0.89
                        price_eur: 0.04
        '400':
          description: Chybný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing to:
                  value:
                    message: Missing 'to'
                Unknown platform:
                  value:
                    message: Unknown platform
                Invalid phone number:
                  value:
                    message: Invalid phone number
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to get destination price

