                                count_seen:
                                  type: integer
                                  description: Unikátní zobrazené zprávy, odvozeno z čítačů jednotlivých kroků flow.
                                count_clicked:
                                  type: integer
                                  description: Unikátní prokliknuté zprávy, odvozeno z čítačů jednotlivých kroků flow.
