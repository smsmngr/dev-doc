      tags:
        - partner
      summary: Registrovat push zařízení
      description: Registruje (nebo aktualizuje) zařízení pro push notifikace. Id zařízení již registrované jiným API klíčem nelze registrovat znovu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - token
              properties:
                id:
                  type: string
                  description: Id zařízení.
                token:
                  type: string
                  description: Push token zařízení.
            example:
              id: "device-uuid-123"
              token: "fcm-token-xyz"
      responses:
        '200':
          description: Zařízení registrováno
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'id' or 'token' in request data
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Device is owned by another apikey
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /recipient/register:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Registrovat příjemce"
      tags:
        - partner
      summary: Registrovat příjemce
      description: |
        Vytvoří nového příjemce (pokud je `id` vynecháno, vygeneruje se nové id) nebo aktualizuje telefonní číslo a push tokeny existujícího příjemce. Aktualizována jsou pouze zaslaná pole.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Id příjemce. Vynechejte pro vytvoření nového příjemce.
                phone_number:
                  type: string
                  description: Telefonní číslo příjemce.
                fcm_token:
                  type: string
                  description: Push token pro Android (FCM).
                apns_token:
                  type: string
                  description: Push token pro iOS (APNs).
            examples:
              New recipient:
                value:
                  phone_number: "420777123456"
                  fcm_token: "fcm-abc"
              Update recipient:
                value:
                  id: "b1f2c3d4-5678-90ab-cdef-1234567890ab"
                  apns_token: "apns-xyz"
      responses:
        '200':
          description: Příjemce registrován
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  recipient:
                    type: string
                    description: Id příjemce.
              example:
                success: true
                recipient: "b1f2c3d4-5678-90ab-cdef-1234567890ab"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to register recipient

  /connect/{connector}/{action}:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Akce konektoru"
      tags:
        - partner
      summary: Akce konektoru
      description: |
        Provede akci připojené integrace. Aktuálně je podporován konektor `klaviyo` s akcemi `segments`, `recipients`, `senders` a `me`.

        - `segments` — vypíše segmenty účtu: `{ "success": true, "segments": [{ "id", "name" }] }`
        - `recipients` — vypíše telefonní čísla v segmentu (vyžaduje pole `segment_id` v těle požadavku): `{ "success": true, "recipients": ["420777123456"] }`
        - `senders` — vypíše dostupné odesílatele: `{ "success": true, "senders": [{ "type": "sms", "name": "info-sms" }] }`
        - `me` — vrací informace o připojeném účtu: `{ "success": true, "account": { ... }, "currency": "eur" }`
      parameters:
        - name: connector
          in: path
          required: true
          schema:
            type: string
            enum:
              - klaviyo
          description: Název konektoru.
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - segments
              - recipients
              - senders
              - me
          description: Akce konektoru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_userid
              properties:
                app_userid:
                  type: string
                  description: Id uživatele aplikace připojeného účtu.
                segment_id:
                  type: string
                  description: Id segmentu (povinné pro akci `recipients`).
            examples:
              List segments:
                value:
                  app_userid: "user-123"
              List recipients of a segment:
                value:
                  app_userid: "user-123"
                  segment_id: "SEG123"
      responses:
        '200':
          description: Výsledek akce (tvar závisí na akci)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Segments:
                  value:
                    success: true
                    segments:
                      - id: "SEG123"
                        name: "VIP customers"
                Recipients:
                  value:
                    success: true
                    recipients:
                      - "420777123456"
                      - "420777000111"
                Not authenticated:
                  value:
                    success: false
                    message: "Klaviyo request not authenticated"
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid 'app_userid' in request data
        '404':
          description: Nepodporovaný konektor nebo akce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unsupported connector or action


