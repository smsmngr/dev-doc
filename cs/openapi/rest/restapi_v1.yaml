                billing_id:
                  type: string
                name:
                  type: string
                  description: Název společnosti.
                email:
                  type: string
                street:
                  type: string
                city:
                  type: string
                zip:
                  type: string
                country:
                  type: string
                  description: ISO kód země (výchozí `CZ`).
                company_id:
                  type: string
                  description: IČO.
                company_vat:
                  type: string
                  description: DIČ.
                dryrun:
