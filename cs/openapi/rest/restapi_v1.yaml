  /credit/orders:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Objednané služby"
      tags:
        - credit
      summary: Vypsat objednané služby
      description: |
        Vrací placené služby, které tento API klíč skutečně objednal — na rozdíl od `/credit/services`, který vrací katalog objednatelných služeb. Slouží k dohledání `subject` objednávky, který `/credit/cancel` vyžaduje přesně.

        Služby objednané se `subject: order` nemají v okamžiku objednávky přidělené číslo. Dokud ho operátor nepřidělí, vrací se taková služba s `pending: true` a zástupným `subject`, který objednávku identifikuje, ale nelze ho použít jako odesílatele.
      responses:
        '200':
          description: Objednané služby
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        service_id:
                          type: string
                          description: Ploché id služby z katalogu.
                        subject:
                          type: string
                          description: Předmět objednané služby. Dokud je `pending` `true`, jde pouze o zástupnou hodnotu.
                        status:
                          type: [string, "null"]
                          description: Stav služby (`new`, `active`, `suspended`, `cancelled`).
                        created:
                          type: [string, "null"]
                          description: Datum objednávky (YYYY-MM-DD).
                        next_charge:
                          type: [string, "null"]
                          description: Datum další opakované platby (YYYY-MM-DD). `null`, dokud není služba aktivována.
                        charge_day:
                          type: [integer, "null"]
                          description: Den v měsíci, ke kterému je opakovaná platba ukotvena.
                        currency:
                          type: [string, "null"]
                        recurring_fee:
                          type: number
                          description: Částka účtovaná v každém zúčtovacím období.
                        cancel_at_period_end:
                          type: boolean
                          description: '`true`, pokud je služba označena k ukončení na konci aktuálního zaplaceného období.'
                        pending:
                          type: boolean
                          description: '`true`, dokud operátor nepřidělil skutečné číslo.'
              example:
                success: true
                orders:
                  - service_id: "sender_sms_420_alnum"
                    subject: "Mojefirma"
                    status: "active"
                    created: "2026-08-15"
                    next_charge: "2026-11-15"
                    charge_day: 15
                    currency: "czk"
                    recurring_fee: 500
                    cancel_at_period_end: false
                    pending: false
                  - service_id: "sender_sms_420_mobilevn"
                    subject: "420012345678"
                    status: "new"
                    created: "2026-09-10"
                    next_charge: null
                    charge_day: 10
                    currency: "czk"
                    recurring_fee: 3600
                    cancel_at_period_end: false
                    pending: true
        '500':
          description: Výpis selhal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to list ordered services

  /credit/order:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Objednat službu"
      tags:
        - credit
      summary: Objednat placenou službu
      description: |
        Objedná placenou službu z katalogu (viz `/credit/services`) a odečte poplatek z vašeho kreditu. Celkový poplatek je `setup + monthly × months`, kde počet měsíců vyplývá z minimálního intervalu služby (`year` = 12, `quarter` = 3, jinak 1). U služeb se `subject: defined` musíte předmět dodat (např. text odesílatele nebo telefonní číslo); u `subject: assigned` je číslo z poolu přiděleno automaticky. U `subject: order` přidělí číslo operátor až za několik dní: objednávka je přijata ihned s `pending: true` a zástupným `subject`, který ji identifikuje, dokud nedorazí skutečné číslo. Objednávka služby, kterou už se stejným předmětem máte, je odmítnuta s `409` a nic se neúčtuje. Pomocí `dryrun` objednávku pouze ověříte (kredit, dostupnost) bez jakýchkoliv změn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - period
              properties:
                service_id:
                  type: string
                  description: Ploché id služby z katalogu.
                  example: sender_sms_420_alnum
                period:
                  type: string
                  description: Požadované fakturační období. Skutečné fakturační období je určeno minimálním intervalem služby.
                  example: month
                subject:
                  type: string
                  description: 'Předmět služby (text odesílatele, telefonní číslo, ...). Povinné u služeb se `subject: defined`.'
                payload:
                  type: object
                  description: Volitelná doplňková data uložená k objednávce služby.
                dryrun:
                  type: boolean
                  description: Pokud je `true`, objednávka se pouze ověří a vrátí se celkový poplatek bez jakýchkoliv změn.
            examples:
              Order text sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
              Dry run:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
                  dryrun: true
      responses:
        '200':
          description: Služba objednána
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    type: object
                    properties:
                      subject:
                        type: string
                        description: Předmět objednané služby (u služeb typu `assigned` přidělené číslo).
                      subject_id:
                        type: string
                      status:
                        type: string
                        description: Počáteční stav služby (`new` nebo `active`).
                      pending:
                        type: boolean
                        description: '`true`, pokud číslo ještě nebylo přiděleno a `subject` je pouze zástupný.'
                      dryrun:
                        type: boolean
                        description: Přítomno pouze u dry runů.
                      total_fee:
                        type: number
                        description: Celkový poplatek (pouze dry run).
                      currency:
                        type: string
                        description: Měna poplatku (pouze dry run).
                      service_id:
                        type: string
                        description: Id služby (pouze dry run).
              examples:
                Ordered:
                  value:
                    success: true
                    order:
                      subject: "Mojefirma"
                      subject_id: "Mojefirma"
                      status: "new"
                Ordered without a subject:
                  value:
                    success: true
                    order:
                      subject: "420012345678"
                      subject_id: "420012345678"
                      status: "new"
                      pending: true
                Dry run:
                  value:
                    success: true
                    order:
                      dryrun: true
                      total_fee: 1000
                      currency: "czk"
                      subject: null
                      service_id: "sender_sms_420_alnum"
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '402':
          description: Nedostatečný kredit na celkový poplatek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Insufficient credit
        '409':
          description: Objednávka je v konfliktu s aktuálním stavem; nic nebylo účtováno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Already ordered:
                  value:
                    message: Service already ordered
                No available sender:
                  value:
                    message: No available sender for this service
        '500':
          description: Objednávka selhala
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid service id

  /credit/cancel:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Zrušit službu"
      tags:
        - credit
      summary: Zrušit placenou službu
      description: |
        Označí objednanou službu ke zrušení na konci zaplaceného období. Nedochází k žádnému okamžitému účtování ani vracení peněz; služba zůstává aktivní do konce zaplaceného období. Volání je idempotentní.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - subject
              properties:
                service_id:
                  type: string
                  description: Ploché id služby z katalogu.
                  example: sender_sms_420_alnum
                subject:
                  type: string
                  description: Přesný předmět objednané služby.
                  example: Mojefirma
            examples:
              Cancel sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  subject: "Mojefirma"
      responses:
        '200':
          description: Služba označena ke zrušení
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cancel:
                    type: object
                    properties:
                      cancel_at_period_end:
                        type: boolean
                      active_until:
                        type:
                          - string
                          - 'null'
                        description: Datum, do kterého služba zůstává aktivní (`YYYY-MM-DD`).
              example:
                success: true
                cancel:
                  cancel_at_period_end: true
                  active_until: "2026-08-15"
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '500':
          description: Zrušení selhalo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not found:
                  value:
                    message: Service not found
                Already cancelled:
                  value:
                    message: Service already cancelled

