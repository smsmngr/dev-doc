          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'billing_id' in request data
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to get billing

  /billing/set:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Nastavit fakturaci"
      tags:
        - billing
      summary: Nastavit fakturační kontakt
      description: |
        Aktualizuje fakturační kontakt pro fakturační id vlastněné volajícím klíčem. Povinné je `billing_id` plus alespoň jedno kontaktní pole. Sdílené podřízené klíče nevlastní fakturační záznam a tento endpoint použít nemohou.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - billing_id
              properties:
                billing_id:
                  type: string
                name:
                  type: string
                  description: Název společnosti.
                email:
                  type: string
                street:
                  type: string
                city:
                  type: string
                zip:
                  type: string
                country:
                  type: string
                  description: ISO kód země (výchozí `CZ`).
                company_id:
                  type: string
                  description: IČO.
                company_vat:
                  type: string
                  description: DIČ.
                dryrun:
                  type: boolean
                  description: Pokud je `true`, požadavek se pouze ověří bez uložení.
            examples:
              Update contact:
                value:
                  billing_id: "1234"
                  name: "ACME s.r.o."
                  email: "invoicing@acme.example"
                  street: "Ulice 1"
                  city: "Praha"
                  zip: "11000"
                  country: "cz"
                  company_id: "12345678"
                  company_vat: "CZ12345678"
      responses:
        '200':
          description: Fakturační kontakt uložen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  dryrun:
                    type: boolean
                    description: Přítomno pouze u dry runů.
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing billing id:
                  value:
                    message: Missing 'billing_id' in request data
                Missing fields:
                  value:
                    message: Missing required fields in request data
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Apikey is not authorized for this billing_id
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

