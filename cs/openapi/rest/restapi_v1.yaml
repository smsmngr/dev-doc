                                price_eur:
                                  type: number
                                  description: Celková cena v EUR; vratky za neodeslané zprávy se odečítají.
                                first_ts_sent:
                                  type:
                                    - string
                                    - 'null'
                                  description: Unixový timestamp (sekundy) prvního odeslání, jako řetězec.
                                last_ts_sent:
                                  type:
                                    - string
                                    - 'null'
                                  description: Unixový timestamp (sekundy) posledního odeslání, jako řetězec.
                                msg_mccmnc:
                                  type: object
                                  description: Počty zpráv podle mobilní sítě (MCC+MNC).
                                  additionalProperties:
                                    type: integer
                                count_notsent_codes:
                                  type: object
                                  description: Rozpad `count_notsent` podle stavového kódu zamítnutí (300–399); součet odpovídá `count_notsent`.
                                  additionalProperties:
                                    type: integer
                                flow_stats:
