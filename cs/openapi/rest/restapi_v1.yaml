        - partner
      summary: Zahájit partnerskou registraci
      description: |
        Zahájí onboarding v partnerském brandingu. Vrací podepsaný token (platný 1 hodinu) a hostovanou registrační URL, kde koncový uživatel dokončí registraci. Dostupné pouze pro partnerské účty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connector_name:
                  type: string
                  description: Název konektoru/integrace.
                callback_url:
                  type: string
                  description: URL, kterou náš systém zavolá po dokončení registrace.
                callback_data:
                  type: string
                  description: Neprůhledná data předaná zpět do callbacku.
                final_url:
                  type: string
                  description: URL, na kterou je uživatel přesměrován po dokončení registrace.
                partner_logo_url:
                  type: string
                  description: URL loga partnera zobrazeného na registrační stránce.
                partner_client_id:
                  type: string
                  description: Váš identifikátor klienta.
                partner_client_data:
                  type: string
                  description: Neprůhledná data klienta uložená k registraci.
                language:
                  type: string
                  description: Jazyk registrační stránky.
                partner_copyright:
                  type: string
                  description: Copyright/patičkový text zobrazený na registrační stránce.
            examples:
              Start signup:
                value:
                  connector_name: "My Shop"
                  callback_url: "https://partner.example/callback"
                  callback_data: "abc"
                  final_url: "https://partner.example/done"
                  partner_logo_url: "https://partner.example/logo.png"
                  partner_client_id: "client-1"
                  language: "en"
                  partner_copyright: "© My Shop"
      responses:
        '200':
          description: Registrace zahájena
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                    description: Podepsaný registrační token (platný 1 hodinu).
                  domain:
                    type: string
                  redirect_url:
                    type: string
                    description: Hostovaná registrační URL pro koncového uživatele.
              example:
                success: true
                token: "eyJhbGciOi..."
                domain: "connect.smsmanager.com"
                redirect_url: "https://connect.smsmanager.com/?configuration=eyJhbGciOi..."
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to new partner registration

