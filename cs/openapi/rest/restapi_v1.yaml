          description: Interní chyba
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: false
                message: Failed to generate download URL
    post:
      x-mint:
        metadata:
          sidebarTitle: "Přidat na blacklist"
      tags:
        - blacklist
      summary: Přidat čísla na blacklist
      description: |
        Přidá telefonní čísla na blacklist účtu. Čísla jsou normalizována (českým 9místným mobilním číslům je předřazeno `420`) a zpracovávána asynchronně — volání vrací počet přijatých čísel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  description: Seznam telefonních čísel oddělených novým řádkem.
                  example: "420777123456\n420777654321"
                subid:
                  type: string
                  default: default
                  description: Id podúčtu.
            examples:
              Add numbers:
                value:
                  to: "420777123456\n776654321"
                  subid: "default"
      responses:
        '200':
          description: Čísla přijata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  accepted:
                    type: integer
                    description: Počet přijatých unikátních platných čísel.
                  invalid:
                    type: array
                    items:
                      type: string
                    description: Vstupní řádky, které se nepodařilo rozpoznat jako telefonní čísla.
              example:
                success: true
                accepted: 2
                invalid: []
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  invalid:
                    type: array
                    items:
                      type: string
              examples:
                Missing to:
                  value:
                    success: false
                    message: "Missing 'to'"
                No valid numbers:
                  value:
                    success: false
                    message: "No valid phone numbers"
                    invalid:
                      - "not-a-number"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: false
                message: Enqueue failed
    delete:
      x-mint:
        metadata:
          sidebarTitle: "Odebrat z blacklistu"
      tags:
        - blacklist
      summary: Odebrat čísla z blacklistu
      description: 'Odebere konkrétní čísla z blacklistu, nebo pomocí `all: true` smaže celý seznam.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  description: Seznam čísel k odebrání oddělených novým řádkem. Povinné, pokud `all` není `true`.
                all:
                  type: boolean
                  description: Pokud je `true`, smaže celý blacklist.
                subid:
                  type: string
                  default: default
                  description: Id podúčtu.
            examples:
              Remove numbers:
                value:
                  to: "420777123456"
              Wipe list:
                value:
                  all: true
      responses:
        '200':
          description: Čísla odebrána
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  blacklist:
                    type: object
                    properties:
                      removed:
                        type: integer
                      remaining:
                        type: integer
                      invalid:
                        type: array
                        items:
                          type: string
                      wiped:
                        type: boolean
              examples:
                Removed:
                  value:
                    success: true
                    blacklist:
                      removed: 1
                      remaining: 5
                      invalid: []
                Wiped:
                  value:
                    success: true
                    blacklist:
                      wiped: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                type: object
              example:
                success: false
                blacklist:
                  message: "Provide 'to' or 'all: true'"
        '404':
          description: Blacklist nenalezen
          content:
            application/json:
              schema:
                type: object
              example:
                success: false
                blacklist:
                  message: Blacklist not found
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                type: object
              example:
                success: false
                blacklist:
                  message: Delete failed

