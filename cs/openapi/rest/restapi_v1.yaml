openapi: 3.1.0
info:
  title: REST API SmsManager
  description: |
    REST API pro správu vašeho účtu SmsManager: API klíče, kredit, fakturace, kontaktní seznamy (blacklist / opt-out), zjišťování stavu zpráv, přijaté zprávy a podpora hromadného odesílání.

    ## Autentizace

    Pro všechny požadavky je vyžadován API klíč — zasílejte jej v HTTP hlavičce `x-api-key`. Svůj API klíč najdete v sekci [Vývojáři](https://app.smsmanager.com/app/developers/).

    Pro odesílání zpráv použijte [JSON API v2](https://api.smsmngr.com/v2).
  version: v1
  contact:
    url: https://smsmanager.com
    email: cc@smsmanager.com

servers:
  - url: 'https://rest-api.smsmngr.com/v1'
    description: Produkční server

security:
  - x-api-key: []

components:
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Chybová zpráva.

paths:
  /apikey/me:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Info o klíči"
      tags:
        - api
      summary: Získat informace o aktuálním API klíči
      description: |
        Vrací profil volajícího API klíče. Tento endpoint vždy odráží aktuální stav klíče (povolen/zablokován, odesílatelé, rozsah oprávnění).
      responses:
        '200':
          description: Informace o API klíči
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  me:
                    type: object
                    properties:
                      note:
                        type: string
                        description: Vaše poznámka připojená k API klíči.
                      default_callback_url:
                        type: string
                        description: Výchozí webhook URL pro notifikace o doručení.
                      callback_secret:
                        type: string
                        description: Secret pro podepisování webhook požadavků (64 hex znaků). Prázdný, pokud je podepisování vypnuté. Spravuje se přes `default_callback_secret` na `/apikey/update`.
                      account:
                        type: string
                        enum:
                          - prepaid
                          - postpaid
                        description: Typ účtu.
                      scope:
                        type: string
                        enum:
                          - full
                          - rest-api
                          - api
                        description: Rozsah oprávnění API klíče. `full` a `rest-api` mohou měnit nastavení, `api` může pouze odesílat zprávy.
                      share_senders:
                        type: string
                        description: '`"1"`, pokud klíč sdílí odesílatele se svými podřízenými klíči.'
                      is_blocked:
                        type: integer
                        description: '`1`, pokud je klíč zablokován.'
                      senders:
                        type: array
                        description: Všichni registrovaní odesílatelé klíče, jedna položka za odesílatele a kanál.
                        items:
                          type: object
                          properties:
                            flow:
                              type: string
                              description: Kanál odesílatele (`sms`, `viber`, `whatsapp`, ...).
                            value:
                              type: string
                              description: Hodnota odesílatele (název nebo číslo).
                            name:
                              type: string
                              description: Zobrazovaný název odesílatele.
                      default_sender:
                        type: string
                        description: Výchozí odesílatel účtu; použije se, když zpráva neuvádí `sender` ani na jedné úrovni. Může jít i o název aliasu odesílatele.
                      sender_aliases:
                        type: array
                        description: Aliasy odesílatele pro tento klíč. Alias je jeden název, pod kterým můžete odesílat a který se pro každou předvolbu příjemce přeloží na jiného zaregistrovaného odesílatele. Nastavuje podpora.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Název aliasu, který použijete jako `sender` zprávy.
                            prefixes:
                              type: object
                              additionalProperties:
                                type: string
                              description: Mapování předvolby na odesílatele.
                      whitelist_ip:
                        type: array
                        items:
                          type: string
                        description: IP whitelist pro odesílání. Položka obsahující `.` nebo `:` se porovnává jako přesná IP adresa; jakákoli jiná položka se porovnává jako podřetězec názvu ISP/organizace IP adresy požadavku. Prázdné pole znamená žádné omezení. Spravuje se přes `/apikey/update`.
                      vat:
                        type: string
                        description: '`"1"`, pokud je účet plátcem DPH.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Měna účtu.
                      tz:
                        type: string
                        description: Časová zóna účtu.
                        example: Europe/Prague
              examples:
                Current key:
                  value:
                    success: true
                    me:
                      note: "eshop"
                      default_callback_url: "https://example.com/hook"
                      callback_secret: "3f1c9a0d8e7b64520f4a1b2c3d4e5f60718293a4b5c6d7e8f9012345a6b7c8d9"
                      account: "prepaid"
                      scope: "full"
                      share_senders: "1"
                      is_blocked: 0
                      senders:
                        - flow: "sms"
                          value: "Mojefirma"
                          name: "Mojefirma"
                        - flow: "sms"
                          value: "Mojefirma CZ"
                          name: "Mojefirma CZ"
                      default_sender: "Mojefirma"
                      sender_aliases:
                        - name: "brand"
                          prefixes:
                            "420": "Mojefirma CZ"
                            "421": "Mojefirma SK"
                      whitelist_ip:
                        - "1.2.3.4"
                        - "internet cz"
                      vat: "1"
                      currency: "czk"
                      tz: "Europe/Prague"
        '401':
          description: Neautorizováno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to load API key

  /apikey/add:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Vytvořit sub-klíč"
      tags:
        - api
      summary: Vytvořit podřízený API klíč
      description: |
        Vytváří nový podřízený (sub) API klíč pod volajícím nadřazeným klíčem. Podřízené klíče může vytvářet pouze nadřazený klíč s rozsahem oprávnění `full` nebo `rest-api` (max. 19 podřízených klíčů).

        Sdílený (`shared`) podřízený klíč přebírá fakturaci a měnu nadřazeného klíče a čerpá kredit z jeho peněženky. Nesdílený podřízený klíč má vlastní fakturaci — pole `billing_name`, `billing_email` a `currency` jsou pak povinná.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shared:
                  type: boolean
                  description: Pokud je `true`, nový klíč sdílí fakturaci a kredit s nadřazeným klíčem (měnu dědí od nadřazeného klíče).
                billing_name:
                  type: string
                  description: Fakturační jméno. Povinné, pokud `shared` není `true`.
                billing_email:
                  type: string
                  description: Fakturační e-mail. Povinný, pokud `shared` není `true`.
                currency:
                  type: string
                  enum:
                    - czk
                    - eur
                  description: Měna nového klíče. Povinná, pokud `shared` není `true` (sdílený klíč dědí měnu nadřazeného klíče).
                app_userid:
                  type: string
                  description: Volitelná vazba na uživatele aplikace. Pokud klíč pro tohoto uživatele již existuje, je vrácen existující klíč místo vytvoření nového.
                billing_id:
                  type: string
                  description: Volitelné existující fakturační id.
                note:
                  type: string
                  description: Vaše poznámka k novému klíči.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: Rozsah oprávnění nového klíče.
                share_senders:
                  type: boolean
                  description: Pokud je `true`, registrovaní odesílatelé nadřazeného klíče (a WhatsApp čísla) jsou sdíleni s novým klíčem.
            examples:
              Child key with own billing:
                value:
                  billing_name: "ACME s.r.o."
                  billing_email: "invoicing@acme.example"
                  currency: "czk"
                  note: "eshop"
                  scope: "rest-api"
              Shared child key:
                value:
                  shared: true
                  note: "warehouse app"
                  scope: "api"
                  share_senders: true
      responses:
        '200':
          description: API klíč vytvořen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  apikey:
                    type: string
                    description: Nový API klíč.
                  billing_id:
                    type:
                      - string
                      - 'null'
                    description: Fakturační id nového klíče (`null` u sdíleného klíče).
              examples:
                Created:
                  value:
                    success: true
                    apikey: "aB3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: "1234"
                Created shared:
                  value:
                    success: true
                    apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: null
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing fields:
                  value:
                    message: Missing required fields in request data
                Invalid scope:
                  value:
                    message: Invalid scope value
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not top-level:
                  value:
                    message: Only a top-level apikey can create new apikeys
                Limit reached:
                  value:
                    message: Child apikey limit reached (19)
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/update:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Upravit klíč"
      tags:
        - api
      summary: Upravit API klíč
      description: |
        Upravuje nastavení volajícího API klíče, nebo — pokud je přítomno pole `apikey` — některého z jeho podřízených klíčů. Všechna nastavení jsou volitelná: mění se pouze pole přítomná v požadavku, `null` (nebo prázdný řetězec) hodnotu smaže. Požadavek bez rozpoznaného nastavení vrací 400. Změna `default_callback_url` zároveň aktualizuje webhook URL u všech odesílatelů upravovaného klíče.

        Úprava podřízeného klíče: pole `apikey` smí použít pouze nadřazený (top-level) klíč a cíl musí být jedním z jeho podřízených klíčů (viz `/apikey/list`). Všechna nastavení se chovají přesně tak, jako by se podřízený klíč upravoval sám — např. registrace `default_sender` se ověřuje proti odesílatelům podřízeného klíče. Funguje to i pro podřízené klíče se scope `api`, které tento endpoint samy volat nemohou. Pole `scope` a `disable` jsou přijímána pouze společně s `apikey`; klíč nikdy nemůže měnit vlastní scope ani blokaci.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apikey:
                  type: string
                  description: Podřízený API klíč, který se má upravit místo volajícího klíče. Smí jej použít pouze nadřazený klíč a cíl mu musí patřit.
                default_callback_url:
                  type: [string, 'null']
                  description: Výchozí webhook URL pro notifikace o doručení. `null` nebo prázdný řetězec hodnotu smaže.
                note:
                  type: [string, 'null']
                  description: Vaše poznámka ke klíči. `null` nebo prázdný řetězec hodnotu smaže.
                default_sender:
                  type: [string, 'null']
                  maxLength: 64
                  description: Výchozí odesílatel pro zprávy, které neuvádějí `sender`. Může jít o zaregistrovaného odesílatele nebo o název aliasu odesílatele. Nesmí obsahovat `,` ani `:`. `null` nebo prázdný řetězec jej smaže. Odesílatele, který pro klíč není zaregistrovaný, uložíme, ale vrátíme jej ve `warning` a při odeslání bude ignorován.
                whitelist_ip:
                  type: [array, 'null']
                  items:
                    type: string
                    maxLength: 100
                  maxItems: 50
                  description: IP whitelist pro odesílání. Položka obsahující `.` nebo `:` se porovnává jako přesná IP adresa (bez CIDR rozsahů); jakákoli jiná položka se porovnává jako podřetězec názvu ISP/organizace IP adresy požadavku. Zprávy odeslané z adresy mimo whitelist se místo odeslání podrží na ruční schválení. `null` nebo prázdné pole omezení zruší. Položky nesmí obsahovat `,`.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: Nový rozsah oprávnění podřízeného klíče. Přijímáno pouze společně s `apikey`.
                disable:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: '`1` podřízený klíč zablokuje, `0` odblokuje. Přijímáno pouze společně s `apikey`.'
            examples:
              Set callback:
                value:
                  default_callback_url: "https://example.com/hook"
                  note: "eshop"
              Clear callback:
                value:
                  default_callback_url: null
              Set default sender:
                value:
                  default_sender: "Mojefirma"
              Set IP whitelist:
                value:
                  whitelist_ip:
                    - "1.2.3.4"
                    - "internet cz"
              Clear IP whitelist:
                value:
                  whitelist_ip: null
              Update a child key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  default_sender: "Mojefirma"
                  note: "eshop child"
              Block a child key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  disable: 1
      responses:
        '200':
          description: API klíč upraven
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  warning:
                    type: string
                    description: Vyplněno, když se nastavení uložilo, ale něco vyžaduje pozornost, například nedostupná callback URL nebo nezaregistrovaný výchozí odesílatel.
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No settings to update
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Scope not allowed:
                  value:
                    message: Apikey scope 'api' is not allowed to change settings
                Not a parent:
                  value:
                    message: Only a top-level apikey can update child apikeys
                Not owner:
                  value:
                    message: Target apikey does not belong to this parent
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/list:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Vypsat sub-klíče"
      tags:
        - api
      summary: Vypsat podřízené API klíče
      description: Vypíše podřízené API klíče vytvořené volajícím klíčem.
      responses:
        '200':
          description: Seznam podřízených API klíčů
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  list:
                    type: array
                    items:
                      type: string
                    description: Podřízené API klíče.
              example:
                success: true
                list:
                  - "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  - "eF5xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/change:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Změnit sub-klíč"
      tags:
        - api
      summary: Změnit podřízený API klíč (zastaralé)
      deprecated: true
      description: |
        **Zastaralé** — použijte místo něj `/apikey/update` s polem `apikey`, které pokrývá `scope`/`disable` i všechna ostatní nastavení podřízeného klíče. Tento endpoint zůstává funkční pro stávající integrace.

        Mění rozsah oprávnění a/nebo blokaci podřízeného API klíče. Podřízené klíče může měnit pouze nadřazený klíč; nadřazený klíč nemůže měnit sám sebe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apikey
              properties:
                apikey:
                  type: string
                  description: Podřízený API klíč, který se má změnit.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: Nový rozsah oprávnění podřízeného klíče. Vyžadováno je alespoň jedno z polí `scope` / `disable`.
                disable:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: '`1` podřízený klíč zablokuje, `0` odblokuje. Vyžadováno je alespoň jedno z polí `scope` / `disable`.'
            examples:
              Change scope:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  scope: "api"
              Disable key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  disable: 1
      responses:
        '200':
          description: API klíč změněn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Špatný požadavek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing apikey:
                  value:
                    message: Missing 'apikey' in request data
                Missing change:
                  value:
                    message: Missing 'scope' or 'disable' in request data
        '403':
          description: Zakázáno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not owner:
                  value:
                    message: Target apikey does not belong to this parent
                Self change:
                  value:
                    message: Parent apikey cannot change itself
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credit:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Stav kreditu"
      tags:
        - credit
      summary: Získat stav kreditu
      description: 'Vrací aktuální stav kreditu a dosažené cenové hladiny volajícího klíče. Pro sdílené podklíče (vytvořené se `shared: true`) vrací stav sdílené peněženky (nadřazeného klíče).'
      responses:
        '200':
          description: Stav kreditu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  credit:
                    type: object
                    properties:
                      priceLevels:
                        type: object
                        description: Mapa `<platform>_<mcc>` na index dosaženého slevového pásma (přítomny jsou pouze položky s indexem větším než 0).
                        additionalProperties:
                          type: integer
                      credit_czk:
                        type: string
                        description: Stav kreditu v CZK (číselný řetězec).
                      credit_eur:
                        type: string
                        description: Stav kreditu v EUR (číselný řetězec).
                      billing_id:
                        type: string
                        description: Fakturační id klíče (číselný řetězec).
                      vat:
                        type: string
                        description: '`"1"`, pokud je účet plátcem DPH.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Měna účtu.
                      tz:
                        type: string
                        description: Časová zóna účtu.
                        example: Europe/Prague
              example:
                success: true
                credit:
                  priceLevels:
                    sms_230: 2
                  credit_czk: "150.5"
                  credit_eur: "0"
                  billing_id: "1234"
                  vat: "1"
                  currency: "czk"
                  tz: "Europe/Prague"
        '500':
          description: Interní chyba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to check credit

  /credit/services:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Katalog služeb"
      tags:
        - credit
      summary: Získat katalog služeb
      description: |
        Vrací katalog objednatelných placených služeb (odesílatelé, virtuální čísla, SIM hosting, ...). Katalog má strukturu `services.sender.<platform>.<country_calling_code>.<variant>`. Ploché id služby používané v `/credit/order` se skládá jako `sender_<platform>_<calling_code>_<variant>` (např. `sender_sms_420_alnum`).

        Každá varianta služby obsahuje: lokalizovaný `name` (a volitelné `requirements` a `delay`), `subject` (`defined` = předmět dodáváte vy, např. text odesílatele nebo telefonní číslo, `assigned` = číslo z poolu je přiděleno automaticky, `order` = číslo přidělí operátor později, viz `/credit/orders`), volitelný výchozí `status` a `prices` pro jednotlivé měny s poli `setup`, `monthly` a volitelně `min_interval` (`month` / `year`) nebo `min_monthly_spend`.
      responses:
        '200':
          description: Katalog služeb
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  services:
                    type: object
                    description: Vnořený katalog služeb.
              example:
                success: true
                services:
                  sender:
                    sms:
                      "420":
                        alnum:
                          name:
                            cs: "Textový odesílatel"
                            en: "Text ID sender"
                          subject: "defined"
                          status: "new"
                          prices:
                            czk:
                              setup: 500
                              monthly: 500
                            eur:
                              setup: 20
                              monthly: 20
                        simhost:
                          name:
                            cs: "SIM hosting"
                            en: "SIM hosting"
                          subject: "defined"
                          prices:
                            czk:
                              setup: 200
                              monthly: 100
                              min_interval: "year"
                            eur:
                              setup: 8
                              monthly: 4
                              min_interval: "year"

  /credit/prices:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Ceník"
      tags:
        - credit
      summary: Získat ceník
      description: |
        Vrací ceník podle destinací, klíčovaný kanálem (`sms`, `smsdirect`, `smscustom`, `viber`) a telefonní předvolbou země. Každá položka obsahuje `mcc` země, `price_czk`, `price_eur` a volitelně ceny pro jednotlivé operátory v `operators`.
      responses:
        '200':
          description: Ceník
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prices:
                    type: object
                    description: Ceník klíčovaný kanálem a telefonní předvolbou země.
              example:
                success: true
                prices:
                  sms:
                    "420":
                      mcc: 230
                      price_czk: 0.89
                      price_eur: 0.04
                      operators:
                        "1":
                          price_czk: 0.89
                          price_eur: 0.04
                    "49":
                      mcc: 262
                      price_czk: 1.85
                      price_eur: 0.08
                  viber:
                    "420":
