openapi: 3.1.0
info:
  title: JSON API
  description: |
    API for sending messages via SMS, Viber, WhatsApp, RCS and other communication channels.

    ## JSON API v2

    API key is required for all requests. You can find your API key in your [account settings](https://app.smsmanager.com/api-cloud).

    Older API versions (http-api and xml-api) are deprecated and you should use this JSON API v2 instead.
  version: v2
  contact:
    url: https://smsmanager.cz
    email: cc@smsmanager.cz

servers:
  - url: 'https://api.smsmngr.com/v2'
    description: Responds with your request data

components:
  schemas:
    Message:
      type: object
      required:
        - to
      properties:
        body:
          type: string
          maxLength: 1000
          description: The message body (if not defined in the flow). The body is required either here in the root object or in the flow step. Longer bodies are truncated to 1000 characters.
        to:
          type: array
          minItems: 1
          maxItems: 10
          description: List of recipients.
          items:
            type: object
            properties:
              phone_number:
                type: string
                description: Recipient's phone number. The international format (E.164, without leading `+` or `00`) is recommended but also another format is accepted (before accepting the request, we will convert it to the international format).
                example: "420777123456"
            required:
              - phone_number
        sender:
          type: string
          description: Default sender for all flow steps. If a flow step defines its own `sender`, the flow step value has higher priority. Alphanumeric sender name (max. 11 characters, pre-registration may be required) or dedicated virtual number (without `+`).
          examples:
            - Mojefirma
            - "420777123456"
        callback:
          oneOf:
            - type: string
              format: uri
            - type: object
          description: Callback URL for receiving delivery notifications (Webhook, see [Webhooks](#tag/Webhooks)). You can pass a plain URL string or an object with extended callback configuration.
        tag:
          type: string
          default: 'promotional'
          description: 'Tag for the message. You can use it to group messages (e.g. by campaign id). Multiple tags can be passed separated by comma. Tags are normalized to lowercase and only characters `a-z`, `0-9`, `-`, `.` and `_` are kept. There are also some special tags you can use: `priority` (for priority messages), `transactional` (for transactional messages). Messages with the default `promotional` tag are checked against the recipient opt-out list.'
        messageTag:
          type: string
          deprecated: true
          description: Deprecated alias of `tag`. Use `tag` instead.
        params:
          type: object
          description: 'By providing this object, you can pass special parameters to the message, e.g. automatic link shortening via the `_url` object. Ask us how to use this parameter for other features.'
          properties:
            _url:
              type: object
              description: Automatic link shortening. Links found in the message body are replaced by short redirect links.
              properties:
                type:
                  type: string
                  enum:
                    - full
                    - all
                  default: full
                  description: '`full` shortens only complete URLs including the protocol (e.g. `https://example.com/page`). `all` shortens all detected domains and addresses.'
                domain:
                  type: string
                  description: Custom domain used for the shortened links (must be pre-configured for your account).
                get_enhance:
                  type: string
                  enum:
                    - id
                  description: If set to `id`, the unique `message_id` is appended to the shortened link as a query parameter, so you can identify the recipient after the click.
                get_name:
                  type: string
                  default: '_'
                  description: Name of the query parameter used by `get_enhance`.
                expires_at:
                  type: integer
                  description: Unix timestamp of the shortened link expiration. Defaults to 7 days from now. (Deprecated alias `expires` is still accepted.)
                  example: 1736589600
        datetime:
          type: string
          format: date-time
          description: Scheduled time for sending the message. Always in UTC timezone. If the time is more than 1 minute in the future, the message is scheduled and processed at the given time. Times in the past are sent immediately.
          example: "2025-01-11T10:00:00Z"
        delivery_time:
          type: object
          description: Allowed delivery window. If the current (or scheduled) time is outside the window, sending is moved to the nearest valid time.
          properties:
            days:
              type: array
              items:
                type: string
                enum:
                  - monday
                  - tuesday
                  - wednesday
                  - thursday
                  - friday
                  - saturday
                  - sunday
              description: Days of the week when delivery is allowed.
            start:
              type: string
              description: Start time of the delivery window.
              example: 08:00
            end:
              type: string
              description: End time of the delivery window.
              example: 21:00
            tz:
              type: string
              description: Timezone of the delivery window.
              example: Europe/Prague, Europe/London, Europe/Berlin, America/New_York
              default: UTC
        flow:
          type: array
          description: |
            A list of communication channels for the message flow. If defined, must not be empty. You can use multiple channels, the order of channels is important (first channel is the first to be used; when the step defines `ttl` and its `ttl_condition` is not met within the TTL, the next channel is used, etc.). If `flow` is not defined, the default `[{"sms": {"gateway": "high"}}]` is used.
          items:
            type: object
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
            properties:
              sms:
                type: object
                properties:
                  body:
                    type: string
                    maxLength: 1000
                    description: This definition of message body here have higher priority than the one defined in the root object.
                  sender:
                    type: string
                    description: Alphanumeric sender name (max. 11 characters, pre-registration may be required) or dedicated virtual number (without `+`). If not set, the root object `sender` is used.
                    examples:
                      - Mojefirma
                      - 420777123456
                  gateway:
                    type: string
                    enum:
                      - high
                      - lowcost
                      - direct
                      - custom
                      - simhost
                      - gsm
                    default: high
                    description: Use `high` for the default high-quality routing, `lowcost` for low-cost routing. Use `direct` if you use dedicated virtual number. Use `custom` or `simhost` if you use SIM hosting, `gsm` for your own GSM gateway.
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Time to live in minutes. When the next flow step is defined and the `ttl_condition` is not met within the TTL, the message continues with the next flow step.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: sent
                    description: Condition evaluated after the TTL expires. If the message already reached this state, the next flow step is not used.
                  type:
                    type: string
                    enum:
                      - sms
                      - utf
                    default: utf
                    description: Set `utf` if you want to keep unicode characters in the message. Set `sms` if you want to convert or remove unicode from message to keep maximal capacity in SMS.
                required:
                  - body
              viber:
                type: object
                properties:
                  body:
                    type: string
                    maxLength: 1000
                    description: This definition of message body here have higher priority than the one defined in the root object.
                  sender:
                    type: string
                    description: Use the name of the sender you have pre-registered for your Viber Business Message.
                  buttons:
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      required:
                        - title
                        - url
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                          format: uri
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Time to live in minutes. When the next flow step is defined and the `ttl_condition` is not met within the TTL, the message continues with the next flow step.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: delivered
                    description: Condition evaluated after the TTL expires. If the message already reached this state, the next flow step is not used.
                required:
                  - body
                  - sender
              whatsapp_text:
                type: object
                properties:
                  body:
                    type: string
                    description: This definition of message body here have higher priority than the one defined in the root object. You can use custom body of message only when the recipient already reply to your template message or send you a message first.
                    maxLength: 1000
                  sender:
                    type: string
                    description: Phone Number ID of registered WhatsApp number. You can find it in your [WhatsApp settings](https://app.smsmanager.com/whatsapp).
                    examples:
                      - "514578330250514"
                required:
                  - body
                  - sender
              whatsapp_template:
                type: object
                properties:
                  template_name:
                    type: string
                    description: The name of the template you have pre-registered and approved before use.
                    maxLength: 100
                  sender:
                    type: string
                    description: Phone Number ID of registered WhatsApp number. You can find it in your [WhatsApp settings](https://app.smsmanager.com/whatsapp).
                    examples:
                      - "514578330250514"
                  params:
                    type: array
                    items:
                      type: string
                    description: If your template has parameters, you need to pass values for them here.
                  params_header:
                    type: array
                    items:
                      type: string
                    description: If your template has header with parameter, you need to pass value for it here.
                  params_buttons:
                    type: array
                    items:
                      type: string
                    description: If your template buttons have parameters, you need to pass values for them here.
                  language:
                    type: string
                    examples:
                      - en
                      - cs
                    description: The language of the template (you can have multiple languages for the same template).
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Time to live in minutes. When the next flow step is defined and the `ttl_condition` is not met within the TTL, the message continues with the next flow step.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: delivered
                    description: Condition evaluated after the TTL expires. If the message already reached this state, the next flow step is not used.
                required:
                  - template_name
                  - language
                  - sender
              rcs:
                type: object
                properties:
                  body:
                    type: string
                    maxLength: 1000
                    description: This definition of message body here have higher priority than the one defined in the root object.
                  sender:
                    type: string
                    description: Use the RCS agent you have pre-registered for your account.
                  ttl:
                    type: number
                    minimum: 0.5
                    description: Time to live in minutes. When the next flow step is defined and the `ttl_condition` is not met within the TTL, the message continues with the next flow step.
                  ttl_condition:
                    type: string
                    enum:
                      - sent
                      - delivered
                      - seen
                    default: delivered
                    description: Condition evaluated after the TTL expires. If the message already reached this state, the next flow step is not used.
                required:
                  - body
        payload:
          type: object
          description: |
            You can send the message payload, where you can define any parameters for the message. This object is returned in the delivery notification and replies.
          example:
            user_id: "123456"

    MessagesResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unique request identifier.
        accepted:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index of the original request from the body array.'
              message_id:
                type: string
                description: Unique message identifier for each request in the body array.
        rejected:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index of the original request from the body array.'

    MessageResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unique request identifier.
        accepted:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index of the original recipient from the `to` array.'
              message_id:
                type: string
                description: Unique message identifier for accepted message.
        rejected:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: 'Index of the original recipient from the `to` array.'
    MessageSimpleResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unique request identifier.
          example: "bc36f3d1-d284-463a-921b-a3560c154649"
        message_id:
          type: string
          description: Unique message identifier.
          example: "bc36f3d1-d284-463a-921b-a3560c154649"
        accepted:
          type: boolean
          description: True if the message was accepted, false if rejected.
          example: true
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
    apikey:
      type: apiKey
      in: query
      name: apikey


paths:
  /message:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Send message"
      security:
        - x-api-key: [] # API key is required for all requests. You can find your API key in your [account settings](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Send a message
      description: |
        Use this endpoint to send a message to one or more recipients (up to 10 recipients). If you want to use channels other than SMS (Viber, WhatsApp, RCS, etc.), you need to use the `flow` property.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
            examples:
              Simple message:
                value:
                  body: "Test message"
                  to:
                    - phone_number: "420777123456"
              Message with flow:
                value:
                  body: "Test message"
                  to:
                    - phone_number: "420777123456"
                  flow:
                    - sms:
                        sender: "SmsManager"
                        gateway: "high"
                        ttl: 10
              Flow fallback Viber to SMS:
                description: The message is first sent via Viber. If it is not delivered within 10 minutes, it is sent again as SMS.
                value:
                  to:
                    - phone_number: "420777123456"
                  flow:
                    - viber:
                        body: "Your order is ready for pickup"
                        sender: "Mojefirma"
                        ttl: 10
                        ttl_condition: "delivered"
                    - sms:
                        body: "Your order is ready for pickup"
                        sender: "Mojefirma"
              Scheduled message:
                value:
                  body: "Meeting reminder"
                  to:
                    - phone_number: "420777123456"
                  datetime: "2025-01-11T10:00:00Z"
              Message with delivery window:
                description: The message is delivered only on workdays between 8:00 and 21:00 Prague time. Outside of this window the sending is moved to the nearest valid time.
                value:
                  body: "New products in our store!"
                  to:
                    - phone_number: "420777123456"
                  delivery_time:
                    days:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                    start: "08:00"
                    end: "21:00"
                    tz: "Europe/Prague"
              Message with callback and payload:
                value:
                  body: "Order shipped"
                  to:
                    - phone_number: "420777123456"
                  callback: "https://example.com/delivery"
                  payload:
                    order_id: "ORD-1001"
              Message with link shortening:
                description: The link in the body is replaced by a short redirect link with the `message_id` appended as the `c` query parameter.
                value:
                  body: "Rate your purchase at https://example.com/review"
                  to:
                    - phone_number: "420777123456"
                  params:
                    _url:
                      type: "full"
                      get_enhance: "id"
                      get_name: "c"
                      expires_at: 1736589600
              Unicode SMS with custom TTL:
                value:
                  body: "Привет, Ваш код: 1234"
                  to:
                    - phone_number: "420777123456"
                  tag: "transactional"
                  flow:
                    - sms:
                        sender: "SmsManager"
                        type: "utf"
                        ttl: 5
      responses:
        '200':
          description: Messages sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    rejected: []
                Partially rejected:
                  value:
                    request_id: "77777777-7777-7777-7777-777777777777"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    rejected:
                      - key: "1"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    description: Error message.
                    example: User is not authorized to access this resource with an explicit deny

  /message/priority:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Priority message"
      security:
        - x-api-key: [] # API key is required for all requests. You can find your API key in your [account settings](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Send a priority message
      description: |
        Same as `/message`, but the message is processed by the priority queue. Use it for time-critical messages (one-time passwords, transactional notifications). The request and response format is identical to `/message`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
            examples:
              One-time password:
                value:
                  body: "Your verification code is 123456"
                  to:
                    - phone_number: "420777123456"
                  tag: "transactional"
              Transactional notification with flow:
                value:
                  to:
                    - phone_number: "420777123456"
                  tag: "transactional"
                  flow:
                    - sms:
                        body: "Your payment was received."
                        sender: "Mojefirma"
      responses:
        '200':
          description: Messages sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    rejected: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    description: Error message.
                    example: User is not authorized to access this resource with an explicit deny

  /messages:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Send multiple"
      security:
        - x-api-key: [] # API key is required for all requests. You can find your API key in your [account settings](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Send multiple messages
      description: |
        Use this endpoint to send batch of identical messages to more recipients (you can set up to 10 recipients per request and up to 10 requests per one API call). That means, that you can send up to 100 recipients per single HTTP API call. If you want to use channels other than SMS (Viber, WhatsApp, etc.), you need to use the `flow` property. Using this endpoint, you will receive `message_id` for each of requests (not for each recipient). For get message_id for each recipient, you need to append `-<recipient_index>` to the `message_id`. More information about message_id you can find in [documentation](#sending/paths/~1messages/post/response&c=200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/Message'
            examples:
              Two requests with multiple recipients:
                value:
                  - body: "Hello John"
                    to:
                      - phone_number: "420777123456"
                      - phone_number: "420777654321"
                  - body: "Hello Jane"
                    to:
                      - phone_number: "420777115577"
                      - phone_number: "420777223344"
              Mixed channels:
                value:
                  - body: "Promo SMS"
                    to:
                      - phone_number: "420777111111"
                    flow:
                      - sms:
                          sender: "PromoSMS"
                          gateway: "high"
                  - body: "Promo Viber"
                    to:
                      - phone_number: "420777222222"
                    flow:
                      - viber:
                          sender: "PromoViber"
                          ttl: 2
              Scheduled batch:
                value:
                  - body: "Scheduled greetings"
                    to:
                      - phone_number: "420777333333"
                    datetime: "2025-01-11T10:00:00Z"
                  - body: "Another scheduled"
                    to:
                      - phone_number: "420777444444"
                    datetime: "2025-01-11T10:05:00Z"
              WhatsApp templates:
                value:
                  - to:
                      - phone_number: "420777555555"
                    flow:
                      - whatsapp_template:
                          template_name: "order_update"
                          sender: "447700900123"
                          language: "en"
                          params:
                            - "John"
                            - "12345"
                  - to:
                      - phone_number: "420777666666"
                    flow:
                      - whatsapp_template:
                          template_name: "order_update"
                          sender: "447700900123"
                          language: "en"
                          params:
                            - "Jane"
                            - "54321"
              Messages with payload and callback:
                value:
                  - body: "Your package is on the way"
                    to:
                      - phone_number: "420777777777"
                    callback: "https://example.com/delivery"
                    payload:
                      order_id: "ORD-42"
                  - body: "We received your inquiry"
                    to:
                      - phone_number: "420777888888"
                    payload:
                      ticket_id: "TCK-99"
      responses:
        '200':
          description: Messages sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'
              examples:
                Accepted two requests with multiple recipients:
                  description: Two requests with multiple recipients. Be careful, when you use `/messages` endpoint, then you will receive `message_id` for each of requests (not for each recipient). For get message_id for each recipient, you need to append `-<recipient_index>` to the `message_id`. For example, if you have two recipients for the first request, the first recipient will have `message_id` `pppppppp-qqqq-rrrr-ssss-tttttttttttt-0` and the second recipient will have `message_id` `pppppppp-qqqq-rrrr-ssss-tttttttttttt-1`.
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    accepted:
                      - key: "0"
                        message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                      - key: "1"
                        message_id: "uuuuuuuu-vvvv-wwww-xxxx-yyyyyyyyyyyy"
                    rejected: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    description: Error message.
                    example: User is not authorized to access this resource with an explicit deny

  /simple/message:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Simple send (GET)"
      security:
        - apikey: [] # API key is required for all requests. You can find your API key in your [account settings](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Send a simple message (GET request)
      description: |
        Simplified sending of a single SMS via query string parameters. Use `/message` for the full feature set (flows, multiple recipients, delivery window, ...).
      parameters:
        - name: apikey
          in: query
          required: true
          schema:
            type: string
          description: Your API key.
        - name: phone_number
          in: query
          required: true
          schema:
            type: string
          description: Recipient's phone number (alias `number` is also accepted).
          example: "420777123456"
        - name: message
          in: query
          required: true
          schema:
            type: string
          description: The message body (alias `body` is also accepted).
        - name: sender
          in: query
          required: true
          schema:
            type: string
          description: Sender name or virtual number (pre-registration may be required).
        - name: gateway
          in: query
          required: false
          schema:
            type: string
            enum:
              - high
              - lowcost
              - direct
              - custom
              - simhost
              - gsm
            default: high
          description: SMS gateway used for sending.
        - name: datetime
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Scheduled time for sending the message, in UTC (alias `time` is also accepted).
          example: "2025-01-11T10:00:00Z"
        - name: customID
          in: query
          required: false
          schema:
            type: string
          description: Your custom identifier of the message. It is stored in the message `payload` (as `customID`) and returned in delivery notifications.
      responses:
        '200':
          description: Simple message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSimpleResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "66666666-6666-6666-6666-666666666666"
                    message_id: "pppppppp-qqqq-rrrr-ssss-tttttttttttt"
                    accepted: true
                Rejected invalid sender:
                  value:
                    request_id: "77777777-7777-7777-7777-777777777777"
                    accepted: false
                Rejected missing parameter:
                  value:
                    request_id: "88888888-8888-8888-8888-888888888888"
                    accepted: false
                Accepted message with accents:
                  value:
                    request_id: "99999999-9999-9999-9999-999999999999"
                    message_id: "uuuuuuuu-vvvv-wwww-xxxx-yyyyyyyyyyyy"
                    accepted: true
                Accepted high priority:
                  value:
                    request_id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                    message_id: "zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz"
                    accepted: true
        '400':
          description: Invalid request

    post:
      x-mint:
        metadata:
          sidebarTitle: "Simple send (POST)"
      security:
        - x-api-key: [] # API key is required for all requests. You can find your API key in your [account settings](https://app.smsmanager.com/api-cloud).
      tags:
        - sending
      summary: Send a simple message (POST request)
      description: |
        Simplified sending of a single SMS via form parameters. Use `/message` for the full feature set (flows, multiple recipients, delivery window, ...).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - phone_number
                - message
                - sender
              properties:
                phone_number:
                  type: string
                  description: Recipient's phone number (alias `number` is also accepted).
                  example: "420777123456"
                message:
                  type: string
                  description: The message body (alias `body` is also accepted).
                sender:
                  type: string
                  description: Sender name or virtual number (pre-registration may be required).
                gateway:
                  type: string
                  enum:
                    - high
                    - lowcost
                    - direct
                    - custom
                    - simhost
                    - gsm
                  default: high
                  description: SMS gateway used for sending.
                datetime:
                  type: string
                  format: date-time
                  description: Scheduled time for sending the message, in UTC (alias `time` is also accepted).
                  example: "2025-01-11T10:00:00Z"
                customID:
                  type: string
                  description: Your custom identifier of the message. It is stored in the message `payload` (as `customID`) and returned in delivery notifications.
            examples:
              Basic message:
                value:
                  phone_number: "420777123456"
                  message: "Test message"
                  sender: "Mojefirma"
              Message with customID:
                value:
                  phone_number: "420777123456"
                  message: "Order confirmed"
                  sender: "Mojefirma"
                  customID: "ORD-1001"
              Scheduled message:
                value:
                  phone_number: "420777123456"
                  message: "Meeting reminder"
                  sender: "Mojefirma"
                  datetime: "2025-01-11T10:00:00Z"
      responses:
        '200':
          description: Simple message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSimpleResponse'
              examples:
                Accepted message:
                  value:
                    request_id: "11111111-1111-1111-1111-111111111111"
                    message_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                    accepted: true
                Rejected invalid number:
                  value:
                    request_id: "22222222-2222-2222-2222-222222222222"
                    accepted: false
                Rejected insufficient credit:
                  value:
                    request_id: "33333333-3333-3333-3333-333333333333"
                    accepted: false
                Accepted promo message:
                  value:
                    request_id: "44444444-4444-4444-4444-444444444444"
                    message_id: "ffffffff-gggg-hhhh-iiii-jjjjjjjjjjjj"
                    accepted: true
                Accepted transactional message:
                  value:
                    request_id: "55555555-5555-5555-5555-555555555555"
                    message_id: "kkkkkkkk-llll-mmmm-nnnn-oooooooooooo"
                    accepted: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique request identifier.
                    example: "bc36f3d1-d284-463a-921b-a3560c154649"
                  accepted:
                    type: boolean
                    description: True if the message was accepted, false if rejected.
                    example: false
        '415':
          description: 'Wrong Content-Type'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Only Content-Type:application/x-www-form-urlencoded is supported
                    example: 'Unsupported Media Type '

x-webhooks:
  sentMessage:
    post:
      tags:
        - Webhooks
      summary: Sent message webhook
      description: |
        This webhook sends you information about sent messages. You can use this webhook to save information about sent messages, such as message_id, gateway, timestamp, payload, etc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  request_id:
                    type: string
                    example: "bc36f3d1-d284-463a-921b-a3560c154649"
                  message_id:
                    type: string
                    description: Unique message identifier. (if you use `/messages` endpoint, then you will receive `message_id` with `-<recipient_index>` appended to the `message_id`).
                    example: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
                  gateway:
                    description: Used `flow` for the message.
                    type: string
                    enum:
                      - sms
                      - viber
                      - whatsapp_text
                      - whatsapp_template
                      - rcs
                    example: sms
                  timestamp:
                    type: integer
                    example: 1700000000
                  payload:
                    type: object
                    example:
                      campaign_id: "winter-sale"
                  type:
                    type: string
                    default: outgoing
                  to:
                    type: object
                    properties:
                      phone_number:
                        type: string
                        example: "420777123456"
                  result:
                    description: Result of the message sending. First, you will receive `sent` status, then another statuses will follow. If the message is rejected, that means that the message was not even sent (typical reason is insufficient credit or invalid phone number).
                    type: string
                    enum:
                      - delivered
                      - undelivered
                      - rejected
                      - failed
                      - sending
                      - sent
                      - seen
                  result_info:
                    type: string
                    description: |
                      Additional result code for the message in format "[code] Description". Code is optional, description is also optional. Result info can also contain only code inside square brackets or only description without code.

                      Common rejection codes:
                      - `[302]` Invalid phone number format
                      - `[303]` Phone number is not in allowed list
                      - `[304]` Phone number is blacklisted or opted-out
                      - `[306]` Too many identical messages for the same recipient
                      - `[307]` Insufficient credit
                    examples:
                      - "[307] Insufficient credit"
                      - "[131042] There was an error related to your payment method"
                      - "Unauthorized error"
                      - "[368]"
                  sms:
                    type: object
                    properties:
                      gateway:
                        description: Used specific gateway settings for the message.
                        type: string
                      sender:
                        description: Used sender for the message.
                        type: string
                      country:
                        description: Used country for the message (official `MCC` code).
                        type: integer
                      operator:
                        description: Used operator for the message (official `MNC` code or `0` for unknown/general operator).
                        type: integer
                      price_czk:
                        description: Price of the message in CZK.
                        type: number
                      price_eur:
                        description: Price of the message in EUR.
                        type: number
                      count:
                        description: Count of the parts (how many billed messages were sent).
                        type: integer
                  whatsapp_template:
                    type: object
                    properties:
                      sender:
                        description: Used sender for the message.
                        type: string
                      country:
                        description: Used country for the message (official `MCC` code).
                        type: integer
                      operator:
                        description: Used operator for the message (official `MNC` code or `0` for unknown/general operator).
                        type: integer
                      price_czk:
                        description: Price of the message in CZK.
                        type: number
                      price_eur:
                        description: Price of the message in EUR.
                        type: number
                      count:
                        description: Count of the parts (how many billed messages were sent).
                        type: integer
                  viber:
                    type: object
                    properties:
                      sender:
                        description: Used sender for the message.
                        type: string
                      country:
                        description: Used country for the message (official `MCC` code).
                        type: integer
                      operator:
                        description: Used operator for the message (official `MNC` code or `0` for unknown/general operator).
                        type: integer
                      price_czk:
                        description: Price of the message in CZK.
                        type: number
                      price_eur:
                        description: Price of the message in EUR.
                        type: number
                      count:
                        description: Count of the parts (how many billed messages were sent).
                        type: integer
                  whatsapp_body:
                    type: object
                    properties:
                      sender:
                        description: Used sender for the message.
                        type: string
                      country:
                        description: Used country for the message (official `MCC` code).
                        type: integer
                      operator:
                        description: Used operator for the message (official `MNC` code or `0` for unknown/general operator).
                        type: integer
                      price_czk:
                        description: Price of the message in CZK.
                        type: number
                      price_eur:
                        description: Price of the message in EUR.
                        type: number
                      count:
                        description: Count of the parts (how many billed messages were sent).
                        type: integer
            examples:
              Message delivered:
                value:
                  - request_id: "bc36f3d1-d284-463a-921b-a3560c154649"
                    message_id: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
                    gateway: sms
                    timestamp: 1700000000
                    payload:
                      campaign_id: "winter-sale"
                    type: outgoing
                    to:
                      phone_number: "420777123456"
                    result: delivered
                    result_info: "[0] Delivered"
              Message rejected insufficient credit:
                value:
                  - request_id: "bc36f3d1-d284-463a-921b-a3560c154649"
                    message_id: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
                    gateway: sms
                    timestamp: 1700000000
                    type: outgoing
                    to:
                      phone_number: "420777123456"
                    result: rejected
                    result_info: "[307] Insufficient credit"
  incomingReplyMessage:
    post:
      tags:
        - Webhooks
      summary: Incoming reply message webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique request identifier used for sent message to the recipient.
                    example: "bc36f3d1-d284-463a-921b-a3560c154649"
