      x-mint:
        metadata:
          sidebarTitle: "Register device"
      tags:
        - partner
      summary: Register push device
      description: Registers (or updates) a push notification device. A device id already registered by another API key cannot be re-registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - token
              properties:
                id:
                  type: string
                  description: Device id.
                token:
                  type: string
                  description: Push token of the device.
            example:
              id: "device-uuid-123"
              token: "fcm-token-xyz"
      responses:
        '200':
          description: Device registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'id' or 'token' in request data
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Device is owned by another apikey
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /recipient/register:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Register recipient"
      tags:
        - partner
      summary: Register recipient
      description: |
        Creates a new recipient (when `id` is omitted, a new id is generated) or updates an existing recipient's phone number and push tokens. Only the provided fields are updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Recipient id. Omit to create a new recipient.
                phone_number:
                  type: string
                  description: Phone number of the recipient.
                fcm_token:
                  type: string
                  description: Android (FCM) push token.
                apns_token:
                  type: string
                  description: iOS (APNs) push token.
            examples:
              New recipient:
                value:
                  phone_number: "420777123456"
                  fcm_token: "fcm-abc"
              Update recipient:
                value:
                  id: "b1f2c3d4-5678-90ab-cdef-1234567890ab"
                  apns_token: "apns-xyz"
      responses:
        '200':
          description: Recipient registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  recipient:
                    type: string
                    description: Recipient id.
              example:
                success: true
                recipient: "b1f2c3d4-5678-90ab-cdef-1234567890ab"
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to register recipient

  /connect/{connector}/{action}:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Connector action"
      tags:
        - partner
      summary: Connector action
      description: |
        Executes an action of a connected integration. Currently the `klaviyo` connector is supported with actions `segments`, `recipients`, `senders` and `me`.

        - `segments` — lists the account's segments: `{ "success": true, "segments": [{ "id", "name" }] }`
        - `recipients` — lists phone numbers in a segment (requires body field `segment_id`): `{ "success": true, "recipients": ["420777123456"] }`
        - `senders` — lists available senders: `{ "success": true, "senders": [{ "type": "sms", "name": "info-sms" }] }`
        - `me` — returns the connected account info: `{ "success": true, "account": { ... }, "currency": "eur" }`
      parameters:
        - name: connector
          in: path
          required: true
          schema:
            type: string
            enum:
              - klaviyo
          description: Connector name.
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - segments
              - recipients
              - senders
              - me
          description: Connector action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_userid
              properties:
                app_userid:
                  type: string
                  description: Application user id of the connected account.
                segment_id:
                  type: string
                  description: Segment id (required for the `recipients` action).
            examples:
              List segments:
                value:
                  app_userid: "user-123"
              List recipients of a segment:
                value:
                  app_userid: "user-123"
                  segment_id: "SEG123"
      responses:
        '200':
          description: Action result (shape depends on the action)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Segments:
                  value:
                    success: true
                    segments:
                      - id: "SEG123"
                        name: "VIP customers"
                Recipients:
                  value:
                    success: true
                    recipients:
                      - "420777123456"
                      - "420777000111"
                Not authenticated:
                  value:
                    success: false
                    message: "Klaviyo request not authenticated"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid 'app_userid' in request data
        '404':
          description: Unsupported connector or action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unsupported connector or action


