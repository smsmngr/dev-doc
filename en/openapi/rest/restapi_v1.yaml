  /billing/set:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Set billing"
      tags:
        - billing
      summary: Set billing contact
      description: |
        Updates the billing contact for a billing id owned by the calling key. `billing_id` is required plus at least one contact field. Shared child keys do not own a billing record and cannot use this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - billing_id
              properties:
                billing_id:
                  type: string
                name:
                  type: string
                  description: Company name.
                email:
                  type: string
                street:
                  type: string
                city:
                  type: string
                zip:
                  type: string
                country:
                  type: string
                  description: ISO country code (default `CZ`).
                company_id:
                  type: string
                  description: Company registration number.
                company_vat:
                  type: string
                  description: VAT number.
                dryrun:
                  type: boolean
                  description: If `true`, only validates the request without saving.
            examples:
              Update contact:
                value:
                  billing_id: "1234"
                  name: "ACME s.r.o."
                  email: "invoicing@acme.example"
                  street: "Ulice 1"
                  city: "Praha"
                  zip: "11000"
                  country: "cz"
                  company_id: "12345678"
                  company_vat: "CZ12345678"
      responses:
        '200':
          description: Billing contact saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  dryrun:
                    type: boolean
                    description: Present only for dry runs.
              example:
                success: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing billing id:
                  value:
                    message: Missing 'billing_id' in request data
                Missing fields:
                  value:
                    message: Missing required fields in request data
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Apikey is not authorized for this billing_id
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

