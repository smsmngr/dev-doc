    post:
      x-mint:
        metadata:
          sidebarTitle: "Cancel schedule"
      tags:
        - messaging
      summary: Cancel a scheduled message or bulk upload
      description: |
        Cancels a previously scheduled single message (`message_id`) or a scheduled bulk upload (`bulk_id`). Provide exactly one of the two fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                  description: Id of the scheduled message. Do not combine with `bulk_id`.
                bulk_id:
                  type: string
                  description: Id of the scheduled bulk upload. Do not combine with `message_id`.
            examples:
              Cancel message:
                value:
                  message_id: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
              Cancel bulk:
                value:
                  bulk_id: "batch-2026-07-31"
      responses:
        '200':
          description: Schedule cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: Schedule cancelled
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'message_id' or 'bulk_id' in request data
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
