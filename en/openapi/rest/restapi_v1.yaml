  /requests:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Daily stats"
      tags:
        - status
      summary: Get aggregated statistics per date
      description: Returns aggregated sending statistics grouped per date, for one or more dates, optionally filtered by tag. With `group=tag`, it returns a breakdown per tag instead of the per-date aggregate.
      parameters:
        - name: dates
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated list of dates (`YYYY-MM-DD,YYYY-MM-DD,...`).
          example: "2026-07-29,2026-07-30"
        - name: subid
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Sub-account id.
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter by tag.
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum:
              - tag
          description: Optional grouping of the statistics. With `tag`, `stats` is returned as an array with one item per tag, each with the tag value in the `key` field. If omitted, the statistics are aggregated across all tags of the date.
      responses:
        '200':
          description: Aggregated statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  requests:
                    type: array
                    description: One item per date with data (dates without data are omitted).
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        tags:
                          type: array
