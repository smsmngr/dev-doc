                                  flow_stats:
                                    type: object
                                    description: Counters per flow step, keyed by step index and then by channel (e.g. `sms`, `whatsapp_template`). Delivery metrics (`delivered`, `nondelivered`, `seen`, `clicked`, `replied`, `optout`) count each message at most once per step; `sent` and `notsent` count send attempts.
                                    additionalProperties:
                                      type: object
                                      description: Channels used in the step, keyed by channel name.
                                      additionalProperties:
                                        type: object
                                        properties:
                                          sent:
                                            type: integer
                                          notsent:
                                            type: integer
                                          delivered:
                                            type: integer
                                          nondelivered:
                                            type: integer
                                          seen:
                                            type: integer
