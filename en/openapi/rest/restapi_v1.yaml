  /messaging/url:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Bulk upload URL"
      tags:
        - messaging
      summary: Get bulk upload URL
      description: |
        Returns a presigned upload URL (valid 60 seconds) for submitting a bulk message file. The file is a JSONL (one JSON message per line, same format as the JSON API v2 `Message`) or a gzipped JSONL. Upload the file with `PUT` and `Content-Type: application/jsonl` (for `jsonl`) or `application/gzip` (for `gz`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bulk_id
                - filetype
              properties:
                bulk_id:
                  type: string
                  description: Your identifier of the bulk upload.
                filetype:
                  type: string
                  enum:
                    - jsonl
                    - gz
                  description: File type of the upload.
                datetime:
                  type: string
                  format: date-time
                  description: Optional scheduled processing time (UTC).
            examples:
              JSONL upload:
                value:
                  bulk_id: "batch-2026-07-30"
                  filetype: "jsonl"
              Scheduled gzip upload:
                value:
                  bulk_id: "batch-2026-07-31"
                  filetype: "gz"
                  datetime: "2026-07-31T08:00:00Z"
      responses:
        '200':
          description: Upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  url:
                    type: string
                    description: Presigned PUT URL, valid for 60 seconds.
              example:
                success: true
                url: "https://smsmngr-bulk-uploads.s3.amazonaws.com/...&X-Amz-Expires=60..."
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing fields:
                  value:
                    message: Missing 'bulk_id' or 'filetype' or 'datetime' in request data
                Unsupported filetype:
                  value:
                    message: Unsupported filetype
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to generate upload URL

  /messaging/validate:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Validate messages"
      tags:
        - messaging
      summary: Validate messages without sending
      description: |
        Validates a send request without sending or charging anything. It accepts the same body as the JSON API v2 sending endpoints: a single `Message` object (like `POST /message`) or an array of 1 to 10 `Message` objects (like `POST /messages`). Only the structure is checked: fields and their types, flow steps and the format of recipient numbers. Deliverability, sender approval, opt-out lists and credit are not checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: A single message in the JSON API v2 `Message` format.
                - type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                  description: An array of messages in the JSON API v2 `Message` format.
            examples:
              Single message:
                value:
                  to:
                    - phone_number: "420777123456"
                  body: "Hello!"
              Multiple messages:
                value:
                  - to:
                      - phone_number: "420777123456"
                      - phone_number: "123"
                    body: "Hello!"
                  - to:
                      - phone_number: "420777123457"
                    flow:
                      - sms:
                          body: "Hello via lowcost!"
                          gateway: "lowcost"
      responses:
        '200':
          description: Validation result (returned even when the request content is invalid; see `success`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` only when all messages and all recipients passed validation (both `rejected` and `errors` are empty).'
                  validate:
                    type: object
                    properties:
                      accepted:
                        type: array
                        description: Items that passed validation. For a single message, `key` indexes the recipient in `to` (like `POST /message`); for an array of messages, `key` indexes the submitted array (like `POST /messages`).
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Index of the recipient (single message) or of the message in the request array.
                            phone_number:
                              type: string
                              description: Recipient number as sent (present only for a single-message request).
                      rejected:
                        type: array
                        description: Items that failed validation, with the same `key` semantics as `accepted`. Details are in `errors`, linked by `key`.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            phone_number:
                              type: string
                              description: Recipient number as sent (present only for a single-message request).
                      errors:
                        type: array
                        description: All validation errors. Always present (an empty array when everything passed).
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Key of the related item in `rejected`. Omitted for message-level errors in a single-message request.
                            field:
                              type: string
                              description: Path to the invalid field (e.g. `flow[0].sms.gateway`, `to[1].phone_number`).
                            message:
                              type: string
                            code:
                              type: string
                              description: Internal status code, if any (`302` for a badly formatted number).
              example:
                success: false
                validate:
                  accepted:
                    - key: "0"
                      phone_number: "420777123456"
                  rejected:
                    - key: "1"
                      phone_number: "123"
                  errors:
                    - key: "1"
                      field: "to[1].phone_number"
                      message: "Phone number is not in a valid format"
                      code: "302"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing body:
                  value:
                    message: Missing request body
                Too many messages:
                  value:
                    message: Request must contain 1 to 10 messages
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to validate message

  /messaging/cancel:
