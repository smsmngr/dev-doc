  /message:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Message status"
      tags:
        - status
      summary: Get message status
      description: Returns the full status of a single sent message by its `message_id`. Only messages sent by the calling key are returned.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Message id.
      responses:
        '200':
          description: Message status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type:
                      - object
                      - 'null'
                    description: '`null` if the message was not found (or is not owned by the calling key).'
                    properties:
                      status_code:
                        type:
                          - string
                          - 'null'
                        description: Sending status code (`200` = sent).
                      delivery_code:
                        type:
                          - string
                          - 'null'
                        description: Delivery status code (`201` = delivered, `202` = seen).
                      status_info:
                        type:
                          - string
                          - 'null'
                      tag:
                        type:
                          - string
                          - 'null'
                      body:
                        type: string
                      to:
                        type: object
                        description: The recipient object as submitted.
                      request_id:
                        type:
                          - string
                          - 'null'
                      ts_created:
                        type:
                          - string
                          - 'null'
                      ts_sent:
                        type:
                          - string
                          - 'null'
                      ts_delivered:
                        type:
                          - string
                          - 'null'
                      ts_seen:
                        type:
                          - string
                          - 'null'
                      ts_clicked:
                        type:
                          - string
                          - 'null'
                      ts_updated:
                        type:
                          - string
                          - 'null'
                      flow:
                        type: array
                        description: The original flow of the message.
                      flow_index:
                        type:
                          - string
                          - 'null'
                        description: Index of the flow step that was used.
                      flow_status:
                        type: object
                        description: Per-flow-step status codes, keyed by step index.
                      price:
                        type:
                          - number
                          - 'null'
              example:
                success: true
                message:
                  status_code: "200"
                  delivery_code: "201"
                  status_info: "Delivered"
                  tag: "newsletter"
                  body: "Hello world"
                  to:
                    phone_number: "420777123456"
                  request_id: "bc36f3d1-d284-463a-921b-a3560c154649"
                  ts_created: "2026-07-30T10:00:00Z"
                  ts_sent: "2026-07-30T10:00:01Z"
                  ts_delivered: "2026-07-30T10:00:04Z"
                  ts_seen: null
                  ts_clicked: null
                  ts_updated: "2026-07-30T10:00:05Z"
                  flow:
                    - sms: {}
                  flow_index: "0"
                  flow_status:
                    "0":
                      status_code: "200"
                      delivery_code: "201"
                  price: 1.2
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'id' in request data
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to read message

  /messages:
    get:
      x-mint:
        metadata:
          sidebarTitle: "List messages"
      tags:
        - status
      summary: List sent messages by date
      description: |
        Lists per-recipient message overview rows for the given date, with cursor pagination. Optionally filter by tag and/or phone number.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Date (`YYYY-MM-DD`).
          example: "2026-07-30"
        - name: subid
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Sub-account id.
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter by tag (comma-separated tags are normalized and sorted before matching).
        - name: phone_number
          in: query
          required: false
          schema:
            type: string
          description: Filter by recipient phone number.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor from the previous response (`next_cursor`).
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                        message_parts:
                          type: integer
                        ts_sent:
                          type:
                            - string
                            - 'null'
                        ts_delivered:
                          type:
                            - string
                            - 'null'
                        ts_updated:
                          type:
                            - string
                            - 'null'
                        ts_clicked:
                          type:
                            - string
                            - 'null'
                        ts_seen:
                          type:
                            - string
                            - 'null'
                        ts_replied:
                          type:
                            - string
                            - 'null'
                        ts_optout:
                          type:
                            - string
                            - 'null'
                        sent:
                          type: integer
                        delivered:
                          type: integer
                        seen:
                          type: integer
                        clicked:
                          type: integer
                        replied:
                          type: integer
                        optout:
                          type: integer
                        nondelivered:
                          type: integer
                        body:
                          type: string
                        flow:
                          type: string
                          description: Used channel.
                        sender:
                          type: string
                        phone_number:
                          type: string
                        price_czk:
                          type: string
                          description: Price in CZK (numeric string).
                        price_eur:
                          type: string
                          description: Price in EUR (numeric string).
                  next_cursor:
                    type:
                      - string
                      - 'null'
                    description: Pass back as `cursor` to fetch the next page; `null` when there are no more pages.
              example:
                success: true
                messages:
                  - message_id: "e27ff0ac-87b5-4e1d-b644-5fc6029e2a11"
                    message_parts: 1
                    ts_sent: "2026-07-30T10:00:01Z"
                    ts_delivered: "2026-07-30T10:00:04Z"
                    ts_updated: "2026-07-30T10:00:05Z"
                    ts_clicked: null
                    ts_seen: null
                    ts_replied: null
                    ts_optout: null
                    sent: 1
                    delivered: 1
                    seen: 0
                    clicked: 0
                    replied: 0
                    optout: 0
                    nondelivered: 0
                    body: "Hello world"
                    flow: "sms"
                    sender: "Mojefirma"
                    phone_number: "420777123456"
                    price_czk: "1.2"
                    price_eur: "0.05"
                next_cursor: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'date' or 'xapikey' in request data
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to read messages

