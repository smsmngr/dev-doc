                                count_clicked:
                                  type: integer
                                  description: Unique clicked messages, derived from the per-flow-step counters.
                                count_nondelivered:
                                  type: integer
                                count_sent:
                                  type: integer
                                count_notsent:
                                  type: integer
                                count_replied:
                                  type: integer
                                count_optout:
                                  type: integer
                                msg_sent:
                                  type: integer
                                price_czk:
                                  type: number
                                  description: Total price in CZK; refunds for unsent messages are deducted.
                                price_eur:
                                  type: number
                                  description: Total price in EUR; refunds for unsent messages are deducted.
                                first_ts_sent:
                                  type:
                                    - string
                                    - 'null'
                                  description: Unix timestamp (seconds) of the first send, as a string.
                                last_ts_sent:
                                  type:
                                    - string
                                    - 'null'
                                  description: Unix timestamp (seconds) of the last send, as a string.
                                msg_mccmnc:
                                  type: object
                                  description: Message counts per mobile network (MCC+MNC).
                                  additionalProperties:
                                    type: integer
                                count_notsent_codes:
                                  type: object
                                  description: Breakdown of `count_notsent` by rejection status code (300–399); the values add up to `count_notsent`.
                                  additionalProperties:
                                    type: integer
                                flow_stats:
                                  type: object
                                  description: Counters per flow step, keyed by step index and then by channel (e.g. `sms`, `whatsapp_template`). Delivery metrics (`delivered`, `nondelivered`, `seen`, `clicked`, `replied`, `optout`) count each message at most once per step; `sent` and `notsent` count send attempts.
                                  additionalProperties:
                                    type: object
                                    description: Channels used in the step, keyed by channel name.
                                    additionalProperties:
                                      type: object
                                      properties:
                                        sent:
                                          type: integer
                                        notsent:
                                          type: integer
                                        delivered:
                                          type: integer
                                        nondelivered:
                                          type: integer
                                        seen:
                                          type: integer
                                        clicked:
                                          type: integer
                                        replied:
                                          type: integer
                                        optout:
                                          type: integer
                            - title: Per tag (group=tag)
                              type: array
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                    description: Tag the item belongs to. A message with multiple tags keeps the comma-joined tag combination as a single key.
                                  count_delivered:
                                    type: integer
                                  count_seen:
                                    type: integer
                                    description: Unique seen messages, derived from the per-flow-step counters.
                                  count_clicked:
                                    type: integer
                                    description: Unique clicked messages, derived from the per-flow-step counters.
                                  count_nondelivered:
                                    type: integer
                                  count_sent:
                                    type: integer
                                  count_notsent:
                                    type: integer
                                  count_replied:
                                    type: integer
                                  count_optout:
                                    type: integer
                                  msg_sent:
                                    type: integer
                                  price_czk:
                                    type: number
                                    description: Total price in CZK; refunds for unsent messages are deducted.
                                  price_eur:
                                    type: number
                                    description: Total price in EUR; refunds for unsent messages are deducted.
                                  first_ts_sent:
                                    type:
                                      - string
                                      - 'null'
                                    description: Unix timestamp (seconds) of the first send, as a string.
                                  last_ts_sent:
                                    type:
                                      - string
                                      - 'null'
                                    description: Unix timestamp (seconds) of the last send, as a string.
                                  msg_mccmnc:
                                    type: object
                                    description: Message counts per mobile network (MCC+MNC).
                                    additionalProperties:
                                      type: integer
                                  count_notsent_codes:
                                    type: object
                                    description: Breakdown of `count_notsent` by rejection status code (300–399); the values add up to `count_notsent`.
                                    additionalProperties:
