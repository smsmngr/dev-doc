openapi: 3.1.0
info:
  title: REST API SmsManager
  description: |
    REST API for managing your SmsManager account: API keys, credit, billing, contact lists (blacklist / opt-out), message status reporting, inbox and bulk messaging support.

    ## Authentication

    API key is required for all requests — send it in the `x-api-key` HTTP header. You can find your API key in the [Developers section](https://app.smsmanager.com/app/developers/).

    For sending messages use the [JSON API v2](https://api.smsmngr.com/v2).
  version: v1
  contact:
    url: https://smsmanager.com
    email: cc@smsmanager.com

servers:
  - url: 'https://rest-api.smsmngr.com/v1'
    description: Production server

security:
  - x-api-key: []

components:
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message.

paths:
  /apikey/me:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Key info"
      tags:
        - api
      summary: Get current API key info
      description: |
        Returns the profile of the calling API key. This endpoint always reflects the live state of the key (enabled/disabled, senders, scope).
      responses:
        '200':
          description: API key info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  me:
                    type: object
                    properties:
                      note:
                        type: string
                        description: Your note attached to the API key.
                      default_callback_url:
                        type: string
                        description: Default webhook URL for delivery notifications.
                      callback_secret:
                        type: string
                        description: Secret for signing webhook requests (64 hex characters). Empty if signing is turned off. Managed via `default_callback_secret` on `/apikey/update`.
                      account:
                        type: string
                        enum:
                          - prepaid
                          - postpaid
                        description: Account type.
                      scope:
                        type: string
                        enum:
                          - full
                          - rest-api
                          - api
                        description: Scope of the API key. `full` and `rest-api` can change settings, `api` can only send messages.
                      share_senders:
                        type: string
                        description: '`"1"` if the key shares senders with its child keys.'
                      is_blocked:
                        type: integer
                        description: '`1` if the key is blocked.'
                      senders:
                        type: array
                        description: All registered senders of the key, one item per sender and channel.
                        items:
                          type: object
                          properties:
                            flow:
                              type: string
                              description: Channel of the sender (`sms`, `viber`, `whatsapp`, ...).
                            value:
                              type: string
                              description: Sender value (name or number).
                            name:
                              type: string
                              description: Display name of the sender.
                      default_sender:
                        type: string
                        description: Default sender of the account; used when a message doesn't set `sender` at any level. It can also be the name of a sender alias.
                      sender_aliases:
                        type: array
                        description: Sender aliases for this key. An alias is a single name you can send under, which resolves to a different registered sender for each recipient calling code. Set up by support.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Alias name that you use as the message `sender`.
                            prefixes:
                              type: object
                              additionalProperties:
                                type: string
                              description: Mapping of calling code to sender.
                      whitelist_ip:
                        type: array
                        items:
                          type: string
                        description: IP whitelist for sending. An entry containing `.` or `:` is matched as an exact IP address; any other entry is matched as a substring of the ISP/organization name of the request IP address. An empty array means no restriction. Managed via `/apikey/update`.
                      vat:
                        type: string
                        description: '`"1"` if the account is a VAT payer.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Account currency.
                      tz:
                        type: string
                        description: Account timezone.
                        example: Europe/Prague
              examples:
                Current key:
                  value:
                    success: true
                    me:
                      note: "eshop"
                      default_callback_url: "https://example.com/hook"
                      callback_secret: "3f1c9a0d8e7b64520f4a1b2c3d4e5f60718293a4b5c6d7e8f9012345a6b7c8d9"
                      account: "prepaid"
                      scope: "full"
                      share_senders: "1"
                      is_blocked: 0
                      senders:
                        - flow: "sms"
                          value: "Mojefirma"
                          name: "Mojefirma"
                        - flow: "sms"
                          value: "Mojefirma CZ"
                          name: "Mojefirma CZ"
                      default_sender: "Mojefirma"
                      sender_aliases:
                        - name: "brand"
                          prefixes:
                            "420": "Mojefirma CZ"
                            "421": "Mojefirma SK"
                      whitelist_ip:
                        - "1.2.3.4"
                        - "internet cz"
                      vat: "1"
                      currency: "czk"
                      tz: "Europe/Prague"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to load API key

  /apikey/add:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Create sub-key"
      tags:
        - api
      summary: Create a child API key
      description: |
        Creates a new child (sub) API key under the calling top-level key. Only a top-level key with scope `full` or `rest-api` can create child keys (max. 19 children).

        A `shared` child key inherits the parent's billing and currency and draws credit from the parent's wallet. A non-shared child key has its own billing — `billing_name`, `billing_email` and `currency` are then required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shared:
                  type: boolean
                  description: If `true`, the new key shares billing and credit with the parent key (its currency is inherited from the parent).
                billing_name:
                  type: string
                  description: Billing name. Required unless `shared` is `true`.
                billing_email:
                  type: string
                  description: Billing e-mail. Required unless `shared` is `true`.
                currency:
                  type: string
                  enum:
                    - czk
                    - eur
                  description: Currency of the new key. Required unless `shared` is `true` (a shared key inherits the parent's currency).
                app_userid:
                  type: string
                  description: Optional link to an application user. If a key for this user already exists, the existing key is returned instead of creating a new one.
                billing_id:
                  type: string
                  description: Optional existing billing id.
                note:
                  type: string
                  description: Your note for the new key.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: Scope of the new key.
                share_senders:
                  type: boolean
                  description: If `true`, the parent's registered senders (and WhatsApp numbers) are shared with the new key.
            examples:
              Child key with own billing:
                value:
                  billing_name: "ACME s.r.o."
                  billing_email: "invoicing@acme.example"
                  currency: "czk"
                  note: "eshop"
                  scope: "rest-api"
              Shared child key:
                value:
                  shared: true
                  note: "warehouse app"
                  scope: "api"
                  share_senders: true
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  apikey:
                    type: string
                    description: The new API key.
                  billing_id:
                    type:
                      - string
                      - 'null'
                    description: Billing id of the new key (`null` for a shared key).
              examples:
                Created:
                  value:
                    success: true
                    apikey: "aB3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: "1234"
                Created shared:
                  value:
                    success: true
                    apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing fields:
                  value:
                    message: Missing required fields in request data
                Invalid scope:
                  value:
                    message: Invalid scope value
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not top-level:
                  value:
                    message: Only a top-level apikey can create new apikeys
                Limit reached:
                  value:
                    message: Child apikey limit reached (19)
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/update:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Update key"
      tags:
        - api
      summary: Update API key
      description: |
        Updates settings of the calling API key or, when the `apikey` field is present, of one of its child keys. All settings are optional: only the fields present in the request are changed, and `null` (or an empty string) clears a value. A request without any recognized setting returns 400. Changing `default_callback_url` also updates the webhook URL on all senders of the key being updated.

        Updating a child key: only a top-level key can use the `apikey` field, and the target must be one of its child keys (see `/apikey/list`). All settings behave exactly as if the child key updated itself; for example, `default_sender` registration is checked against the child key's senders. This also works for child keys with scope `api`, which can't call this endpoint themselves. The `scope` and `disable` fields are accepted only together with `apikey`; a key can never change its own scope or blocked state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apikey:
                  type: string
                  description: Child API key to update instead of the calling key. Only a top-level key can use it, and the target must belong to it.
                default_callback_url:
                  type: [string, 'null']
                  description: Default webhook URL for delivery notifications. `null` or an empty string clears it.
                note:
                  type: [string, 'null']
                  description: Your note for the key. `null` or an empty string clears it.
                default_sender:
                  type: [string, 'null']
                  maxLength: 64
                  description: Default sender for messages that don't set `sender`. It can be a registered sender or the name of a sender alias. It must not contain `,` or `:`. `null` or an empty string clears it. A sender that isn't registered for the key is saved, but returned in `warning` and ignored when sending.
                whitelist_ip:
                  type: [array, 'null']
                  items:
                    type: string
                    maxLength: 100
                  maxItems: 50
                  description: IP whitelist for sending. An entry containing `.` or `:` is matched as an exact IP address (no CIDR ranges); any other entry is matched as a substring of the ISP/organization name of the request IP address. Messages sent from an address outside the whitelist are held for manual approval instead of being sent. `null` or an empty array removes the restriction. Entries must not contain `,`.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: New scope of the child key. Accepted only together with `apikey`.
                disable:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: '`1` blocks the child key, `0` unblocks it. Accepted only together with `apikey`.'
            examples:
              Set callback:
                value:
                  default_callback_url: "https://example.com/hook"
                  note: "eshop"
              Clear callback:
                value:
                  default_callback_url: null
              Set default sender:
                value:
                  default_sender: "Mojefirma"
              Set IP whitelist:
                value:
                  whitelist_ip:
                    - "1.2.3.4"
                    - "internet cz"
              Clear IP whitelist:
                value:
                  whitelist_ip: null
              Update a child key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  default_sender: "Mojefirma"
                  note: "eshop child"
              Block a child key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  disable: 1
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  warning:
                    type: string
                    description: Set when the settings were saved but something needs your attention, such as an unreachable callback URL or an unregistered default sender.
              example:
                success: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No settings to update
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Scope not allowed:
                  value:
                    message: Apikey scope 'api' is not allowed to change settings
                Not a parent:
                  value:
                    message: Only a top-level apikey can update child apikeys
                Not owner:
                  value:
                    message: Target apikey does not belong to this parent
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/list:
    get:
      x-mint:
        metadata:
          sidebarTitle: "List sub-keys"
      tags:
        - api
      summary: List child API keys
      description: Lists child API keys created by the calling key.
      responses:
        '200':
          description: List of child API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  list:
                    type: array
                    items:
                      type: string
                    description: Child API keys.
              example:
                success: true
                list:
                  - "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  - "eF5xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/change:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Change sub-key"
      tags:
        - api
      summary: Change a child API key (deprecated)
      deprecated: true
      description: |
        **Deprecated**: use `/apikey/update` with the `apikey` field instead. It covers `scope`/`disable` and all other child key settings. This endpoint keeps working for existing integrations.

        Changes the scope and/or blocked state of a child API key. Only the parent (top-level) key can change its children; the parent cannot change itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apikey
              properties:
                apikey:
                  type: string
                  description: The child API key to change.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: New scope of the child key. At least one of `scope` / `disable` is required.
                disable:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: '`1` blocks the child key, `0` unblocks it. At least one of `scope` / `disable` is required.'
            examples:
              Change scope:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  scope: "api"
              Disable key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  disable: 1
      responses:
        '200':
          description: API key changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing apikey:
                  value:
                    message: Missing 'apikey' in request data
                Missing change:
                  value:
                    message: Missing 'scope' or 'disable' in request data
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not owner:
                  value:
                    message: Target apikey does not belong to this parent
                Self change:
                  value:
                    message: Parent apikey cannot change itself
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credit:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Credit balance"
      tags:
        - credit
      summary: Get credit balance
      description: 'Returns the current credit balance and price-level state of the calling key. For shared child keys (created with `shared: true`), it returns the balance of the shared (parent) wallet.'
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  credit:
                    type: object
                    properties:
                      priceLevels:
                        type: object
                        description: Map of `<platform>_<mcc>` to the reached discount-bracket index (only entries with an index greater than 0 are present).
                        additionalProperties:
                          type: integer
                      credit_czk:
                        type: string
                        description: Credit balance in CZK (numeric string).
                      credit_eur:
                        type: string
                        description: Credit balance in EUR (numeric string).
                      billing_id:
                        type: string
                        description: Billing id of the key (numeric string).
                      vat:
                        type: string
                        description: '`"1"` if the account is a VAT payer.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Account currency.
                      tz:
                        type: string
                        description: Account timezone.
                        example: Europe/Prague
              example:
                success: true
                credit:
                  priceLevels:
                    sms_230: 2
                  credit_czk: "150.5"
                  credit_eur: "0"
                  billing_id: "1234"
                  vat: "1"
                  currency: "czk"
                  tz: "Europe/Prague"
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to check credit

  /credit/services:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Service catalog"
      tags:
        - credit
      summary: Get service catalog
      description: |
        Returns the catalog of orderable paid services (senders, virtual numbers, SIM hosting, ...). The catalog is structured as `services.sender.<platform>.<country_calling_code>.<variant>`. The flat service id used by `/credit/order` is composed as `sender_<platform>_<calling_code>_<variant>` (e.g. `sender_sms_420_alnum`).

        Each service variant contains: localized `name` (and optional `requirements` and `delay`), `subject` (`defined` = you supply the subject such as sender text or phone number, `assigned` = a pooled number is assigned automatically, `order` = the operator assigns a number later, see `/credit/orders`), optional default `status`, and `prices` per currency with `setup`, `monthly` and optional `min_interval` (`month` / `year`) or `min_monthly_spend`.
      responses:
        '200':
          description: Service catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  services:
                    type: object
                    description: Nested service catalog.
              example:
                success: true
                services:
                  sender:
                    sms:
                      "420":
                        alnum:
                          name:
                            cs: "Textový odesílatel"
                            en: "Text ID sender"
                          subject: "defined"
                          status: "new"
                          prices:
                            czk:
                              setup: 500
                              monthly: 500
                            eur:
                              setup: 20
                              monthly: 20
                        simhost:
                          name:
                            cs: "SIM hosting"
                            en: "SIM hosting"
                          subject: "defined"
                          prices:
                            czk:
                              setup: 200
                              monthly: 100
                              min_interval: "year"
                            eur:
                              setup: 8
                              monthly: 4
                              min_interval: "year"

  /credit/prices:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Price list"
      tags:
        - credit
      summary: Get price list
      description: |
        Returns the per-destination price list, keyed by channel (`sms`, `smsdirect`, `smscustom`, `viber`) and country calling code. Each entry contains the country `mcc`, `price_czk`, `price_eur` and optionally per-operator overrides in `operators`.
      responses:
        '200':
          description: Price list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prices:
                    type: object
                    description: Price list keyed by channel and country calling code.
              example:
                success: true
                prices:
                  sms:
                    "420":
                      mcc: 230
                      price_czk: 0.89
                      price_eur: 0.04
                      operators:
                        "1":
                          price_czk: 0.89
                          price_eur: 0.04
                    "49":
                      mcc: 262
                      price_czk: 1.85
                      price_eur: 0.08
                  viber:
                    "420":
                      mcc: 230
                      price_czk: 0.39
                      price_eur: 0.016

  /credit/price:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Destination price"
      tags:
        - credit
      summary: Get price for a destination
      description: |
        Returns your current prices for a single destination number, per channel. The prices already include the volume discount you have reached, so they can be lower than the general price list from `GET /credit/prices`. Channels that don't deliver to the destination are omitted from `prices`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  description: Destination phone number. The international format (E.164, without leading `+` or `00`) is recommended, but other formats are accepted too (we convert them to the international format).
                  example: "420777123456"
                platform:
                  type: string
                  enum:
                    - sms
                    - viber
                    - whatsapp_text
                    - whatsapp_template
                    - rcs
                  description: Optional flow channel filter. If set, only prices for this channel are returned.
            examples:
              All channels:
                value:
                  to: "420777123456"
              Single channel:
                value:
                  to: "420777123456"
                  platform: "sms"
      responses:
        '200':
          description: Prices for the destination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  price:
                    type: object
                    properties:
                      to:
                        type: string
                        description: Destination number as sent.
                      normalized:
                        type: string
                        description: Destination number converted to the international format.
                      calling_code:
                        type: string
                        description: Detected country calling code.
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Account currency.
                      prices:
                        type: object
                        description: Prices keyed by flow channel (`sms`, `viber`, `whatsapp_text`, `whatsapp_template`, `rcs`). `sms` contains one entry per gateway plus `default` (a copy of `high`); the other channels contain only `default`. Channels that don't deliver to the destination are omitted.
                        additionalProperties:
                          type: object
                          description: Prices keyed by gateway; `default` is always present.
                          additionalProperties:
                            type: object
                            properties:
                              mcc:
                                type: integer
                                description: Mobile country code of the destination.
                              price_czk:
                                type: number
                                description: Price per message part in CZK.
                              price_eur:
                                type: number
                                description: Price per message part in EUR.
              example:
                success: true
                price:
                  to: "420777123456"
                  normalized: "420777123456"
                  calling_code: "420"
                  currency: "czk"
                  prices:
                    sms:
                      default:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                      high:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                      lowcost:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                      direct:
                        mcc: 230
                        price_czk: 1.25
                        price_eur: 0.05
                      custom:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                      simhost:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                      gsm:
                        mcc: 230
                        price_czk: 0.92
                        price_eur: 0.04
                    viber:
                      default:
                        mcc: 230
                        price_czk: 0.39
                        price_eur: 0.016
                    whatsapp_text:
                      default:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                    whatsapp_template:
                      default:
                        mcc: 230
                        price_czk: 0.1
                        price_eur: 0.004
                    rcs:
                      default:
                        mcc: 230
                        price_czk: 0.89
                        price_eur: 0.04
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing to:
                  value:
