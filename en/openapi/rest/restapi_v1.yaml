  /inbox:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Inbox"
      tags:
        - inbox
      summary: Get inbox messages by date
      description: Returns inbound (received) messages for the given date.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Date (`YYYY-MM-DD`).
          example: "2026-07-30"
      responses:
        '200':
          description: Inbox messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  inbox:
                    type: array
                    items:
                      type: object
                      properties:
                        ts_received:
                          type: string
                        body:
                          type: string
                        from:
                          type: string
                          description: Sender phone number.
                        to:
                          type: string
                          description: Your recipient number/sender.
                        gateway:
                          type: string
                        payload:
                          type:
                            - object
                            - 'null'
                          description: Original payload of the related outbound message, if any.
                        original:
                          type:
                            - object
                            - 'null'
                          description: >-
                            The outgoing message this message replies to, if the incoming
                            message could be matched. `null` for unsolicited incoming messages.
                          properties:
                            message_id:
                              type: string
                              description: ID of the original outgoing message; use it with `GET /message`.
                            body:
                              type: string
                              description: Text of the original outgoing message.
                            sender:
                              type: string
                              description: Sender the original message was sent from. Empty for a short code.
                            created:
                              type:
                                - integer
                                - 'null'
                              description: When the original message was created (Unix timestamp in seconds).
                        media:
                          type:
                            - object
                            - 'null'
                          description: >-
                            Media attached to the incoming message (WhatsApp/RCS image, video, audio,
                            document, sticker, shared location or contact cards). `null` for text-only
                            messages. For binary types, the file is stored at a persistent public URL
                            in the `url` field; if the file could not be stored, `url` is missing and
                            the `error` field is set instead. The other metadata is returned either way.
                          properties:
                            type:
                              type: string
                              enum: [image, video, audio, document, sticker, location, contacts]
                              description: Content type of the attachment.
                            url:
                              type: string
                              description: Persistent public URL of the stored file. Missing if the file could not be stored.
                            mime_type:
                              type: string
                              description: MIME type as reported by the channel.
                            filename:
                              type: string
                              description: Original file name (documents).
                            caption:
                              type: string
                              description: Caption sent with the media. If the message has no text, it is also returned as `body`.
                            size:
                              type: integer
                              description: File size in bytes, if known.
                            animated:
                              type: boolean
                              description: Whether the sticker is animated (stickers only).
                            thumbnail:
                              type: string
                              description: Persistent public URL of the stored thumbnail (RCS only).
                            location:
                              type: object
                              description: Shared location (only when `type` is `location`).
                              properties:
                                latitude:
                                  type: number
                                longitude:
                                  type: number
                                name:
                                  type: string
                                address:
                                  type: string
                            contacts:
                              type: array
                              description: Shared contact cards (only when `type` is `contacts`), as provided by the channel.
                              items:
                                type: object
                            provider_id:
                              type: string
                              description: Media/message ID assigned by the channel provider.
                            error:
                              type: string
                              enum: [download_failed, too_large, no_token]
                              description: Set instead of `url` if the file could not be stored.
              example:
                success: true
                inbox:
                  - ts_received: "2026-07-30T11:22:33Z"
                    body: "STOP"
                    from: "420777123456"
                    to: "Mojefirma"
                    gateway: "sms"
                    payload: null
                    original: null
                    media: null
                  - ts_received: "2026-07-30T11:25:02Z"
                    body: "YES"
                    from: "420777654321"
                    to: "Mojefirma"
                    gateway: "sms"
                    payload:
                      order_id: 42
                    original:
                      message_id: "01J8ZQ2V9K"
                      body: "Confirm your order by replying YES."
                      sender: "Mojefirma"
                      created: 1785410553
                    media: null
                  - ts_received: "2026-07-30T12:34:56Z"
                    body: "photo of the damaged package"
                    from: "420777123456"
                    to: "420736352552"
                    gateway: "whatsapp"
                    payload: null
                    original: null
                    media:
                      type: "image"
                      url: "https://smsmngr-inbound-media.s3.eu-central-1.amazonaws.com/3f7a1c9b2e4d5f60718293a4b5c6d7e8.jpg"
                      mime_type: "image/jpeg"
                      caption: "photo of the damaged package"
                      size: 245731
                      provider_id: "1234567890123456"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'date' or 'xapikey' in request data
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /blacklist:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Download blacklist"
      tags:
        - blacklist
      summary: Download blacklist
      description: Returns a presigned URL (valid 60 seconds) to download the blacklist CSV.
      parameters:
        - name: subid
          in: query
          required: false
          schema:
            type: string
            default: default
          description: Sub-account id.
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  url:
                    type: string
                    description: Presigned download URL, valid for 60 seconds.
              example:
                success: true
                url: "https://smsmngr-managed-contactlist.s3.amazonaws.com/...&X-Amz-Expires=60..."
        '404':
          description: Blacklist not found (no numbers stored yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: Blacklist not found
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: false
                message: Failed to generate download URL
    post:
      x-mint:
        metadata:
          sidebarTitle: "Add to blacklist"
      tags:
        - blacklist
      summary: Add numbers to blacklist
      description: |
        Adds phone numbers to the account's blacklist. Numbers are normalized (Czech 9-digit mobile numbers get `420` prepended) and processed asynchronously — the call returns the count of accepted numbers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  description: Newline-separated list of phone numbers.
                  example: "420777123456\n420777654321"
                subid:
                  type: string
                  default: default
                  description: Sub-account id.
            examples:
              Add numbers:
                value:
                  to: "420777123456\n776654321"
                  subid: "default"
      responses:
        '200':
          description: Numbers accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  accepted:
                    type: integer
                    description: Count of unique valid numbers accepted.
                  invalid:
                    type: array
                    items:
                      type: string
                    description: Input lines that could not be parsed as phone numbers.
              example:
                success: true
                accepted: 2
                invalid: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  invalid:
                    type: array
                    items:
                      type: string
              examples:
                Missing to:
                  value:
                    success: false
                    message: "Missing 'to'"
                No valid numbers:
                  value:
                    success: false
                    message: "No valid phone numbers"
                    invalid:
                      - "not-a-number"
        '500':
