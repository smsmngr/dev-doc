  /partner/signup:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Partner signup"
      tags:
        - partner
      summary: Start partner signup flow
      description: |
        Starts a partner-branded onboarding flow. Returns a signed token (valid 1 hour) and a hosted signup URL where the end user completes the registration. Available to partner accounts only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connector_name:
                  type: string
                  description: Name of the connector/integration.
                callback_url:
                  type: string
                  description: URL called by our system after the signup finishes.
                callback_data:
                  type: string
                  description: Opaque data passed back to the callback.
                final_url:
                  type: string
                  description: URL where the user is redirected after finishing the signup.
                partner_logo_url:
                  type: string
                  description: URL of the partner logo displayed on the signup page.
                partner_client_id:
                  type: string
                  description: Your identifier of the client.
                partner_client_data:
                  type: string
                  description: Opaque client data stored with the signup.
                language:
                  type: string
                  description: Language of the signup page.
                partner_copyright:
                  type: string
                  description: Copyright/footer text displayed on the signup page.
            examples:
              Start signup:
                value:
                  connector_name: "My Shop"
                  callback_url: "https://partner.example/callback"
                  callback_data: "abc"
                  final_url: "https://partner.example/done"
                  partner_logo_url: "https://partner.example/logo.png"
                  partner_client_id: "client-1"
                  language: "en"
                  partner_copyright: "© My Shop"
      responses:
        '200':
          description: Signup started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                    description: Signed signup token (valid 1 hour).
                  domain:
                    type: string
                  redirect_url:
                    type: string
                    description: Hosted signup URL for the end user.
              example:
                success: true
                token: "eyJhbGciOi..."
                domain: "connect.smsmanager.com"
                redirect_url: "https://connect.smsmanager.com/?configuration=eyJhbGciOi..."
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to new partner registration

