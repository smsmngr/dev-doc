                  summary: Aggregated per date (default)
                  value:
                    success: true
                    requests:
                      - date: "2026-07-30"
                        tags:
                          - "newsletter"
                          - "promo"
                        stats:
                          count_delivered: 120
                          count_seen: 40
                          count_clicked: 10
                          count_nondelivered: 3
                          count_sent: 125
