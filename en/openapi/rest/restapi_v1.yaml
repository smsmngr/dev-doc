  /credit/orders:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Ordered services"
      tags:
        - credit
      summary: List ordered services
      description: |
        Returns the paid services this API key has actually ordered, unlike `/credit/services`, which returns the catalog of orderable services. Use it to look up the order `subject`, which `/credit/cancel` requires exactly.

        Services ordered with `subject: order` don't have a number assigned at the time of the order. Until the operator assigns one, such a service is returned with `pending: true` and a placeholder `subject` that identifies the order but can't be used as a sender.
      responses:
        '200':
          description: Ordered services
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        service_id:
                          type: string
                          description: Flat service id from the catalog.
                        subject:
                          type: string
                          description: Subject of the ordered service. While `pending` is `true`, this is only a placeholder.
                        status:
                          type: [string, "null"]
                          description: Service status (`new`, `active`, `suspended`, `cancelled`).
                        created:
                          type: [string, "null"]
                          description: Order date (YYYY-MM-DD).
                        next_charge:
                          type: [string, "null"]
                          description: Date of the next recurring charge (YYYY-MM-DD). `null` until the service is activated.
                        charge_day:
                          type: [integer, "null"]
                          description: Day of the month the recurring charge is anchored to.
                        currency:
                          type: [string, "null"]
                        recurring_fee:
                          type: number
                          description: Amount charged in each billing period.
                        cancel_at_period_end:
                          type: boolean
                          description: '`true` if the service is flagged for cancellation at the end of the current paid period.'
                        pending:
                          type: boolean
                          description: '`true` until the operator has assigned the actual number.'
              example:
                success: true
                orders:
                  - service_id: "sender_sms_420_alnum"
                    subject: "Mojefirma"
                    status: "active"
                    created: "2026-08-15"
                    next_charge: "2026-11-15"
                    charge_day: 15
                    currency: "czk"
                    recurring_fee: 500
                    cancel_at_period_end: false
                    pending: false
                  - service_id: "sender_sms_420_mobilevn"
                    subject: "420012345678"
                    status: "new"
                    created: "2026-09-10"
                    next_charge: null
                    charge_day: 10
                    currency: "czk"
                    recurring_fee: 3600
                    cancel_at_period_end: false
                    pending: true
        '500':
          description: Listing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to list ordered services

  /credit/order:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Order service"
      tags:
        - credit
      summary: Order a paid service
      description: |
        Orders a paid service from the catalog (see `/credit/services`) and deducts the fee from your credit. The total fee is `setup + monthly × months`, where the number of months is derived from the service's minimal interval (`year` = 12, `quarter` = 3, otherwise 1). For services with `subject: defined` you must provide the subject (e.g. sender text or phone number); for `subject: assigned` a pooled number is assigned automatically. For `subject: order`, the operator assigns the number only after a few days: the order is accepted immediately with `pending: true` and a placeholder `subject` that identifies it until the actual number arrives. Ordering a service you already have with the same subject is rejected with `409` and nothing is charged. Use `dryrun` to validate the order (credit, availability) without any changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - period
              properties:
                service_id:
                  type: string
                  description: Flat service id from the catalog.
                  example: sender_sms_420_alnum
                period:
                  type: string
                  description: Requested billing period. Note that the effective billing period is determined by the service's minimal interval.
                  example: month
                subject:
                  type: string
                  description: 'The subject of the service (sender text, phone number, ...). Required for services with `subject: defined`.'
                payload:
                  type: object
                  description: Optional additional data stored with the service order.
                dryrun:
                  type: boolean
                  description: If `true`, only validates the order and returns the total fee without any changes.
            examples:
              Order text sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
              Dry run:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
                  dryrun: true
      responses:
        '200':
          description: Service ordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    type: object
                    properties:
                      subject:
                        type: string
                        description: Subject of the ordered service (for `assigned` services the allocated number).
                      subject_id:
                        type: string
                      status:
                        type: string
                        description: Initial status of the service (`new` or `active`).
                      pending:
                        type: boolean
                        description: '`true` if the number has not been assigned yet and `subject` is only a placeholder.'
                      dryrun:
                        type: boolean
                        description: Present only for dry runs.
                      total_fee:
                        type: number
                        description: Total fee (dry run only).
                      currency:
                        type: string
                        description: Currency of the fee (dry run only).
                      service_id:
                        type: string
                        description: Service id (dry run only).
              examples:
                Ordered:
                  value:
                    success: true
                    order:
                      subject: "Mojefirma"
                      subject_id: "Mojefirma"
                      status: "new"
                Ordered without a subject:
                  value:
                    success: true
                    order:
                      subject: "420012345678"
                      subject_id: "420012345678"
                      status: "new"
                      pending: true
                Dry run:
                  value:
                    success: true
                    order:
                      dryrun: true
                      total_fee: 1000
                      currency: "czk"
                      subject: null
                      service_id: "sender_sms_420_alnum"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '402':
          description: Insufficient credit for the total fee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Insufficient credit
        '409':
          description: The order conflicts with the current state; nothing was charged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Already ordered:
                  value:
                    message: Service already ordered
                No available sender:
                  value:
                    message: No available sender for this service
        '500':
          description: Order failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid service id

  /credit/cancel:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Cancel service"
      tags:
        - credit
      summary: Cancel a paid service
      description: |
        Flags an ordered service for cancellation at the end of its paid period. No immediate charge or refund happens; the service stays active until the end of the paid period. The call is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - subject
              properties:
                service_id:
                  type: string
                  description: Flat service id from the catalog.
                  example: sender_sms_420_alnum
                subject:
                  type: string
                  description: The exact subject of the ordered service.
                  example: Mojefirma
            examples:
              Cancel sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  subject: "Mojefirma"
      responses:
        '200':
          description: Service flagged for cancellation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cancel:
                    type: object
                    properties:
                      cancel_at_period_end:
                        type: boolean
                      active_until:
                        type:
                          - string
                          - 'null'
                        description: Date until which the service stays active (`YYYY-MM-DD`).
              example:
                success: true
                cancel:
                  cancel_at_period_end: true
                  active_until: "2026-08-15"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '500':
          description: Cancellation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not found:
                  value:
                    message: Service not found
                Already cancelled:
                  value:
                    message: Service already cancelled

