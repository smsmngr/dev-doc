  /messaging/url:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Bulk upload URL"
      tags:
        - messaging
      summary: Get bulk upload URL
      description: |
        Returns a presigned upload URL (valid 60 seconds) for submitting a bulk message file. The file is a JSONL (one JSON message per line, same format as the JSON API v2 `Message`) or a gzipped JSONL. Upload the file with `PUT` and `Content-Type: application/jsonl` (for `jsonl`) or `application/gzip` (for `gz`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bulk_id
                - filetype
              properties:
                bulk_id:
                  type: string
                  description: Your identifier of the bulk upload.
                filetype:
                  type: string
                  enum:
                    - jsonl
                    - gz
                  description: File type of the upload.
                datetime:
                  type: string
                  format: date-time
                  description: Optional scheduled processing time (UTC).
            examples:
              JSONL upload:
                value:
                  bulk_id: "batch-2026-07-30"
                  filetype: "jsonl"
              Scheduled gzip upload:
                value:
                  bulk_id: "batch-2026-07-31"
                  filetype: "gz"
                  datetime: "2026-07-31T08:00:00Z"
      responses:
        '200':
          description: Upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  url:
                    type: string
                    description: Presigned PUT URL, valid for 60 seconds.
              example:
                success: true
                url: "https://smsmngr-bulk-uploads.s3.amazonaws.com/...&X-Amz-Expires=60..."
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing fields:
                  value:
                    message: Missing 'bulk_id' or 'filetype' or 'datetime' in request data
                Unsupported filetype:
                  value:
                    message: Unsupported filetype
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to generate upload URL

