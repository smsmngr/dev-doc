openapi: 3.1.0
info:
  title: REST API SmsManager
  description: |
    REST API for managing your SmsManager account: API keys, credit, billing, contact lists (blacklist / opt-out), message status reporting, inbox and bulk messaging support.

    ## Authentication

    API key is required for all requests — send it in the `x-api-key` HTTP header. You can find your API key in your [account settings](https://app.smsmanager.com/api-cloud).

    For sending messages use the [JSON API v2](https://api.smsmngr.com/v2).
  version: v1
  contact:
    url: https://smsmanager.com
    email: cc@smsmanager.com

servers:
  - url: 'https://rest-api.smsmngr.com/v1'
    description: Production server

security:
  - x-api-key: []

components:
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message.

paths:
  /apikey/me:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Key info"
      tags:
        - api
      summary: Get current API key info
      description: |
        Returns the profile of the calling API key. This endpoint always reflects the live state of the key (enabled/disabled, senders, scope).
      responses:
        '200':
          description: API key info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  me:
                    type: object
                    properties:
                      note:
                        type: string
                        description: Your note attached to the API key.
                      default_callback_url:
                        type: string
                        description: Default webhook URL for delivery notifications.
                      account:
                        type: string
                        enum:
                          - prepaid
                          - postpaid
                        description: Account type.
                      scope:
                        type: string
                        enum:
                          - full
                          - rest-api
                          - api
                        description: Scope of the API key. `full` and `rest-api` can change settings, `api` can only send messages.
                      share_senders:
                        type: string
                        description: '`"1"` if the key shares senders with its child keys.'
                      is_blocked:
                        type: integer
                        description: '`1` if the key is blocked.'
                      senders:
                        type: array
                        description: Registered senders of the key.
                        items:
                          type: object
                          properties:
                            flow:
                              type: string
                              description: Channel of the sender (`sms`, `viber`, `whatsapp`, ...).
                            value:
                              type: string
                              description: Sender value (name or number).
                            name:
                              type: string
                              description: Display name of the sender.
                      vat:
                        type: string
                        description: '`"1"` if the account is a VAT payer.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Account currency.
                      tz:
                        type: string
                        description: Account timezone.
                        example: Europe/Prague
              examples:
                Current key:
                  value:
                    success: true
                    me:
                      note: "eshop"
                      default_callback_url: "https://example.com/hook"
                      account: "prepaid"
                      scope: "full"
                      share_senders: "1"
                      is_blocked: 0
                      senders:
                        - flow: "sms"
                          value: "Mojefirma"
                          name: "Mojefirma"
                      vat: "1"
                      currency: "czk"
                      tz: "Europe/Prague"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to load API key

  /apikey/add:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Create sub-key"
      tags:
        - api
      summary: Create a child API key
      description: |
        Creates a new child (sub) API key under the calling top-level key. Only a top-level key with scope `full` or `rest-api` can create child keys (max. 19 children).

        A `shared` child key inherits the parent's billing and currency and draws credit from the parent's wallet. A non-shared child key has its own billing — `billing_name`, `billing_email` and `currency` are then required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shared:
                  type: boolean
                  description: If `true`, the new key shares billing and credit with the parent key (its currency is inherited from the parent).
                billing_name:
                  type: string
                  description: Billing name. Required unless `shared` is `true`.
                billing_email:
                  type: string
                  description: Billing e-mail. Required unless `shared` is `true`.
                currency:
                  type: string
                  enum:
                    - czk
                    - eur
                  description: Currency of the new key. Required unless `shared` is `true` (a shared key inherits the parent's currency).
                app_userid:
                  type: string
                  description: Optional link to an application user. If a key for this user already exists, the existing key is returned instead of creating a new one.
                billing_id:
                  type: string
                  description: Optional existing billing id.
                note:
                  type: string
                  description: Your note for the new key.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: Scope of the new key.
                share_senders:
                  type: boolean
                  description: If `true`, the parent's registered senders (and WhatsApp numbers) are shared with the new key.
            examples:
              Child key with own billing:
                value:
                  billing_name: "ACME s.r.o."
                  billing_email: "invoicing@acme.example"
                  currency: "czk"
                  note: "eshop"
                  scope: "rest-api"
              Shared child key:
                value:
                  shared: true
                  note: "warehouse app"
                  scope: "api"
                  share_senders: true
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  apikey:
                    type: string
                    description: The new API key.
                  billing_id:
                    type:
                      - string
                      - 'null'
                    description: Billing id of the new key (`null` for a shared key).
              examples:
                Created:
                  value:
                    success: true
                    apikey: "aB3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: "1234"
                Created shared:
                  value:
                    success: true
                    apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                    billing_id: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing fields:
                  value:
                    message: Missing required fields in request data
                Invalid scope:
                  value:
                    message: Invalid scope value
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not top-level:
                  value:
                    message: Only a top-level apikey can create new apikeys
                Limit reached:
                  value:
                    message: Child apikey limit reached (19)
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/update:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Update key"
      tags:
        - api
      summary: Update current API key
      description: |
        Updates settings of the calling API key. Both fields must be present (an empty string clears the value). Changing `default_callback_url` also updates the webhook URL on all senders of the key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - default_callback_url
                - note
              properties:
                default_callback_url:
                  type: string
                  description: Default webhook URL for delivery notifications. Empty string clears it.
                note:
                  type: string
                  description: Your note for the key. Empty string clears it.
            examples:
              Set callback:
                value:
                  default_callback_url: "https://example.com/hook"
                  note: "eshop"
              Clear callback:
                value:
                  default_callback_url: ""
                  note: "eshop"
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'default_callback_url' or 'note' in request data
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Apikey scope 'api' is not allowed to change settings
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/list:
    get:
      x-mint:
        metadata:
          sidebarTitle: "List sub-keys"
      tags:
        - api
      summary: List child API keys
      description: Lists child API keys created by the calling key.
      responses:
        '200':
          description: List of child API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  list:
                    type: array
                    items:
                      type: string
                    description: Child API keys.
              example:
                success: true
                list:
                  - "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  - "eF5xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /apikey/change:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Change sub-key"
      tags:
        - api
      summary: Change a child API key
      description: |
        Changes the scope and/or blocked state of a child API key. Only the parent (top-level) key can change its children; the parent cannot change itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apikey
              properties:
                apikey:
                  type: string
                  description: The child API key to change.
                scope:
                  type: string
                  enum:
                    - full
                    - rest-api
                    - api
                  description: New scope of the child key. At least one of `scope` / `disable` is required.
                disable:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: '`1` blocks the child key, `0` unblocks it. At least one of `scope` / `disable` is required.'
            examples:
              Change scope:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  scope: "api"
              Disable key:
                value:
                  apikey: "cD4xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx40"
                  disable: 1
      responses:
        '200':
          description: API key changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing apikey:
                  value:
                    message: Missing 'apikey' in request data
                Missing change:
                  value:
                    message: Missing 'scope' or 'disable' in request data
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not owner:
                  value:
                    message: Target apikey does not belong to this parent
                Self change:
                  value:
                    message: Parent apikey cannot change itself
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credit:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Credit balance"
      tags:
        - credit
      summary: Get credit balance
      description: Returns the current credit balance and price-level state of the calling key.
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  credit:
                    type: object
                    properties:
                      priceLevels:
                        type: object
                        description: Map of `<platform>_<mcc>` to the reached discount-bracket index (only entries with an index greater than 0 are present).
                        additionalProperties:
                          type: integer
                      credit_czk:
                        type: string
                        description: Credit balance in CZK (numeric string).
                      credit_eur:
                        type: string
                        description: Credit balance in EUR (numeric string).
                      billing_id:
                        type: string
                        description: Billing id of the key (numeric string).
                      vat:
                        type: string
                        description: '`"1"` if the account is a VAT payer.'
                      currency:
                        type: string
                        enum:
                          - czk
                          - eur
                        description: Account currency.
                      tz:
                        type: string
                        description: Account timezone.
                        example: Europe/Prague
              example:
                success: true
                credit:
                  priceLevels:
                    sms_230: 2
                  credit_czk: "150.5"
                  credit_eur: "0"
                  billing_id: "1234"
                  vat: "1"
                  currency: "czk"
                  tz: "Europe/Prague"
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to check credit

  /credit/services:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Service catalog"
      tags:
        - credit
      summary: Get service catalog
      description: |
        Returns the catalog of orderable paid services (senders, virtual numbers, SIM hosting, ...). The catalog is structured as `services.sender.<platform>.<country_calling_code>.<variant>`. The flat service id used by `/credit/order` is composed as `sender_<platform>_<calling_code>_<variant>` (e.g. `sender_sms_420_alnum`).

        Each service variant contains: localized `name` (and optional `requirements` and `delay`), `subject` (`defined` = you supply the subject such as sender text or phone number, `assigned` = a pooled number is assigned automatically), optional default `status`, and `prices` per currency with `setup`, `monthly` and optional `min_interval` (`month` / `year`) or `min_monthly_spend`.
      responses:
        '200':
          description: Service catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  services:
                    type: object
                    description: Nested service catalog.
              example:
                success: true
                services:
                  sender:
                    sms:
                      "420":
                        alnum:
                          name:
                            cs: "Textový odesílatel"
                            en: "Text ID sender"
                          subject: "defined"
                          status: "new"
                          prices:
                            czk:
                              setup: 500
                              monthly: 500
                            eur:
                              setup: 20
                              monthly: 20
                        simhost:
                          name:
                            cs: "SIM hosting"
                            en: "SIM hosting"
                          subject: "defined"
                          prices:
                            czk:
                              setup: 200
                              monthly: 100
                              min_interval: "year"
                            eur:
                              setup: 8
                              monthly: 4
                              min_interval: "year"

  /credit/prices:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Price list"
      tags:
        - credit
      summary: Get price list
      description: |
        Returns the per-destination price list, keyed by channel (`sms`, `smsdirect`, `smscustom`, `viber`) and country calling code. Each entry contains the country `mcc`, `price_czk`, `price_eur` and optionally per-operator overrides in `operators`.
      responses:
        '200':
          description: Price list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prices:
                    type: object
                    description: Price list keyed by channel and country calling code.
              example:
                success: true
                prices:
                  sms:
                    "420":
                      mcc: 230
                      price_czk: 0.89
                      price_eur: 0.04
                      operators:
                        "1":
                          price_czk: 0.89
                          price_eur: 0.04
                    "49":
                      mcc: 262
                      price_czk: 1.85
                      price_eur: 0.08
                  viber:
                    "420":
                      mcc: 230
                      price_czk: 0.39
                      price_eur: 0.016

  /credit/notify:
    get:
      x-mint:
        metadata:
          sidebarTitle: "Alert settings"
      tags:
        - credit
      summary: Get low-credit notification settings
      description: Returns the low-credit e-mail alert settings of the calling key.
      responses:
        '200':
          description: Notification settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notify:
                    type:
                      - object
                      - 'null'
                    description: '`null` if never configured.'
                    properties:
                      email:
                        type: string
                        description: Alert recipient e-mail address.
                      value:
                        type: number
                        description: Credit threshold that triggers the alert.
                      enabled:
                        type: boolean
              examples:
                Configured:
                  value:
                    success: true
                    notify:
                      email: "ops@acme.example"
                      value: 100
                      enabled: true
                Not configured:
                  value:
                    success: true
                    notify: null
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      x-mint:
        metadata:
          sidebarTitle: "Set alert"
      tags:
        - credit
      summary: Set low-credit notification
      description: Sets the low-credit e-mail alert of the calling key. All fields are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - value
                - enable
              properties:
                email:
                  type: string
                  description: Alert recipient e-mail address.
                value:
                  type: number
                  description: Credit threshold that triggers the alert (must be greater than 0).
                enable:
                  type: boolean
                  description: Enable or disable the alert.
            examples:
              Enable alert:
                value:
                  email: "ops@acme.example"
                  value: 100
                  enable: true
      responses:
        '200':
          description: Notification saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing 'email', 'value' or 'enable' in request data
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Apikey scope 'api' is not allowed to change settings
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credit/order:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Order service"
      tags:
        - credit
      summary: Order a paid service
      description: |
        Orders a paid service from the catalog (see `/credit/services`) and deducts the fee from your credit. The total fee is `setup + monthly × months`, where the number of months is derived from the service's minimal interval (`year` = 12, `quarter` = 3, otherwise 1). For services with `subject: defined` you must provide the subject (e.g. sender text or phone number); for `subject: assigned` a pooled number is assigned automatically. Use `dryrun` to validate the order (credit, availability) without any changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - period
              properties:
                service_id:
                  type: string
                  description: Flat service id from the catalog.
                  example: sender_sms_420_alnum
                period:
                  type: string
                  description: Requested billing period. Note that the effective billing period is determined by the service's minimal interval.
                  example: month
                subject:
                  type: string
                  description: 'The subject of the service (sender text, phone number, ...). Required for services with `subject: defined`.'
                payload:
                  type: object
                  description: Optional additional data stored with the service order.
                dryrun:
                  type: boolean
                  description: If `true`, only validates the order and returns the total fee without any changes.
            examples:
              Order text sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
              Dry run:
                value:
                  service_id: "sender_sms_420_alnum"
                  period: "month"
                  subject: "Mojefirma"
                  dryrun: true
      responses:
        '200':
          description: Service ordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    type: object
                    properties:
                      subject:
                        type: string
                        description: Subject of the ordered service (for `assigned` services the allocated number).
                      subject_id:
                        type: string
                      status:
                        type: string
                        description: Initial status of the service (`new` or `active`).
                      dryrun:
                        type: boolean
                        description: Present only for dry runs.
                      total_fee:
                        type: number
                        description: Total fee (dry run only).
                      currency:
                        type: string
                        description: Currency of the fee (dry run only).
                      service_id:
                        type: string
                        description: Service id (dry run only).
              examples:
                Ordered:
                  value:
                    success: true
                    order:
                      subject: "Mojefirma"
                      subject_id: "Mojefirma"
                      status: "new"
                Dry run:
                  value:
                    success: true
                    order:
                      dryrun: true
                      total_fee: 1000
                      currency: "czk"
                      subject: null
                      service_id: "sender_sms_420_alnum"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '500':
          description: Order failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid service:
                  value:
                    message: Invalid service id
                Insufficient credit:
                  value:
                    message: Insufficient credit
                No available sender:
                  value:
                    message: No available sender for this service

  /credit/cancel:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Cancel service"
      tags:
        - credit
      summary: Cancel a paid service
      description: |
        Flags an ordered service for cancellation at the end of its paid period. No immediate charge or refund happens; the service stays active until the end of the paid period. The call is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - subject
              properties:
                service_id:
                  type: string
                  description: Flat service id from the catalog.
                  example: sender_sms_420_alnum
                subject:
                  type: string
                  description: The exact subject of the ordered service.
                  example: Mojefirma
            examples:
              Cancel sender:
                value:
                  service_id: "sender_sms_420_alnum"
                  subject: "Mojefirma"
      responses:
        '200':
          description: Service flagged for cancellation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cancel:
                    type: object
                    properties:
                      cancel_at_period_end:
                        type: boolean
                      active_until:
                        type:
                          - string
                          - 'null'
                        description: Date until which the service stays active (`YYYY-MM-DD`).
              example:
                success: true
                cancel:
                  cancel_at_period_end: true
                  active_until: "2026-08-15"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Missing required service fields in request data
        '500':
          description: Cancellation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Not found:
                  value:
                    message: Service not found
                Already cancelled:
                  value:
                    message: Service already cancelled

  /billing/get:
    post:
      x-mint:
        metadata:
          sidebarTitle: "Billing contact"
      tags:
        - billing
      summary: Get billing contact
      description: Returns the billing contact for a billing id owned by the calling key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - billing_id
              properties:
                billing_id:
                  type: string
                  description: Billing id (see `/credit`).
            example:
              billing_id: "1234"
      responses:
        '200':
          description: Billing contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  billing:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
